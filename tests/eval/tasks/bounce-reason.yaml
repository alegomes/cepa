# Tarefa dourada: card devolvido sem razão registrada.
#
# A mais fácil das três, e é por isso que ela está aqui: uma suíte só com
# tarefas difíceis não distingue duas versões do harness na faixa em que a
# maioria do trabalho real acontece. O caminho já existe no repo (há um gate
# irmão, com a mesma técnica), então o que se mede é se o agente ACHA esse
# precedente em vez de inventar um jeito próprio.

id: bounce-reason
titulo: "Devolução de card sem razão obriga re-arqueologia na sessão seguinte"
fix_commit: f875ad6
base_commit: a90272f
acceptance_test: tests/test_bounce_reason_gate.py
acceptance_cmd: "python3 tests/test_bounce_reason_gate.py"
dificuldade: baixa

contrato: |
  A verificação vai procurar um hook executável em
  `common/hooks/bounce-reason-gate.py` e chamá-lo como o Claude Code chama:
  o payload JSON do PreToolUse chega no stdin. O comentário que está sendo
  postado vem em `tool_input`, e o nome do campo muda conforme o servidor MCP
  em uso — os dois dialetos precisam funcionar.

  Ela espera **exit 2** para barrar e **exit 0** para deixar passar, com a
  explicação em stderr.

  O teste que julga isso é `tests/test_bounce_reason_gate.py` e roda com
  `python3 tests/test_bounce_reason_gate.py`.

prompt: |
  Neste repositório (a Cepa, um harness de plugins para Claude Code), cards do
  Jira voltam da coluna de Review para retrabalho quando a prova falha.

  O problema: essa devolução chega como um comentário dizendo "not proven" e
  mais nada. A sessão seguinte, que pode ser dias depois e com outra pessoa (ou
  outro agente) na frente, precisa reconstruir do diff por que o card voltou.
  Essa re-arqueologia é cara e às vezes chega na conclusão errada.

  Sua tarefa: fazer com que uma devolução sem razão declarada não seja possível.

  Restrições que o repositório impõe:
  - Nenhuma dependência de terceiros; só a biblioteca padrão do Python.
  - Teste rodável com `python3 tests/<arquivo>.py`, saindo não-zero em falha.
  - Os comentários desta casa aparecem em português e em inglês, e em markdown
    ou no markup de wiki do Jira. Todos precisam funcionar.
  - Falso positivo aqui é caro: existem vários outros tipos de comentário
    circulando (resumo de prova aprovada, escalação para humano, triagem,
    resumo de implementação) e nenhum deles pode ser barrado.
  - Um rótulo presente mas vazio não é uma razão.

  Antes de desenhar do zero, procure no repositório se já existe um gate que
  resolve um problema com esta mesma forma — campo obrigatório num comentário
  de Jira. Se existir, siga a técnica dele.
