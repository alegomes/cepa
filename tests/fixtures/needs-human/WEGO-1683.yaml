routing_reason: "All three behaviors (refresh-on-dispatch, normalizer, diff-and-block) are load-bearing\
  \ at the HTTP surface: P2 (external perturbation) turned TC-2/TC-3/TC-4 RED when the block guard was\
  \ disabled; P4 turned normalizer unit tests RED; P6 turned HisAtendimentoDiff + unit- integration tests\
  \ RED. GREEN→RED→GREEN chain is complete for the critical safety path.\nNEEDS-HUMAN is routed for two\
  \ reasons: 1. The feature flag (wego.refresh-on-dispatch.enabled) defaults to false. The proof\n   demonstrates\
  \ the mechanism works when the flag is on, but production protection\n   is contingent on the flag being\
  \ enabled in the deployment config. This is a\n   deployment-config gap, not a code gap — a human must\
  \ verify the flag is set in\n   staging/prod or accept the current opt-in posture as intentional.\n\
  2. The worktree's pom.xml at commit 657fc65 does not include pitest (added later in\n   cc574d9). PIT\
  \ was not run; perturbation was used throughout. The perturbation\n   proofs are sufficient (GREEN→RED→GREEN\
  \ for each changed surface) but PIT from\n   the primary tree was not re-run to validate kill ratios\
  \ — a reviewer may want\n   to run PIT from the current branch tip against these classes.\n"
