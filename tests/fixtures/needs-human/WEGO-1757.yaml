routing_reason: 'ACs 1-4, codificáveis e sob controle deste card, estão TODOS verificados no artefato
  em main via perturbação estática reexecutada de forma independente (diff antes/depois, sh -n, validação
  de YAML, recomputação da conta de 16 chamadas linha a linha contra PlugSignAdapter.java). Não há defeito
  de código a apontar. MAS o card é de OPERABILIDADE — seu critério de sucesso real é "o job que roda
  de fato tem o comportamento certo" — e isso não é verdade hoje: o schedule criado pelo dono aponta para
  origin/develop, que está 184 commits atrás de main e ainda roda a versão pré-fix do script (com -q,
  sem -am, sem identificar o endpoint que driftou). Isso não é um defeito de código perturbável (não há
  hunk que vire vermelho); é um descompasso de configuração/deploy entre o artefato corrigido e o ambiente
  que o executa, fora do meu poder de fixar (não faço merge/promote de branch nem edito o schedule do
  Bitbucket) e é uma decisão operacional do humano (mover o schedule para branch=main, ou promover main->develop
  antes). Por isso NEEDS-HUMAN, e não UNPROVEN: o código não falhou nenhuma prova; o gap é de ambiente.
  Adicionalmente, AC5 (quota) é suposição não confirmada com a Tecnospeed, registrad'
