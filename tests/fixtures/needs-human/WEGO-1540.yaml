routing_reason: 'Inner-layer proof is solid: all three perturbation targets (CPF validation, EQUIPE_CLINICA
  ordering, signAsAdmin in both casoC and webhook paths) go RED at their respective unit/application/api-rest
  Mockito tests. The unit tests for signAsAdmin are behaviorally load-bearing.

  The external-surface gap is structural and confirmed by direct perturbation: removing signAsAdmin from
  SolicitarAssinaturaService.executarCasoC() leaves the @QuarkusTest for Caso C GREEN (verified: ./mvnw
  -pl bootstrap -am test with -Dquarkus.flyway.clean-at-start=true, perturbed run = Tests run: 1, Failures:
  0). The mock is a no-op and the test only asserts on HTTP response fields that are set regardless of
  whether signAsAdmin is called. The same gap exists for the webhook→signAsAdmin path: no @QuarkusTest
  sends POST /webhooks/plugsign with status=Signed + a pedido that has EQUIPE_CLINICA pending.

  Additionally, Caso A (chain paciente→médico) and the criarRequestChain/criarLoteRequestChain adapter
  methods are dead code at this commit — executarCasoA throws unconditionally. There is no proof that
  chain ordering reaches the HTTP endpoint; it cannot until WEGO-1539 delivers getMedico().

  Escalating to human with tw'
