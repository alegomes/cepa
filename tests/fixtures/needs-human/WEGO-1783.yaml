routing_reason: 'O mecanismo do fix (@Fallback com applyOn=TimeoutException.class em TasyGatewayAdapter.buscarAtendimento)
  é genuinamente load-bearing — provado por perturbação real (RED em TasyGatewayFallbackTimeoutE2ETest
  quando quebrado). Mas esse teste chama o adapter diretamente, sem HTTP, e prova o mecanismo UMA VEZ
  — não por endpoint. Para os dois endpoints que ESTE card reivindica (GET .../sync/diff, PUT .../sync),
  o único teste citado (AtendimentoSyncGatewayUnavailableE2ETest) usa um mock que lança a exceção de domínio
  diretamente e por isso permanece VERDE mesmo com o @Fallback real quebrado — green-when-broken, confirmado
  por perturbação nesta sessão. Não existe no repositório nenhum teste que combine adapter real + WireMock
  com delay + chamada HTTP a qualquer um dos dois endpoints de sync. Como o card também admite textualmente
  ser "resolvido junto com o WEGO-1779, mesma mudança" e nenhum código endpoint-específico foi tocado,
  a evidência disponível para 1783 é estruturalmente idêntica à de 1779 — não há prova aditiva que pertença
  só a este card. NEEDS-HUMAN: decisão de tratar como duplicata (fechar 1783 quando 1779 fechar, sem prova
  externa própria) ou encomendar o teste HTTP+adapter-r'
