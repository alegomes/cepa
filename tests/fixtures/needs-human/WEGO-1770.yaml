routing_reason: 'O fix e load-bearing na camada onde foi testado: perturbando o hunk alterado (GlobalExceptionMapper.java
  linha ~55) o teste unitario que deveria capturar a distincao vai VERMELHO (mapsInboundRouteNotFoundToRouteNotFound),
  e o regression-red-at-base confirma que o bug realmente existia no commit pai (ae423a1). O lado inverso
  da distincao (recurso ausente -> not_found) ja tem cobertura HTTP real via 14 testes @QuarkusTest existentes
  (nao perturbados porque esse ramo nao foi tocado por este diff) e continua verde. Porem GlobalExceptionMapperTest
  NAO e um @QuarkusTest: ele instancia o mapper a mao e chama toResponse() diretamente, pulando o roteador
  HTTP do Quarkus. Isso significa que a prova de que route_not_found aparece de fato quando alguem bate
  um path inexistente (ex.: GET /rota/inventada) via HTTP real NAO EXISTE no repo. E exatamente o caso
  que a skill ''nunca deixe uma prova de camada interna substituir uma externa'' cobre: pode ser que o
  roteador RESTEasy Reactive do Quarkus trate rota nao mapeada ANTES do GlobalExceptionMapper, sem nunca
  lancar jakarta.ws.rs.NotFoundException — e ninguem testou isso. NEEDS-HUMAN: falta um teste @QuarkusTest+RestAssured
  batendo um path realment'
