routing_reason: 'The inner-layer proof (ValidarCoordenadasAssinaturaService unit tests via PIT: 23/25
  killed, 92%) is solid for the service class itself. Two surviving mutants on stream-filter lambdas are
  minor but worth noting. The critical gap is external: SolicitarAssinaturaService.execute() is externally-observable
  (wired to POST /api/v1/assinaturas), and its new Fase 2c call (validarCoordenadas.validar) has no @QuarkusTest
  that goes RED when that call is removed. SolicitarAssinaturaServiceTest mocks ValidarCoordenadasAssinaturaService,
  so it cannot detect the wiring gap. The V032 seed pre-configures camposAssinatura for all standard tipos,
  causing all E2E assinatura tests to hit AC1 (pre-configured field) — the rejection path (AC3: no field
  AND no request coordinates → 400) is never exercised at the HTTP surface. NEEDS-HUMAN: a @QuarkusTest
  asserting HTTP 400 with error body when coordenadas are absent for a tipo that requires them is structurally
  missing.

  '
