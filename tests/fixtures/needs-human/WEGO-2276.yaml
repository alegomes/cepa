      results:
      - 'Não existe teste automatizado que verifique afirmações de prosa em markdown; reverter um hunk
        da spec e rodar "o teste que deveria acusar" não tem correspondente para este card. Verificação
        feita foi leitura direta de origin/main (arquivo idêntico a e4b9bd21) contra os 4 pontos em aberto
        do card (registrados pelo item 17 da revisão de produto de 14/09): (1) rota para disparar o teste
        — seção "Entra", "Rota de teste — POST /api/v1/admin/portais/{portal}/credenciais/{credencialId}/teste:
        autentica no portal e descarta o material devolvido"; (2) onde o resultado fica guardado — seção
        "Estado e migração", quatro colunas novas na credencial (instante, resultado, mensagem, contador
        de falhas seguidas) mais tabela nova de tentativas com retenção de 30 dias; (3) como a listagem
        expõe o último resultado — CS-5 "GET .../credenciais traz, por credencial, o instante do último
        login, se passou, a mensagem curta e o contador de falhas seguidas" e CS-6/CS-11 cobrindo o caso
        de falha de abertura real marcar a credencial; (4) rótulo "com falha" na listagem distinto de
        "desativada" — decidido em Q11 ("sim... credencial que falha para todo mundo o dia inteiro fica
        verde até alguém clicar em testar") e refletido em CS-6. Os 12 critérios de sucesso (CS-1 a CS-12)
        têm "Superfície" e "Teste vermelho" preenchidos, o padrão deste repositório (confere com docs/spec/lote-e-listagens-administrativas.md
        e docs/spec/grupo-de-credenciais.md).

        '
      - 'Achado de staleness (não bloqueia a leitura do documento, mas é relevante para quem for revisar
        o desdobramento): parte da spec já foi construída por Stories do épico WEGO-2317 antes desta prova
        rodar. Encontrados em origin/main: migration bootstrap/src/main/resources/db/migration/V20260924000001__credencial_ultimo_login.sql
        (as quatro colunas descritas em "Estado e migração": ultimo_login_em, ultimo_login_resultado,
        ultimo_login_mensagem, falhas_seguidas, com os CHECK constraints coerentes com a regra "nulo =
        nunca testada"); rota POST /{credencialId}/teste em AdminCredenciaisResource.java:616-641, com
        javadoc citando "WEGO-2318, CS-1 de docs/spec/testar-acesso-de-credencial.md"; TestarCredencialService.java
        implementando exatamente CS-1 e CS-2 (autentica, descarta o material, nunca chama MaterialSessaoStorePort/SessaoRepositoryPort/
        TrilhaAuditoriaPort); TesteCredencialResponse.java com o contrato resultado=PASSOU|FALHOU + mensagem
        nullable saneada por GuardasDeCaptura, igual à spec; teste E2E bootstrap/src/test/java/.../e2e/AdminTestarCredencialE2ETest.java
        e bootstrap/src/test/java/.../e2e/CredencialUltimoLoginNaListagemE2ETest.java. Ou seja: os "testes
        vermelhos" citados em CS-1 e CS-2 ("a rota não existe — o POST responde 404") já não reproduzem
        em origin/main — a rota existe e responde 200. Não encontrado (grep sem resultado) rate limit
        de 5 minutos em TestarCredencialService (CS-3) nem valor novo de operação na trilha (CS-4) nem
        TentativaAcesso/tabela de tentativas com retenção de 30 dias além do adapter TentativasCredencialQueryAdapter
        (cuja existência sugere que a tabela de tentativas também já existe, não confirmado por leitura
        de migration). Isso é sobreposição de trabalho esperada — o card pediu a spec, a construção é
        dos cards WEGO-2318 em diante, e a Definition of Done deste card específico é o documento, não
        o código — mas o dono do produto precisa saber que parte do "teste vermelho" documentado já foi
        resolvido por outra Story, para não reabrir escopo já fechado nem confundir o card de spec com
        pendência de construção.

        '
