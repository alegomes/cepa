routing_reason: 'Os 4 pontos em aberto do card (rota para disparar o teste, onde o resultado fica guardado,
  como a listagem expõe o último resultado, rótulo "com falha" distinto de "desativada") têm resposta
  textual em origin/main na spec docs/spec/testar-acesso-de-credencial.md, commit e4b9bd21, status "pronta-para-construir",
  coerente com o Implementation Summary (CS-1 a CS-4 mapeados para os 4 pontos). Os 12 critérios de sucesso
  seguem o padrão do repositório (superfície + teste vermelho declarado), e o arquivo não sofreu deriva
  de conteúdo desde e4b9bd21. Um achado de staleness relevante foi registrado: CS-1 e CS-2 já foram construídos
  pelo épico WEGO-2317 (Story WEGO-2318) antes desta prova, então os "testes vermelhos" citados para esses
  dois critérios já não reproduzem — isso não é defeito da spec (o card entregou documento, não código),
  mas é sinal para o dono do produto reconciliar o card de spec com o estado real do épico WEGO-2317.
  Como nos precedentes WEGO-2275 e WEGO-2117, o mecanismo deste agente (PIT/perturbação green→red) não
  tem correspondente para provar conteúdo de prosa: não existe teste a reverter/quebrar para um documento,
  então l3.perturbation fica "skipped" e l2 fica "assumed" — isso torna "proven" estruturalmente indisponível
  por este portão, mesmo a inspeção manual tendo confirmado o conteúdo. NEEDS-HUMAN não é dúvida sobre
  o conteúdo da spec (que confere), é o limite do mecanismo de prova para um card sem código, com o achado
  de staleness anexado para o dono decidir.

  '
levels:
