routing_reason: "The syncStatus guard in AcompanharPedidosService.listar() IS load-bearing at the external\
  \ surface:\nperturbation (remove guard) → 6 RED in GetAssinaturasSpecSyncE2ETest → restore → 32/32 GREEN.\n\
  This proves the guard is wired to the HTTP endpoint in the negative direction (syncStatus=false\ndoes\
  \ NOT sync, which is the default — the @QuarkusTests depend on it).\n\nHowever, the positive direction\
  \ (syncStatus=true DOES sync) has no @QuarkusTest coverage.\nGetAssinaturasSpecSyncE2ETest never passes\
  \ ?syncStatus=true and never asserts a status change\nresulting from on-demand sync. PIT confirms listar()\
  \ syncStatus=true branch (lines 90-93)\nsurvives all unit tests in AcompanharPedidosServiceTest. The\
  \ unit-layer proof\n(AssinaturaResourceTest.devePassarSyncStatusTrueParaListar + service unit tests\
  \ for\nmarcarAberto/marcarAssinado) is present but does NOT constitute external-surface proof per the\n\
  altitude rule.\n\nNEEDS-HUMAN because:\n1. The positive syncStatus=true path has no @QuarkusTest that\
  \ calls GET /api/v1/assinaturas?syncStatus=true\n   and asserts status change (e.g. ENVIADO → ABERTO\
  \ after mock returns Open).\n2. PIT surviving mutants on lines 90-96 confirm the unit tests do not guard\
  \ this path"
