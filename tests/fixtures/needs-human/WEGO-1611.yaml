routing_reason: 'NEEDS-HUMAN. Seis das sete hunks externamente-observaveis do WEGO-1611 sao load-bearing
  (P1..P6): cada perturbacao derruba AdminSubjectPadraoE2ETest (tc1, green->red) com evidencia de run.
  A hunk nao coberta e o ramo ''tenant lookup'' em PlugSignAdapter.resolveSubject (P7): o MockPlugSignAlternative
  substitui o adapter inteiro, tornando esse ramo invisivel a qualquer @QuarkusTest. Nenhum teste de unidade/contract
  exercita esse ramo com tenantContext nao-nulo. O gap e estrutural — requer decisao humana: (a) aceitar
  que a feature e provada ate a borda do repositorio (CRUD round-trip, P1..P6) e o uso do subject no payload
  PlugSign sera coberto em follow-up, ou (b) exigir um unit test em PlugSignAdapterContractTest com stub
  de TenantContext+ClienteRepository retornando Cliente com subjectPadraoAssinatura preenchido, verificando
  que o JSON capturado contem esse valor como ''subject''. O ''clean verify'' completo mostrou uma falha
  em AtendimentoSubstituirDocumentoE2ETest (Flyway sem DB/DevServices) e um flake em DependencyProbeServiceTest$PlugSignProbe.http503_retornaDEGRADED
  — ambos sao pre-existentes e nao relacionados ao WEGO-1611.

  '
