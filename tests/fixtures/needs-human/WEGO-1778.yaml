routing_reason: "The tests ARE load-bearing but not in the single-layer way the design doc comments claim.\n\
  Perturbation reveals a LAYERED-DEFENSE structure:\n- Either @RolesAllowed alone OR permit-all.policy=authenticated\
  \ alone independently produces 401.\n- The tests only go RED when BOTH security layers are simultaneously\
  \ absent.\n- This means the new tests do not independently prove the @RolesAllowed gate is wired (a\
  \ separate test class could silently pass if only @PermitAll replaced @RolesAllowed),\n  nor do they\
  \ independently prove the profile override is load-bearing (a profile without the authenticated override\
  \ still produces 401 via @RolesAllowed).\n- The JOINT behavior is proven: the 401 path fires under the\
  \ actual production security model.\n  No single perturbation breaks them, but the double-perturbation\
  \ (both gates gone) does.\n\nThis is a real structural finding: the tests cannot distinguish between\
  \ \"401 from @RolesAllowed\" and \"401 from Vert.x HTTP auth policy\". Both mechanisms are present in\
  \ production, so the 401 IS correct in production, but the test does not isolate which gate is the authoritative\
  \ one.\n\nWhether this double-guard architecture is acceptable as proof of AC1 is a human judgm"
