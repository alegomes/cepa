contexto: "{\"command\": \"F=application/src/test/java/com/wego/acesso/application/port/out/RegistroOperacaoAdministrativaFabricasTest.java\\npython3 - \\\"$F\\\" <<'PY'\\nimport sys, io\\np = sys.argv[1]\\ns = open(p, encoding='utf-8').read()\\n\\ns = s.replace(\\n\\\"\\\"\\\"import java.time.Instant;\\nimport java.util.UUID;\\n\\nimport static org.junit.jupiter.api.Assertions.assertEquals;\\nimport static org.junit.jupiter.api.Assertions.assertNull;\\nimport static org.junit.jupiter.api.Assertions.assertThrows;\\\"\\\"\\\",\\n\\\"\\\"\\\"import java.lang.reflect.Constructor;\\nimport java.lang.reflect.Modifier;\\nimport java.time.Instant;\\nimport java.util.UUID;\\n\\nimport static org.junit.jupiter.api.Assertions.assertEquals;\\nimport static org.junit.jupiter.api.Assertions.assertNotEquals;\\nimport static org.junit.jupiter.api.Assertions.assertNull;\\nimport static org.junit.jupiter.api.Assertions.assertThrows;\\nimport static org.junit.jupiter.api.Assertions.assertTrue;\\\"\\\"\\\")\\n\\ns = s.replace(\\n\\\"\\\"\\\" * (trocar o campo gravado, remover o {@code requireNonNull}, ou inverter qual\\n * fábrica grava {@code null}).\\n */\\\"\\\"\\\",\\n\\\"\\\"\\\" * (trocar o campo gravado, remover o {@code requireNonNull}, ou inverter qual\\n * fábrica grava {@code null}).\\n *\\n * <p><strong>WEGO-2050</strong> acrescenta o que faltava para que \\\"únicos caminhos\\n * de construção\\\" deixasse de ser disciplina de code review e virasse regra do\\n * compilador: {@code RegistroOperacaoAdministrativa} deixou de ser {@code record}\\n * e virou classe final de construtor privado, porque a JLS 8.10.4 proíbe um record\\n * público de ter construtor canônico privado. Os testes abaixo pinam as duas\\n * consequências disso — o construtor continua inacessível de fora, e a semântica\\n * de valor que o record dava de graça (acessores, {@code equals}/{@code hashCode})\\n * continua valendo.\\n */\\\"\\\"\\\")\\n\\ns = s.rstrip()\\nassert s.endswith('}')\\ns = s[:-1].rstrip('\\\\n') + \\\"\\\"\\\"\\n\\n    @Test\\n    void construtorCanonicoNaoEAcessivelDeFora() {\\n        Constructor<?>[] declarados = RegistroOperacaoAdministrativa.class.getDeclaredConstructors();\\n\\n        assertEquals(1, declarados.length,\\n                \\\"só pode existir UM construtor, o canônico — outro construtor seria um segundo caminho \\\"\\n                        + \\\"de construção fora das fábricas nomeadas\\\");\\n        assertTrue(Modifier.isPrivate(declarados[0].getModifiers()),\\n                \\\"o construtor canônico tem que ser privado: é o que faz `new RegistroOperacaoAdministrativa(\\\"\\n                        + \\\"HABILITACAO, ..., null)` não compilar em código externo e sobrar só sobreFuncionario/\\\"\\n                        + \\\"sobreCredencial. Enquanto isto era um record aninhado em interface, era impossível \\\"\\n                        + \\\"(JLS 8.10.4) e a garantia vivia só em code review\\\");\\n        assertEquals(0, RegistroOperacaoAdministrativa.class.getConstructors().length,\\n                \\\"nenhum construtor público pode ser visível ao compilador de fora da classe\\\");\\n    }\\n\\n    @Test\\n    void mantemSemanticaDeValorQueORecordDavaDeGraca() {\\n        RegistroOperacaoAdministrativa um = RegistroOperacaoAdministrativa.sobreFuncionario(\\n                OperacaoAdministrativa.HABILITACAO, CLIENTE, GEAP, CREDENCIAL_ID,\\n                \\\"admin-ana.silva\\\", OCORRIDA_EM, \\\"matricula-70452\\\");\\n        RegistroOperacaoAdministrativa igual = RegistroOperacaoAdministrativa.sobreFuncionario(\\n                OperacaoAdministrativa.HABILITACAO, CLIENTE, GEAP, CREDENCIAL_ID,\\n                \\\"admin-ana.silva\\\", OCORRIDA_EM, \\\"matricula-70452\\\");\\n        RegistroOperacaoAdministrativa outroFuncionario = RegistroOperacaoAdministrativa.sobreFuncionario(\\n                OperacaoAdministrativa.HABILITACAO, CLIENTE, GEAP, CREDENCIAL_ID,\\n                \\\"admin-ana.silva\\\", OCORRIDA_EM, \\\"matricula-99999\\\");\\n\\n        assertEquals(um, igual,\\n                \\\"dois registros com os mesmos metadados são o mesmo valor — era assim com o record e \\\"\\n                        + \\\"continua sendo com a classe final\\\");\\n        assertEquals(um.hashCode(), igual.hashCode(),\\n                \\\"hashCode tem que acompanhar equals, senão o registro se perde em Set/Map\\\");\\n        assertNotEquals(um, outroFuncionario,\\n                \\\"funcionarioAfetadoId diferente é registro diferente — é justamente o campo que o \\\"\\n                        + \\\"WEGO-2024 introduziu\\\");\\n    }\\n}\\n\\\"\\\"\\\"\\nopen(p, 'w', encoding='utf-8').write(s)\\nprint(\\\"ok\\\")\\nPY\", \"description\": \"Add reflection + value-semantics tests\"}"
