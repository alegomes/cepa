contexto: "{\"command\": \"git add application/src/main/java/com/wego/acesso/application/port/out/TrilhaAuditoriaPort.java application/src/test/java/com/wego/acesso/application/port/out/RegistroOperacaoAdministrativaFabricasTest.java resultado.txt && git commit -q -F - <<'MSG' && git log --oneline -1\\nfeat(audit): WEGO-2050 — só as fábricas constroem RegistroOperacaoAdministrativa\\n\\nO javadoc já declarava que sobreFuncionario/sobreCredencial eram os únicos\\ncaminhos de construção, mas nada impedia\\n`new RegistroOperacaoAdministrativa(HABILITACAO, ..., null)`, contornando o\\nrequireNonNull da fábrica. A garantia vivia só em disciplina de code review.\\n\\nO critério de aceite pedia construtor canônico privado mantendo o record. Isso\\nnão compila: a JLS 8.10.4 proíbe o construtor canônico de dar menos acesso que\\no record, e tipo aninhado em interface é implicitamente public. Verificado:\\n\\\"invalid canonical constructor in record (attempting to assign stronger access\\nprivileges; was public)\\\".\\n\\nDecisão (modo autônomo, sem humano para consultar): manter o efeito pedido pelo\\nBDD e trocar o mecanismo — RegistroOperacaoAdministrativa deixa de ser record e\\nvira final class de construtor privado, na mesma superfície de um arquivo.\\nAcessores, equals, hashCode e toString reescritos com a mesma semântica de\\nvalor; fábricas e mensagens de requireNonNull inalteradas. Nenhum consumidor\\nmuda: todos usam fábricas e acessores.\\n\\nProva: com um `new` direto adicionado ao teste, o módulo não compila\\n(\\\"has private access\\\") — inclusive do MESMO pacote. Trocar private por public\\ndeixa construtorCanonicoNaoEAcessivelDeFora vermelho. Saídas em resultado.txt.\\n\\nCo-Authored-By: Claude Opus 5 <noreply@anthropic.com>\\nMSG\", \"description\": \"Commit the change\"}"
