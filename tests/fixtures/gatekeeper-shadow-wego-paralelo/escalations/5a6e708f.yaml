contexto: "{\"command\": \"python3 - <<'PY'\\nimport io,re\\np='api-rest/src/main/java/com/wego/acesso/api/rest/security/CaminhoNormalizadoPolicy.java'\\ns=open(p,encoding='utf-8').read()\\n\\n# 1) javadoc da classe: item (2) da lista passa a falar de multiplas passadas\\nold_li = \\\"   <li>decodifica percent-encoding, para que {@code %2F} vire a barra que realmente é;</li>\\\"\\nnew_li = (\\\"   <li>decodifica percent-encoding <strong>até o ponto fixo</strong>, para que tanto\\\\n\\\"\\n          \\\"       {@code %2F} quanto o duplamente codificado {@code %252F} virem a barra que\\\\n\\\"\\n          \\\"       realmente são (WEGO-2070);</li>\\\")\\nassert old_li in s\\ns = s.replace(old_li, new_li)\\n\\n# 2) javadoc do decodificar + implementacao em multiplas passadas\\nold_doc = \\\"\\\"\\\"    /**\\n     * Percent-decode byte a byte. Feito à mão em vez de {@code URLDecoder.decode}, que\\n     * traduz {@code +} para espaço — regra de formulário, não de caminho — e lançaria\\n     * exceção em sequência inválida, o que transformaria um caminho torto em erro 500 em\\n     * vez de simplesmente não casar a rota protegida.\\n     */\\n    private static String decodificar(String caminho) {\\n        if (caminho.indexOf('%') < 0) {\\n            return caminho;\\n        }\\n\\\"\\\"\\\"\\nnew_doc = \\\"\\\"\\\"    /**\\n     * WEGO-2070 — teto de passadas do decode repetido. Cinco é folga deliberada: o\\n     * roteador JAX-RS decodifica UMA vez, então qualquer caminho que ainda esconda um\\n     * {@code /} depois de cinco passadas já não casa rota nenhuma. O teto existe só para\\n     * garantir término; nenhum caminho real chega perto dele.\\n     */\\n    private static final int MAXIMO_PASSADAS_DECODE = 5;\\n\\n    /**\\n     * Percent-decode <strong>repetido até o ponto fixo</strong> (no máximo\\n     * {@link #MAXIMO_PASSADAS_DECODE} passadas).\\n     *\\n     * <p><strong>Por que mais de uma passada (WEGO-2070).</strong> Uma passada só resolve\\n     * {@code %2F}. A barra codificada DUAS vezes — {@code %252F}, em que o próprio\\n     * {@code %} vem escrito como {@code %25} — sobrevive à primeira passada como o texto\\n     * {@code %2F}, que não é barra nenhuma para o {@code split(\\\"/\\\")} logo abaixo. Efeito:\\n     * {@code /%252Fapi/v1/x} normalizava para {@code /%2Fapi/v1/x}, não caía sob\\n     * {@code /api/} e passava batido pela política — enquanto a forma crua equivalente\\n     * ({@code //api/v1/x}) era barrada. Decodificar até o texto parar de mudar fecha a\\n     * família inteira (tripla, quádrupla) pelo mesmo mecanismo, em vez de um caso por vez.\\n     *\\n     * <p>Decodificar mais vezes que o roteador é conservador de propósito: esta política\\n     * só decide entre \\\"exigir autenticação\\\" e \\\"seguir em frente\\\", então um falso positivo\\n     * custa um 401 em caminho torto, e um falso negativo custa a rota aberta.\\n     *\\n     * <p>Feito à mão em vez de {@code URLDecoder.decode}, que traduz {@code +} para espaço\\n     * — regra de formulário, não de caminho — e lançaria exceção em sequência inválida, o\\n     * que transformaria um caminho torto em erro 500 em vez de simplesmente não casar a\\n     * rota protegida.\\n     */\\n    private static String decodificar(String caminho) {\\n        String atual = caminho;\\n        for (int passada = 0; passada < MAXIMO_PASSADAS_DECODE; passada++) {\\n            String proximo = decodificarUmaPassada(atual);\\n            if (proximo.equals(atual)) {\\n                return atual;\\n            }\\n            atual = proximo;\\n        }\\n        return atual;\\n    }\\n\\n    /** Uma única passada de percent-decode; ponto de parada é a igualdade com a entrada. */\\n    private static String decodificarUmaPassada(String caminho) {\\n        if (caminho.indexOf('%') < 0) {\\n            return caminho;\\n        }\\n\\\"\\\"\\\"\\nassert old_doc in s\\ns = s.replace(old_doc, new_doc)\\nopen(p,'w',encoding='utf-8').write(s)\\nprint(\\\"ok\\\")\\nPY\", \"description\": \"Aplicar decode até o ponto fixo\"}"
