contexto: "{\"command\": \"mkdir -p bin/tests && cat > bin/tests/test_doctor_ignora_worktrees_orfas.sh <<'EOF'\\n#!/usr/bin/env bash\\n#\\n# test_doctor_ignora_worktrees_orfas.sh — WEGO-2059\\n#\\n# Uma worktree de agente esquecida dentro do repo (.claude/worktrees/<nome>/) é\\n# uma CÓPIA INTEIRA da árvore, migrations inclusive. O `find` do doctor varria\\n# essa cópia junto com a árvore de trabalho, então toda migration aparecia duas\\n# vezes e o doctor acusava \\\"versão de migration duplicada\\\" para todas elas — um\\n# alarme falso que treina a pessoa a ignorar justamente o check que existe para\\n# pegar a colisão de verdade (duas branches numerando a mesma versão).\\n#\\n# O teste monta um repo de mentira num tmpdir, roda o doctor de verdade lá dentro\\n# e olha só a seção Migrations. O doctor vai reprovar outras coisas nesse sandbox\\n# (Docker, Java, porta) — não importa: o teste lê a SAÍDA da seção, não o exit\\n# code, porque é a mensagem que a pessoa lê.\\nset -Eeuo pipefail\\n\\nRAIZ=\\\"$(cd \\\"$(dirname \\\"$0\\\")/../..\\\" && pwd)\\\"\\nSANDBOX=\\\"$(mktemp -d \\\"${TMPDIR:-/tmp}/doctor-worktrees-orfas.XXXXXX\\\")\\\"\\ntrap 'rm -rf \\\"${SANDBOX}\\\"' EXIT\\n\\nFALHAS=0\\nfalhou() { echo \\\"  ✗ $*\\\"; FALHAS=$((FALHAS + 1)); }\\npassou() { echo \\\"  ✓ $*\\\"; }\\n\\nMIGRATIONS=\\\"bootstrap/src/main/resources/db/migration\\\"\\n\\n# Monta o sandbox: o script sob teste, o pom (o check de Docker lê a\\n# docker.api.version dele) e uma migration na árvore de trabalho.\\nmkdir -p \\\"${SANDBOX}/bin\\\" \\\"${SANDBOX}/${MIGRATIONS}\\\"\\ncp \\\"${RAIZ}/bin/run-dev.sh\\\" \\\"${SANDBOX}/bin/run-dev.sh\\\"\\ncp \\\"${RAIZ}/pom.xml\\\"        \\\"${SANDBOX}/pom.xml\\\"\\necho \\\"-- migration de mentira\\\" > \\\"${SANDBOX}/${MIGRATIONS}/V20260627000001__sessao_acesso.sql\\\"\\n\\n# Roda o doctor dentro do sandbox e devolve a saída inteira.\\ndoctor() { ( cd \\\"${SANDBOX}\\\" && bash bin/run-dev.sh doctor 2>&1 ) || true; }\\n\\n# ── Caso 1: worktree órfã com uma cópia da migration — NÃO pode acusar ───────\\nORFA=\\\"${SANDBOX}/.claude/worktrees/session-alguma/${MIGRATIONS}\\\"\\nmkdir -p \\\"${ORFA}\\\"\\ncp \\\"${SANDBOX}/${MIGRATIONS}/V20260627000001__sessao_acesso.sql\\\" \\\"${ORFA}/\\\"\\n\\nsaida=\\\"$(doctor)\\\"\\nif grep -q \\\"versão de migration duplicada\\\" <<< \\\"${saida}\\\"; then\\n  falhou \\\"acusou duplicata por causa da cópia em .claude/worktrees/\\\"\\n  grep -n \\\"migration\\\" <<< \\\"${saida}\\\" | sed 's/^/      /'\\nelse\\n  passou \\\"cópia em .claude/worktrees/ ignorada — sem alarme falso\\\"\\nfi\\nif grep -q \\\"nenhuma versão de migration duplicada\\\" <<< \\\"${saida}\\\"; then\\n  passou \\\"seção Migrations chegou ao veredito limpo\\\"\\nelse\\n  falhou \\\"a seção Migrations nem rodou (o doctor morreu antes?)\\\"\\n  echo \\\"${saida}\\\" | tail -20 | sed 's/^/      /'\\nfi\\n\\n# ── Caso 2: duplicata DE VERDADE na árvore de trabalho — tem que acusar ──────\\n# Sem este caso, apagar o check inteiro passaria no teste.\\necho \\\"-- outra coisa\\\" > \\\"${SANDBOX}/${MIGRATIONS}/V20260627000001__outro_nome.sql\\\"\\nsaida=\\\"$(doctor)\\\"\\nif grep -q \\\"versão de migration duplicada\\\" <<< \\\"${saida}\\\"; then\\n  passou \\\"duplicata real na árvore de trabalho segue sendo acusada\\\"\\nelse\\n  falhou \\\"duplicata real passou batido — o check virou decoração\\\"\\nfi\\n\\necho\\nif [[ ${FALHAS} -gt 0 ]]; then\\n  echo \\\"FALHOU: ${FALHAS} asserção(ões)\\\"\\n  exit 1\\nfi\\necho \\\"OK: doctor ignora worktrees órfãs e ainda pega duplicata real\\\"\\nEOF\\nchmod +x bin/tests/test_doctor_ignora_worktrees_orfas.sh\\nbash bin/tests/test_doctor_ignora_worktrees_orfas.sh\"}"
