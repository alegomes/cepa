# MOVIDO — o template canônico do plan.yaml agora vive em common/plan-schema.yaml
#
# Motivo: o mesmo formato passou a ter dois consumidores irmãos — o maestro
# (`mode: parallel-waves`, ondas de slices em worktrees) e o board-flow
# (`mode: single-track`, um item por vez entre sessões). Manter duas cópias
# anotadas do schema criaria front-doors rivais, que divergem em silêncio.
#
# O schema NÃO mudou: `schema_version` segue 1, `mode` é opcional com default
# `parallel-waves`, e todo plan.yaml escrito antes desta mudança continua
# válido e é lido sem alteração.
#
# → common/plan-schema.yaml   (ambos os modos, anotado)
# → docs/maestro.md           (como o maestro usa o modo parallel-waves)
