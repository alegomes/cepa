    `cepa-until decide` recebe `s` no menu e, em "Anything to add", 1.500 bytes
    com "ção" atravessando o byte 1024, seguidos de Enter. O `evidence` do item
    no `queue.yaml` termina com os 1.500 bytes intactos. Hoje o Enter é engolido
    ou a leitura falha com "an accent arrived half-way", e o texto não chega.'
  status: pending
  blocked_by: []
  human_pending: null
