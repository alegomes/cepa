- id: CS-1
  title: '`cepa queue` faz o que `cepa plan` fazia, e `cepa plan` é recusado com
    o nome novo'
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: num repo
    temporário com uma fila gravada, `cepa queue status` e `cepa-queue status` imprimem
    a fila e saem com 0; `cepa plan status` sai com 2, imprime uma linha contendo
    "plan is now queue" e não imprime a fila; `cepa help` lista `queue` e não lista
    `plan`; `board-flow/bin/cepa-queue status` chega ao mesmo script. Hoje `cepa
    queue` não existe.'
  status: pending
  blocked_by: []
  human_pending: null
- id: CS-2
  title: '`cepa run` faz o que `cepa until` fazia, e `cepa until` é recusado com
    o nome novo'
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: `cepa
    run <fila> --for 1h --dry-run` imprime o plano da run, cita `/common:queue-run
    <fila> --max 1` como o comando de cada item e sai com 0; `cepa run digest <run>.jsonl`
    imprime o resumo que `cepa until-digest` imprime hoje; `cepa until <fila> --for
    1h --dry-run` sai com 2 com uma linha contendo "until is now run"; `cepa until-digest
    x` sai com 2 com "until-digest is now run digest". A pasta da run continua sendo
    `.claude/queues/<fila>/until/` e a branch `until/<run>`.'
  status: pending
  blocked_by: []
  human_pending: null
