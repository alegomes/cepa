- id: CS-5
  title: outside herdr nothing is called, and a broken herdr changes neither the
    duration nor the result of a run
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: (a) the
    CS-1 run without `HERDR_ENV` creates no log file and its ledger matches the
    CS-1 ledger event by event, ignoring times; (b) the CS-1 run with a fake herdr
    that sleeps 30 s and exits 1 finishes in less than 2 s more than (a) per report,
    with the same exit code and ledger; (c) `cepa until pending` with `HERDR_ENV=1`
    creates no log file. Today (a) and (c) pass by absence and (b) passes because
    nothing is called; the test goes red against any implementation that calls herdr
    without a timeout or from a subcommand, which is what it guards.'
  status: pending
  blocked_by: []
  human_pending: null
