- id: CS-1
  title: '`cepa run <fila> --to-the-end --dry-run` imprime o plano de uma run sem
    prazo e sai com 0, e largar sem nenhuma das três flags de janela continua recusado'
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: num repo
    de teste com a fila `a` (1 item pronto), `cepa run a --to-the-end --dry-run`
    sai com 0 e a saída contém "no deadline"; `cepa run a --dry-run` sai com 2;
    `cepa run --help` lista `--to-the-end`. Hoje o primeiro comando sai com 2 porque
    o argumento não existe.'
  status: pending
  blocked_by: []
  human_pending: null
- id: CS-2
  title: a run sem prazo executa todos os itens prontos e termina com o motivo `end-of-queue`
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: fila
    `a` com 2 itens prontos e um `claude` falso que commita e fecha cada item como
    `done`; `cepa run a --to-the-end` termina com os dois itens `done`, o `run_end`
    do registro traz o motivo `end-of-queue` e o `run_start` traz `prazo` nulo e
    `sem_prazo` verdadeiro. Hoje o comando é recusado.'
  status: pending
  blocked_by: []
  human_pending: null
- id: CS-3
