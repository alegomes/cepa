  decisions:
  - texto: 'Fila em que todo item foi descartado (nenhum concluído) não é arquivada:
      a varredura usa a mesma regra de fila fechada que as listas e o Epic já usam,
      que exige ao menos um item concluído. O texto da especificação diz ''todo
      item done ou dropped''.'
    commit: 7fade7d5c263092079efd2159f0267c741eb2167
  - texto: Pasta de fila com alteração ainda não commitada não é arquivada, e a
      saída diz o motivo; a especificação não pedia essa recusa. Sem ela o commit
      da varredura levaria edições alheias junto.
    commit: 7fade7d5c263092079efd2159f0267c741eb2167
  - texto: 'Quem chama a varredura e quer fazer o próprio commit passa --no-commit:
      o que foi movido fica preparado no git para o commit de quem chamou. Sem a
      opção, a varredura commita só o que moveu.'
    commit: 7fade7d5c263092079efd2159f0267c741eb2167
  - texto: Fila com queue.yaml ilegível é pulada com aviso e a varredura segue com
      as outras, saindo com código 0; se o commit da própria varredura falhar, o
      código de saída é 3.
    commit: 7fade7d5c263092079efd2159f0267c741eb2167
