- id: CS-4
  title: A largada recolhe registros soltos de runs mortos de qualquer fila
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: com um
    `.jsonl` e uma `queue.yaml` modificada da fila `outra` cujo supervisor morreu
    (pid inexistente), lançar `cepa-until <fila>`; o teste exige um commit de recolha
    com os caminhos de `outra` antes do primeiro item, e que a largada não recuse
    por árvore suja.'
  status: done
  blocked_by: []
  human_pending: null
  evidence: 'Launch of cepa-until now collects, before the dirt guard, loose run
    records (until/*.jsonl, until/*.review.md) of any queue in both layouts plus
    that queue''s modified queue file, in one commit ''until: collect records of
    dead runs (<queues>)'' via commit_run_records (git add + commit --only, no --no-verify);
    run_start records ''recolha'' {commit, filas, caminhos}. Skipped: queue with
    no loose record (owner''s edit stays dirt), queue with a live run on this host,
    record from another host without run_end; deleted records are never collected;
    --dry-run only reports. Commits: ef4aa17 (tests, RED at 43daca5: 11 failures),
    1bf5f98 (fix in common/bin/cepa-until: RUN_PATH, _record_of_live_elsewhere,
    loose_records_of_dead_runs, collect block in _main), 88601a0 (tests for .review.md
    and deleted record, killing proof survivors P8/P9), 901136c (gate artifacts).
    Flipped the last check of tests/test_cepa_until.py::test_plan_of_another_queue_dirtied_by_the_live_run_is_not_dirt
    (dead supervisor diff is now collected, not refused). Gates: completion-auditor
    COMPLETE (.claude/acceptance/until-arvore-limpa-CS-4.yaml, at 1bf5f98; 88601a0
    only adds tests); proof-reviewer UNPROVEN at 1bf5f98 (survivors P8 review.md
    alternative, P9 deletion skip) -> PROVEN at 88601a0 (docs/proof/until-arvore-limpa-CS-4.yaml).
    Ran green: tests/test_cepa_until_clean_tree.py, tests/test_cepa_until.py, tests/test_cepa_until_dead_supervisor.py.
    Not covered: git refusing the collect commit (CS-5 territory), rename branch
    of the -z parser. Full build left to the supervisor; code is on the run branch
    until/2026-11-14-0954. Throwaway worktrees /tmp/proof-cs4, /tmp/proof-cs4b,
    /tmp/proof-cs4c removed.'
  head_commit: 901136c59a625f318ce55196980d38d2e85d17bb
  decisions:
  - texto: A largada só recolhe uma fila quando ela tem um registro de run solto;
      uma fila editada à mão sem registro solto continua sendo mudança do dono e
      a largada recusa como antes
    commit: 1bf5f98be822cb248cf1f21ac255b9e39b1d1e1d
  - texto: Registro de run de outra máquina que não terminou não é recolhido, porque
      o run pode estar vivo lá; e um registro apagado do disco nunca vira apagamento
      no commit
    commit: 1bf5f98be822cb248cf1f21ac255b9e39b1d1e1d
  - texto: Com --dry-run a largada só diz o que recolheria, sem commitar
    commit: 1bf5f98be822cb248cf1f21ac255b9e39b1d1e1d
- id: CS-5
  title: Se o git recusar o commit, o run avisa com o motivo e o comando, sem forçar
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: com um
    hook `pre-commit` que sai com 1 no repo de teste, o run termina com o código
    de saída que teria sem o hook, a tela final e o `.review.md` trazem a linha
    do motivo e o comando `git commit` exato para o dono, nenhum commit novo é criado
    e nenhuma chamada a `git` traz `--no-verify`.'
  status: blocked
  blocked_by: []
  human_pending: null
  evidence: 'This is return 2 of 2: the item closed `done`, but the full build of
    the run branch (`tests/run-all.sh`) exited 1, and the 2nd build exited 1. Output
    in the `.log` of run 2026-11-14-0954. The commits of every attempt are in `until/2026-11-14-0954-vermelho-CS-5-v2`
    and the run branch went back to 901136c59a. Marked `blocked`: the item already
    came back with the note and went red again. The card in Jira may have moved
    to Review before the build — check it.'
  decisions:
  - texto: Quando o git recusa o commit do fim do run, o cepa-until escreve o motivo
      e o comando no fim do .review.md, criando o arquivo se a análise não rodou
    commit: bd96753f76fd96dd5cc1808b28a515e1b5f34f81
  - texto: 'Quando o git recusa o commit do fim do run, o cepa-until não força (nunca
      usa --no-verify) e não muda o código de saída: mostra na tela e escreve no
      .review.md o motivo e o comando git exato para o dono commitar à mão'
    commit: e6bfb8b3c99e330f8be7438efd0ca340e75af0ba
  owner_summary:
    impede: the agent delivered, but the project's full test suite failed after
      it, and failed again when the item came back to be fixed.
