    dead runs (<queues>)'' via commit_run_records (git add + commit --only, no --no-verify);
    run_start records ''recolha'' {commit, filas, caminhos}. Skipped: queue with
    no loose record (owner''s edit stays dirt), queue with a live run on this host,
