  blocked_by: []
  human_pending: null
  evidence: 'Return 1 of 2 resumed: cherry-picked the side branch until/2026-11-14-0954-vermelho-CS-1
    (8df2517->c579aa0, 04c9437->eedf8ad). The red full build had 2 failures: tests/test_queue_rename.py
    asserted the OLD contract (clone queue dirty after the run), updated to assert
    queue.yaml and .jsonl committed (41939b3); tests/test_default_yes_inject.py
    ''raiz fora do repo'' was red on base 4f1c14f too: the root <tmp>/common has
    the system TMPDIR as grandparent and _cmdmeta.bases() scanned a loose plugin
    copy left at $TMPDIR/tmp.PllR47ZTT3/common (created 2026-11-14 10:11); root
    now nested one level deeper (41939b3). Proof gate first UNPROVEN (survivors:
    no --only, --no-verify); added 2 tests in 65fb796 (owner''s staged file stays
    out and staged; refusing pre-commit hook respected). Gates: completion-auditor
    COMPLETE (.claude/acceptance/until-arvore-limpa-CS-1.yaml), proof-reviewer PROVEN
    at 65fb796 (docs/proof/until-arvore-limpa-CS-1.yaml; P6 literal --only removal
