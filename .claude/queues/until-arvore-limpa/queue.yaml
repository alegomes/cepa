    P6b --include goes RED). Ran individually green: test_cepa_until_clean_tree.py,
    test_queue_rename.py, test_default_yes_inject.py, test_cepa_until.py (by auditor).
    Full build left to the supervisor. Code is on the run branch until/2026-11-14-0954;
    the leftover TMPDIR copy was not deleted.'
