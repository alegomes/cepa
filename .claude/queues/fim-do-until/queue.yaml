- id: CS-1
  title: '`--auto-land` faz uma run limpa fazer o merge sozinha no fim'
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: uma run
    com `--auto-land` sobre uma fila cujo único item entrega verde, com o `main`
    do clone intocado, termina com o commit da branch da run no `main` e o estado
    `aterrissado`; hoje a flag não existe e o argparse sai com 2.'
  status: done
  blocked_by: []
  human_pending: null
  evidence: 'Commits na branch until/2026-11-19-0736: 9774c03 (flag --auto-land,
    campo auto_land no estado, not_clean_reason/last_verify_green/auto_land, chamada
    em commit_records antes de commit_run_end, protegida por try/except), f95f7b9
    (state_auto_land: o estado é a fonte; estado antigo sem o campo vale não), a491265
    (testes que isolam build vermelho, pergunta do dono e auto_land false), cf81357
    (artefatos dos portões). Teste: tests/test_cepa_until_auto_land.py, 10 testes,
    28 checks verdes; vermelho na base 29ab80a (a run não começa: a flag não existe).
    Vizinhos verdes: test_cepa_until_land, test_cepa_until_land_install, test_cepa_until_dead_supervisor,
    test_cepa_until_english_aliases, test_cepa_help_layout. pair-reviewer: CHANGES-REQUESTED
    com 4 achados, os 4 corrigidos. completion-auditor: COMPLETE em .claude/acceptance/fim-do-until-CS-1.yaml
    (auditado em f95f7b9; a491265 só acrescenta testes). proof-reviewer: PROVEN
    em docs/proof/fim-do-until-CS-1.yaml (head a491265, 7 perturbações, todas vermelhas).
    Chave dos artefatos é fim-do-until-CS-1 porque .claude/acceptance/CS-1.yaml
    e docs/proof/CS-1.yaml já pertencem a outra especificação (campo demonstra:);
    o auditor tinha sobrescrito o de aceite, restaurei. Fica para os próximos itens:
    a linha ''not merged: <motivo>'' já existe mas o formato do CS-2 não foi testado;
    a pergunta da largada (CS-3), o fim sem ''Land now?'' (CS-4) e o caso ''a janela
    não comporta o build'' (seção Riscos) não foram feitos. O código está na branch
    da run, não na main.'
  head_commit: cf8135707d80687b4e706e7b201fdbce597fde47
  decisions:
  - texto: Com --auto-land, a run só conta como limpa se todos os itens que tocou
      saíram entregues (qualquer outro desfecho, inclusive um que venha a existir,
      impede o merge), se rodou build completo (uma run com --no-verify nunca faz
      o merge sozinha), e nunca numa run de todas as filas (--all); o aviso de reinstalar
      o plugin não impede, porque o próprio land reinstala
    commit: 9774c0338aabda8401888f13f1beac00b4fd49a2
- id: CS-2
  title: uma run não limpa com `--auto-land` não faz o merge e diz qual condição
    falhou
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: uma run
    com `--auto-land` em que um item termina travado acaba com estado `esperando-dono`,
    `main` intocado e uma linha que nomeia a condição que falhou ("not merged: WEGO-2542
    is stuck"); hoje a flag não existe.'
  status: done
  blocked_by: []
  human_pending: null
  evidence: 'Code on the overnight branch until/2026-11-19-0736 (no merge, no push;
    full build delegated to the supervisor). Commits: 08f68a9 (window guard window_reason
    + English phrases per outcome in not_clean_reason + stronger tests), 14fef73
    (end-to-end tests pinning left=deadline-now in commit_records), 0727c77 (gate
    artifacts). Most of the refusal itself came from CS-1 (9774c03..a491265). pair-reviewer:
    OK-WITH-NOTES (note about expired window turned into test_expired_window_refuses).
    completion-auditor: first INCOMPLETE (window guard only tested at function level),
    COMPLETE at 14fef73 (.claude/acceptance/fim-do-until-CS-2.yaml). proof-reviewer:
    first UNPROVEN at 08f68a9 (3 surviving perturbations on the commit_records wiring),
    PROVEN at 14fef73 (docs/proof/fim-do-until-CS-2.yaml; 6 perturbations re-run,
    all RED; the other 4 of the first review were RED at 08f68a9 and not re-run).
    Tests run: python3 tests/test_cepa_until_auto_land.py exit 0, 66 ok, 0 FAIL
    (~35 s); python3 tests/test_cepa_until_land.py exit 0 at 08f68a9. Full suite
    NOT run here. Left out: the ''Next'' panel text for the window refusal (CS-6).'
  head_commit: 0727c772a5c2f222c2cf80ad5978c0b03de776f0
  decisions:
  - texto: The automatic merge does not start when what is left of the window is
      shorter than the last full build took, so a run that ended on the deadline
      never merges by itself; this rule came from the spec's risks section and was
      built inside this item
    commit: 08f68a97ba25449cd83db73df01d0eee4997903f
  - texto: The extra time allowed to an item already running (--slack) does not
      count as window for the automatic merge
    commit: 08f68a97ba25449cd83db73df01d0eee4997903f
  - texto: The 'not merged' line names each unfinished outcome in English, and an
      outcome this version does not know still refuses the merge
    commit: 08f68a97ba25449cd83db73df01d0eee4997903f
