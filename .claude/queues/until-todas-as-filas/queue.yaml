items:
- id: CS-1
  title: '`cepa until --all --for 8h --dry-run` lista os itens prontos de todas
    as filas, agrupados por fila e na ordem do `cepa plan ready`, e sai com 0 sem
    executar nada'
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: num repo
    de teste com as filas `a` (1 pronto) e `b` (1 pronto), `cepa until --all --for
    8h --dry-run` sai com 0 e a saída traz `a` antes de `b` com os dois ids; hoje
    sai com 2 porque `--all` não existe e o nome da fila é obrigatório.'
  status: pending
  blocked_by: []
  human_pending: null
- id: CS-2
  title: Um run `--all` executa itens de mais de uma fila numa única branch `until/<run>`
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: com as
    filas `a` e `b`, cada uma com 1 item pronto, e um `claude` falso que commita
    e encerra o item como `done`, `cepa until --all --for 1h` termina com os dois
    itens `done` nos respectivos `queue.yaml` e os dois commits na mesma branch
    `until/<run>`; hoje o comando é recusado.'
  status: pending
  blocked_by: []
  human_pending: null
- id: CS-3
  title: A ordem é fila a fila, e um item que fica pronto durante o run entra antes
    de passar à fila seguinte
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: fila
    `a` com `a1` e `a2` (`a2` espera `a1`) e fila `b` com `b1`; após `cepa until
    --all --for 1h` com o `claude` falso, os eventos `item_start` do registro aparecem
    na ordem `a1`, `a2`, `b1`; hoje o comando é recusado.'
  status: pending
  blocked_by: []
  human_pending: null
- id: CS-4
  title: Uma fila com run próprio vivo é pulada com aviso, e as outras seguem
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
