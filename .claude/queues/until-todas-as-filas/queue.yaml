- id: CS-6
  title: O registro fica em `.claude/queues/_all/until/` e `pending`, `decide`,
    `land` e `close-dead` aceitam o alvo `all/<run>`
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: depois
    de um run `--all`, existe `.claude/queues/_all/until/<run>.jsonl`, `cepa until
    pending` lista `all/<run>` e `cepa until land all/<run> --yes` aterrissa a branch;
    hoje `land` recusa o alvo com "the target is <queue>/<run>" porque não existe
    fila `all`.'
  status: pending
  blocked_by: []
  human_pending: null
