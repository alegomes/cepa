  blocked_by: []
  human_pending: null
  evidence: 'Commits na branch until/2026-11-16-1426: b5e634a (bin/install.sh +
    teste), 62da265, 2ff6c87, 6d515af, 20c7b33 (só tests/test_install_live_dir.py),
    09bee86 (arquivos dos portões). pair-reviewer: OK-WITH-NOTES, a nota de correção
    (registro operacional lia cache.rolledback velho) foi aplicada em b5e634a. completion-auditor:
    COMPLETE em 20c7b33 (.claude/acceptance/registro-de-plugins-pasta-estavel-CS-3.yaml).
    proof-reviewer: PROVEN em 20c7b33 na rodada 5 (docs/proof/registro-de-plugins-pasta-estavel-CS-3.yaml),
    92 perturbações, 1 equivalente (linha 315 mv->cp -R); rodadas 1-4 UNPROVEN com
    5, 5, 1 e 10 sobreviventes, todos fechados por teste. Testes rodados: python3
    tests/test_install_live_dir.py (all ok, 124 checks), tests/test_install_ops.py
    (all green), pytest dos 3 arquivos de install (22 passed). Build completo NÃO
    rodado: é do supervisor. Fora do escopo: pastas .rolledback nunca são limpas;
    o wrapper pytest não falha quando check() acumula FAIL (só a execução direta
    prova); --rollback não desfaz o claude plugin uninstall do --clean (já era assim
    com o cache).'
  head_commit: 09bee8601874e6ea96c80d6cdd800feaa16ee201
  decisions:
  - texto: O --rollback restaura o que existir (cache, pasta fixa ou os dois) e
      só sai com erro quando nenhum dos dois pontos de volta existe; antes ele falhava
      sempre que faltava o ponto de volta do cache
    commit: b5e634aa202c21df1f16b4a6be9cbf53e280f6bc
  - texto: 'Um segundo --clean apaga o cepa-live.prev anterior e guarda a cópia
      que estava ativa: existe um único ponto de volta, igual ao do cache'
    commit: b5e634aa202c21df1f16b4a6be9cbf53e280f6bc
  - texto: A pasta que o --rollback substitui fica guardada em cepa-live.rolledback,
      igual ao cache.rolledback, e a anterior com esse nome é apagada
    commit: b5e634aa202c21df1f16b4a6be9cbf53e280f6bc
  - texto: O --clean só põe cepa-live de lado depois que a cópia nova está completa,
      e não cria cepa-live.prev quando cepa-live ainda não existe
    commit: b5e634aa202c21df1f16b4a6be9cbf53e280f6bc
  - texto: Quando o --rollback restaura só a pasta fixa, o registro operacional
      fica sem versões de/para em vez de ler um cache.rolledback antigo
    commit: b5e634aa202c21df1f16b4a6be9cbf53e280f6bc
