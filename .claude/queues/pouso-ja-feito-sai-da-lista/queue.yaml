    a 34 s (20 eventos nos .jsonl do clone), mas falha + rollback pode passar de
    60 s: o doctor mata o pending, a instalação segue (start_new_session) e o evento
    não é gravado; (2) install_for_closed só captura OSError, outra exceção de install_on_landing
    derrubaria o pending depois do fechamento gravado; (3) para o CS-7: o fechamento
    escreve no .jsonl de TODOS os runs fechados na chamada, o commit precisa incluir
    todos; o .log da instalação está no .gitignore no layout .claude/queues, não
    no layout legado .claude/programs. Fora do escopo: CS-7 a CS-9.'
  head_commit: 94e6cae85b0d207bd5d32c65a57a53ee9a640c2a
  decisions:
  - texto: Quando a lista fecha vários runs de uma vez, os plugins são reinstalados
      uma vez só e o aviso da instalação é copiado para o registro de cada run fechado.
      Run fechado como descartado não reinstala. No modo para código, o texto da
      instalação sai no canal de erro. A reinstalação roda mesmo quando quem chamou
      a lista foi o diagnóstico, que espera só 60 segundos.
    commit: 50984ddee54932875eefd97f721a9cf8527ec6f5
