- id: CS-1
  title: O run com build vermelho cujo merge já está no upstream sai da lista e
    vira `aterrissado`, sem build
  why: 'herdado da ordem do texto da especificação; ninguém priorizou os critérios
    entre si · superfície onde se observa: cli · teste vermelho declarado: num repo
    de teste com remoto, o run `a/r1` está em `esperando-dono` com `aterrissagem.parou:
    build-vermelho` e o branch contido em `origin/main`, e o run `a/r2` está na
    mesma situação mas com o merge só no `main` local. O `verify` dos dois é um
    script que grava um arquivo marcador. Depois de `cepa-until pending`, o teste
    exige: nenhuma linha de espera para `a/r1`, `estado: aterrissado` no registro
    de `a/r1`, arquivo marcador ausente, e a linha "merged in `main` with a red
    build" ainda presente para `a/r2`. Hoje a linha de espera aparece para os dois
    e o registro de `a/r1` segue `esperando-dono`.'
  status: pending
