- id: CS-3
  title: o launcher `cepa` abre a sessão seguinte quando a anterior deixou o próximo
    passo gravado
  why: 'é o pedaço que tira o dono do papel de abrir a sessão seguinte (causa C1);
    vem antes do CS-4 porque pode ser provado com o arquivo escrito à mão · superfície
    onde se observa: cli · teste vermelho declarado: com `.claude/sessions/<id>.next.json`
    contendo `{"repo": "<path>", "modo": "descoberta", "brief": "<texto>"}` escrito
    pela sessão que acabou de sair, o launcher `cepa` (em modo de teste, com `claude`
    substituído por um stub que registra argumentos) executa o stub uma segunda
    vez com cwd igual a `repo`, `--modo descoberta` e o brief como prompt inicial,
    e apaga o arquivo; hoje o launcher sai depois do primeiro `claude` e o arquivo
    não é lido.'
  status: done
  blocked_by: []
  human_pending: null
  evidence: 'Commits 889ab85 (feat: common/bin/cepa nao faz mais exec do claude;
    run_claude gera CEPA_LAUNCH_ID; common/hooks/session-chain.py novo le o .launch,
    pega o .next.json da sessao mais recente, valida repo/modo/brief, apaga e reabre
    o cepa em repo com --modo e o brief como prompt; session-registry anota o session_id
    no SessionStart; _wtlib.read_entries ignora *.next.json; CEPA_ENCADEAR=off desliga),
    8fe4010 e f8764d3 (testes reforcados apos UNPROVEN), 91134c5 (aceite+prova).
    tests/test_cepa_encadeamento.py: vermelho na base a1030d7 (12 FAIL), verde no
    HEAD; 18 arquivos de teste vizinhos (cepa_modo, cepa_prompt, session/worktree/registry)
    verdes. pair-reviewer APPROVE com ressalvas; completion-auditor COMPLETE (.claude/acceptance/CS-3.yaml,
    auditado em 889ab85, depois so o teste mudou); proof-reviewer UNPROVEN nas voltas
    1 e 2 (validacao de brief/modo, reversed(sids), exit do rc sobreviviam), NEEDS-HUMAN
    na 3 por L2/L4 sem ferramenta, PROVEN apos aplicar a mesma regua de CS-1/CS-2
    (docs/proof/CS-3.yaml, 16 perturbacoes vermelhas). Interpretacao: ''--modo descoberta''
    e o --modo do cepa (grava .claude/session-mode), nao flag do claude real. Fora/ressalvas:
    modo invalido no .next.json apaga o arquivo antes do cepa recusar (proximo passo
    perdido); brief iniciado por ''-'' vira flag do claude; SIGTERM so no pid do
    cepa nao chega ao claude; checagem de hostname na limpeza do registro sem perturbacao
