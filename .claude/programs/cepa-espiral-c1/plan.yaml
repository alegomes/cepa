  blocked_by: []
  human_pending: null
  evidence: 'Volta 2. O vermelho da volta 1 nao era do CS-1: tests/test_cepa_modo.py
    e tests/test_cepa_prompt.py ja falhavam na base 06d7dd5 porque herdavam CEPA_PROMPT=smartass
    do ambiente do cepa-until (sem a variavel, verdes). Commit 7f5a489 tira CEPA_PROMPT/CEPA_PROMPT_MODO
    do os.environ no topo dos dois testes; vermelho->verde provado (sem o patch
    e com CEPA_PROMPT setado: 1 e 2 falhas; com o patch: verdes). CS-1 trazido da
    lateral until/2026-10-08-2047-vermelho-CS-1 por cherry-pick sem alteracao: 7c6c84c
    (feat) e fa37c1b (aceite+prova), patch-id identico a 2c469ef/cf95f53, entao
