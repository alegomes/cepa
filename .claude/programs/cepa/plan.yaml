- id: session-log-ancorar-na-raiz
  title: session-log.py grava no diretório corrente e fatia o log quando um comando
    faz cd
  why: 'achado em 2026-08-04. `common/hooks/session-log.py:89-90` resolve o destino
    como `Path(payload["cwd"]) / ".claude" / "session-log.md"` — o cwd do MOMENTO,
    não a raiz do repo. Um `cd .claude/programs` num comando meu fez dois turnos
    (00:37 e 00:40 UTC) irem parar em `.claude/programs/.claude/session-log.md`,
    e eles NÃO estavam no log real: não era cópia, era perda. Resgatados à mão para
    a posição cronológica certa antes de eu apagar o diretório. O dano é silencioso
    — ninguém percebe turno faltando no log até precisar dele, e o `/common:recap`
    e o `/common:handoff` leem exatamente esse arquivo para reconstruir o que foi
    pedido. Só apareceu porque o diretório órfão surgiu no `git status`. Conserto
    provável: ancorar em `git rev-parse --show-toplevel` (ou no `CLAUDE_PROJECT_DIR`)
    em vez do cwd, caindo no cwd só quando não houver repo. Cuidado: em worktree
    ligada, o log deve seguir a worktree, não o clone principal — o mesmo cuidado
    que o handoff já toma com `--git-common-dir`. Precisa de teste com cwd em subdiretório.
    Reincidiu em 2026-08-18: um `cd board-flow/commands` num comando de shell criou
    `board-flow/commands/.claude/session-log.md` com os pedidos daquele turno. Só
    apareceu, de novo, porque o diretório órfão saltou no `git status` — nenhum
    aviso, nenhum bloqueio. Confirma que o defeito não é um azar de um comando,
    e que o cwd do Bash PERSISTE entre chamadas: um único `cd` desvia o resto da
    sessão inteira. Duas coisas que o achado de 08-18 acrescenta ao conserto: (1)
    o prejuízo concreto tem nome — `/common:recap` monta a tabela "você pediu /
    eu entreguei" a partir desse arquivo, então log partido vira meia sessão apresentada
    como a sessão toda; (2) provavelmente é uma CLASSE, não um arquivo: cerca de
    vinte hooks montam caminho a partir do cwd cru (`capture-build-result`, `gate-advance`,
    `mark-build-stale`, `session-activity`, `session-checkpoint`, entre outros),
    e o mesmo `cd` pode estar espalhando `last-build.json` do mesmo jeito. Um helper
    único de "raiz da sessão" em `_wtlib` (ao lado de `repo_root`/`main_root`) resolve
    todos de uma vez; consertar só o session-log deixa a classe de pé.'
  status: done
  blocked_by: []
  human_pending: null
  evidence: 'done em 2026-08-25, branch session/next (3 commits, 355b693 fix(hooks)
    + b2b500b common 2.8.0 + ebe5dca test), NAO aterrissada em main ainda. O card
