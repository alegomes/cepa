- id: build-result-mascara-grep-e-aceita-mvn-q
  title: capture-build-result não lê `grep ... verify` como build Maven, e registra
    verde o `./mvnw -q ... > log` com exit 0
  why: 'Primeiro porque é o único dos três que barra trabalho em repo de cliente:
    o falso FAILURE gravado por um grep barrou um `git commit` do plan.yaml horas
    depois e só destravou com um `./mvnw clean verify` inteiro (feedback fb-20261008-1,
    wego-recebiveis-backend, 2026-10-08; BACKLOG.md, seção "`gate-advance` classifica
    `grep` com a palavra `verify` como build Maven"). Esboço já escrito na seção:
    classificar sobre o comando com strings mascaradas (a máscara do `_shellscan`
    que o maven-reactor-guard usa desde 023c7f2), exigir invocador mvnw/mvn, e com
    -q ou saída redirecionada usar o código de saída. Ordem proposta pelo agente
    em 2026-10-19 e confirmada pelo dono.'
  status: done
  blocked_by: []
  human_pending: null
  evidence: 'Episódio 1 já estava em 6a07300 (2026-10-15). Episódio 2 nesta rodada:
    commits 2ab3945 e 2226535 na branch until/2026-10-19-1958. Causa medida no transcrito
    do run until/2026-10-16-0822: (A) build de perturbação com ''git -C wt ...;
    cd wt && sed && ./mvnw'' gravou FAILURE na árvore principal porque effective_build_dir
    só seguia cd no início da linha; agora usa _shellscan.segment_dirs e grava no
    diretório do segmento Maven. (B) ''./mvnw ... | grep BUILD; cat .claude/last-build.json''
    virou FAILURE porque o JSON ecoado trazia BUILD FAILURE dentro do campo tail;
    marcadores Maven agora ancorados no início da linha, ANSI removido. Gates: pair-reviewer
    OK-WITH-NOTES (cosmético), completion-auditor COMPLETE (.claude/acceptance/build-result-mascara-grep-e-aceita-mvn-q.yaml),
    proof-reviewer PROVEN (docs/proof/build-result-mascara-grep-e-aceita-mvn-q.yaml:
    4 perturbações, cada uma derruba teste; 4 testes vermelhos na base 4bdd311).
    Testes: 10 arquivos-alvo verdes e 29 passed no classify; build completo é do
    supervisor. Fora do escopo: gradle segue com marcador substring (mesmo risco
    do cat, não pedido).'
