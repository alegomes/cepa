    status: incomplete
extras:
  anti_loop:
    note: >
      stop_hook_active=true deixa a repetição passar (teste e). Aceito como caveat conhecido,
      na convenção do report-style-lint: o hook bloqueia uma vez e nomeia os arquivos; se o
      modelo reemitir a frase sem limpar, o clone segue sujo e o cepa-until recusa. Coberto por teste; não é gap.
  never_crashes_turn:
    note: >
      main() envolve on_stop em try/except e sai 0 sempre; telemetria fail-silent. Teste a afirma
      'exit 0'. Não há teste com payload quebrado/transcript inexistente (inspeção de código apenas).
  doctor_shared_rule:
    note: >
      check_dirty_tree usa _dirt.counts_as_dirt; tests/test_doctor_tracked_runtime.py
      ('queue.yaml.bak não conta') e tests/test_doctor_dirty_tree.py passam (tudo verde).
