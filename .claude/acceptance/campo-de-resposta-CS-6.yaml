  - "Conferi o posicionamento do cherry-pick em common/bin/cepa-until: o bloco `if r == \"v\":` está dentro do laço interno de leitura de tecla, antes do `break`. Falha do editor faz `continue` e só repergunta o prompt do mesmo menu (mesmo caminho do 'is not one of the options'); não chega ao `[y/N]` nem a answer(), então o queue.yaml não é tocado. O `typed` só é usado no ramo `r == \"v\"` adiante, e o `r != \"?\"` / laço externo do `?` não são afetados."
