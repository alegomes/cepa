  - id: AC5
    description: >
      Gates de common/hooks/_jiramut.py — workitem create, workitem update
      só de campos (inclusive --field) e workitem link workitem são
      escrita legível e os 4 gates (acceptance-gate, merge-truth-gate,
      summary-nulls-gate, bounce-reason-gate) deixam passar; update com
      --status/--comment/--transition-comment/--resolution/--fields-json/
      --variables-json é opaco e os gates barram; --help/-h, link query,
      field create-metadata e comment query não são barrados.
    altitude: application
    surface: "os 4 hooks reais (common/hooks/acceptance-gate.py, merge-truth-gate.py, summary-nulls-gate.py, bounce-reason-gate.py) rodando como processo (stdin JSON -> exit code) diante de um comando `twg`"
    test: tests/test_jiramut_deteccao_por_efeito.py (bloco "--- quatro gates como processo, com twg ---")
    layer: processo (subprocess.run de cada um dos 4 hooks reais, não só a função classify)
    evidence: verified
    run: |
      $ python3 tests/test_jiramut_deteccao_por_efeito.py
      --- quatro gates como processo, com twg ---
        ok  [exit 0] acceptance-gate.py: create legivel passa
        ok  [exit 0] acceptance-gate.py: update de campo passa
        ok  [exit 0] acceptance-gate.py: link entre cards passa
        ok  [exit 0] acceptance-gate.py: --help passa
        ok  [exit 0] acceptance-gate.py: comment query passa
        ok  [exit 2] acceptance-gate.py: update --status e barrado
        ok  [exit 2] acceptance-gate.py: update --comment e barrado
        ok  [exit 2] acceptance-gate.py: update --fields-json e barrado
        (mesmos 8 casos, mesmo resultado, para merge-truth-gate.py, summary-nulls-gate.py
        e bounce-reason-gate.py)
      32/32 passaram
      Lido o trecho comum dos 4 gates (ex. common/hooks/acceptance-gate.py:149-157): cada um
      chama `_mut = J.classify(payload)`; se `_mut["opaque"]` chama `J.block(...)` (exit 2); senão,
      para `kind != "transition"` (create/edit/link/comment-query) sai 0 imediatamente — confirma
      que os 32 casos exercitam de fato o caminho de decisão do gate, não uma coincidência de outra
      regra de negócio bloqueando/liberando por outro motivo.
    verdict: complete

