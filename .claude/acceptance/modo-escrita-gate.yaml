    altitude: process
    surface: mesma invocação de processo, alvo fora da raiz da sessão
      (/tmp/...)
    test: tests/test_modo_escrita_gate.py::test_fora_da_raiz_passa
    layer: subprocess / hook-de-processo
    evidence: verified
    run: "python3 tests/test_modo_escrita_gate.py -> ok em 'fora da raiz passa: /tmp/perturba/App.java' e '/tmp/scratch/nota.py'"
    veredito: complete

  - id: AC6
    descricao: >
      Desvio declarado 3 do esboço: a exigência 1 cobrava mais do que
      _shellscan.py tinha; a divergência entre a versão do bash-path-lock e a
      versão mais pobre do enforcement-guard é reconhecida, e a dívida de NÃO
      migrar o enforcement-guard é registrada (não escondida) no detector de
      deriva.
    altitude: process + estrutural
    surface: tests/test_lock_copies_drift.py compara as duas fontes do motor
      função a função (AST), e documenta em comentário por que
      enforcement-guard.py fica fora da comparação de propósito
    test: tests/test_lock_copies_drift.py::
      test_motor_do_shellscan_bate_com_o_bash_path_lock +
      test_guards_do_common_nao_recopiam_o_motor
    layer: pytest (comparação estrutural de AST) — apropriado aqui porque o
      critério é "as duas fontes concordam / a dívida está nomeada", não um
      comportamento observável em runtime
    evidence: verified
    run: "bash tests/run-all.sh -> família pytest, 52 passed in 0.20s (inclui os dois casos acima); dívida do enforcement-guard citada em BACKLOG.md e em comentário SHELLSCAN_ALVO_FUNCS do teste"
    veredito: complete

