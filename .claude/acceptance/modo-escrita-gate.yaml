    veredito: complete

gaps: []

nota_geral: >
  Todos os critérios foram checados na ALTITUDE certa: invocação de
  common/hooks/modo-escrita-gate.py como PROCESSO, com um payload de
  PreToolUse ({tool_name, tool_input, cwd}) via subprocess, lendo o código de
  saída (0=libera, 2=bloqueia) e o texto de stderr — nunca por leitura de
  fonte como prova de comportamento (a única checagem por leitura de fonte,
  em test_tabela_vem_de_modos_py, audita arquitetura interna — "o hook
  importa em vez de copiar" — e não um critério de aceite do card). Rodei
  tests/run-all.sh (59/59 arquivos, família pytest 52/52) e isoladamente
  tests/test_modo_escrita_gate.py e tests/test_lock_copies_drift.py; todos
  verdes. Para o AC2 fiz uma prova adicional própria (comentário
  "# modo-ok" em Bash), porque a suíte prova a AUSÊNCIA de anúncio do kill
  switch mas não tinha um caso positivo de "comentário não engana o parser";
  rodei eu mesma e confirmei rc=2.

  Os três desvios declarados na seção "O que foi construído" do card foram
  auditados individualmente (AC4, AC5, AC6) e nenhum deles esvazia um
  critério do esboço: BACKLOG.md nas listas brancas é uma correção
  necessária apontada pelo próprio texto (sem ela a Reflexão não fecha);
  liberar escrita fora da raiz da sessão é uma decisão de escopo consistente
  com a memória path-lock-out-of-root; e a dívida do enforcement-guard não
  migrado está nomeada e propositalmente fora do escopo deste card, tanto no
  BACKLOG.md quanto no comentário do teste de deriva — não é um critério
  escondido, é um débito às claras.
