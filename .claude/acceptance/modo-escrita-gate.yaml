    descricao: >
      Registro do hook no PreToolUse do plugin.json, para Bash e para
      Edit|Write|MultiEdit|NotebookEdit — sem isso o gate existe no disco mas
      não roda em sessão real.
    altitude: config/plugin
    surface: common/.claude-plugin/plugin.json, chave hooks.PreToolUse
    test: leitura direta do plugin.json (não há um "teste" de framework para
