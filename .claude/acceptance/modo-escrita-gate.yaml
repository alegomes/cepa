      Reflexão.
    altitude: process
    surface: mesma invocação de processo, alvo = "BACKLOG.md" em Edit, um
      teste por modo
    test: tests/test_modo_escrita_gate.py::test_lista_branca_por_modo
      (dicionário PERMITIDO inclui "BACKLOG.md" para os 5 modos com lista)
    layer: subprocess / hook-de-processo
    evidence: verified
    run: "python3 tests/test_modo_escrita_gate.py -> ok em '<modo>: libera BACKLOG.md' para os 5 modos"
    veredito: complete

  - id: AC5
    descricao: >
      Desvio declarado 2 do esboço: escrita fora da raiz da sessão passa
      (worktree de perturbação em /tmp, scratchpad) — não estava no esboço
