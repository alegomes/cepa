criterios:
  - id: AC1
    descricao: >
      O gate cobre Bash também, reusando common/hooks/_shellscan.py (não uma
      cópia nova do parsing de linha de comando).
    altitude: process
    surface: >
      invocar common/hooks/modo-escrita-gate.py como subprocesso com um
      payload PreToolUse {tool_name: "Bash", tool_input: {command: ...}} e
      conferir o código de saída
    test: tests/test_modo_escrita_gate.py::test_bash_nao_e_rota_de_fuga,
      test_bash_libera_o_que_o_modo_produz, test_ge_nao_e_redirecionamento
    layer: subprocess / hook-de-processo (altitude correta: é assim que o
      hook roda em produção via PreToolUse)
    evidence: verified
    run: "python3 tests/test_modo_escrita_gate.py -> 'tudo verde' (18/18 ok, incluindo os 5 casos de bash: >, >>, sed -i, tee, git mv bloqueados; sed -i com script BSD vazio liberado)"
    reuso_shellscan: >
      Confirmado por leitura + teste de deriva: modo-escrita-gate.py importa
      _shellscan.py (`import _shellscan as S`) e chama
      `S.extract_write_targets`. A extração de alvos de escrita
      (_segment_targets/extract_write_targets) foi PORTADA do
      build-hex/hooks/bash-path-lock.py para _shellscan.py nesta mesma leva
      (a212e59), e tests/test_lock_copies_drift.py::
      test_motor_do_shellscan_bate_com_o_bash_path_lock compara as duas
      fontes função a função (AST) e fica vermelho se divergirem — rodei
      pytest e o caso passa.
    veredito: complete

  - id: AC2
    descricao: >
      O escape não pode ser barato — nada de `# modo-ok`; a única saída
      honesta é CEPA_MODO=off (visível, desliga tudo) ou encerrar o modo e
      abrir outro.
    altitude: process
    surface: >
      mesma invocação de processo do AC1, variando env CEPA_MODO e o
      conteúdo textual do comando Bash
    test: tests/test_modo_escrita_gate.py::test_kill_switch (CEPA_MODO=off
      libera) + test_mensagem_diz_o_que_fazer (stderr NÃO contém "CEPA_MODO")
    layer: subprocess / hook-de-processo
    evidence: verified
    run: >
      (a) suíte do repo: python3 tests/test_modo_escrita_gate.py -> ok em
      "CEPA_MODO=off desliga o gate" e em "mensagem NÃO anuncia o kill
      switch";
      (b) prova adicional que eu mesmo rodei (não estava na suíte): chamei o
      hook com um comando Bash carregando um comentário
      `echo x > common/hooks/novo.py  # modo-ok` em modo exploracao — saída
      `rc 2` (bloqueado), confirmando que um comentário não é rota de fuga.
      Comando: script Python ad-hoc via subprocess, payload
      {"tool_name":"Bash","tool_input":{"command":"echo x > common/hooks/novo.py  # modo-ok"}}
      -> "rc 2 [modo-escrita-gate] BLOQUEADO...".
    veredito: complete

  - id: AC3
    descricao: >
      A mensagem de bloqueio tem que dizer o que fazer: registrar pelo
      off-mode-capture e seguir, ou encerrar o modo e abrir o modo certo.
    altitude: process
    surface: >
      mesma invocação de processo, lendo o texto de stderr devolvido pelo
      hook
    test: tests/test_modo_escrita_gate.py::test_mensagem_diz_o_que_fazer
    layer: subprocess / hook-de-processo
    evidence: verified
    run: "python3 tests/test_modo_escrita_gate.py -> ok em 'mensagem nomeia o modo ativo', 'mensagem nomeia o alvo', 'mensagem oferece a captura do desvio', 'mensagem oferece encerrar o modo', 'mensagem NÃO anuncia o kill switch'"
    veredito: complete

  - id: AC4
    descricao: >
      Desvio declarado 1 do esboço: BACKLOG.md entra em TODAS as listas
      brancas (exploracao, descoberta, design, reflexao, documentacao),
