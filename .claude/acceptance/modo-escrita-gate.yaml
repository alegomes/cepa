    evidence: verified
    run: >
      grep confirma "modo-escrita-gate.py" nos dois matchers ("Bash" e
      "Edit|Write|MultiEdit|NotebookEdit") de hooks.PreToolUse em
      common/.claude-plugin/plugin.json.
    nota: >
      Isto NÃO é um critério isolado do esboço, é um pré-requisito
