key: cepa-until-cota-apertada
status: complete
diff: c15ff25..6e2b58d
audited_at: "2026-09-18"
criteria:
  - id: AC1
    text: >
      Antes de começar um item, quando a cota projetada de 5h não comporta o
      item E o reset (+margem) NÃO cabe dentro da janela (prazo - reserva), o
      supervisor COMEÇA o item mesmo assim (sem parar por `cota-no-fim`),
      imprime o aviso "começo assim mesmo" e registra um evento de ledger
      `cota_apertada` com id, uso e reset.
    altitude: cli
    surface: >
      `common/bin/cepa-until` executado ponta a ponta contra um `claude` falso
      (stream-json), observável via o .jsonl do run, o plan.yaml e o stdout.
    test: >
      tests/test_cepa_until_cota.py::test_pausa_que_nao_cabe_na_janela_comeca_assim_mesmo
      e ::test_sem_historico_cota_acima_de_90_comeca_se_o_reset_nao_cabe
    layer: cli-e2e (fake claude subprocess)
    evidence: verified
    run: >
      `python3 tests/test_cepa_until_cota.py` → todas as verificações `ok`,
      incluindo "o a3 começou assim mesmo", "o registro nomeia o item e o
      uso", "a tela avisou antes e listou no fim" (aviso "começo assim mesmo"
      e evento `cota_apertada` com id=a3, uso=0.8, reset presente) — linha
      final "✓ tudo verde".
    verdict: complete
    gap: null

  - id: AC2
    text: >
      Quando o reset CABE dentro da janela, o comportamento anterior é
      mantido: espera o reset (evento `pausa_de_cota`) e então começa o item.
    altitude: cli
    surface: mesmo run ponta a ponta via ledger .jsonl.
    test: >
      tests/test_cepa_until_cota.py::test_pausa_antes_do_item_que_a_cota_nao_comporta
      e ::test_bateu_o_teto_espera_o_reset_e_retoma_o_mesmo_item
    layer: cli-e2e
    evidence: verified
    run: >
      `python3 tests/test_cepa_until_cota.py` → "a pausa veio antes do a3, e
      só dele", "...o a3 só largou depois do reset", "...o registro guarda
      uso e custo medido" — todas `ok`.
    verdict: complete
    gap: null

  - id: AC3
    text: >
      `run_end` carrega `cota_apertada` (contagem) e o relatório final lista
      "Começados com a cota apertada (N)".
    altitude: cli
    surface: evento run_end do ledger + stdout do relatório final.
    test: >
      tests/test_cepa_until_cota.py::test_pausa_que_nao_cabe_na_janela_comeca_assim_mesmo
      (assert em run_end(raiz)["cota_apertada"] == 1 e em
      "Começados com a cota apertada (1)" no p.stdout) e
      ::test_sem_historico_cota_acima_de_90_comeca_se_o_reset_nao_cabe
      (run_end(raiz)["cota_apertada"] == 1).
    layer: cli-e2e
    evidence: verified
    run: >
      Mesma execução acima — "...o run terminou pela fila, com 1 item
      apertado" e "...a tela avisou antes e listou no fim" `ok`.
    verdict: complete
    gap: null

  - id: AC4
    text: >
      O comportamento de limite de uso NO MEIO do item (espera o reset se
      couber, senão para com `limite-de-uso`) permanece inalterado.
    altitude: cli
    surface: mesmo run ponta a ponta.
    test: >
      tests/test_cepa_until_cota.py::test_bateu_o_teto_espera_o_reset_e_retoma_o_mesmo_item,
      ::test_reset_fora_da_janela_para_em_vez_de_esperar,
      ::test_tres_cortes_seguidos_encerram_o_run,
      ::test_item_que_fecha_entre_cortes_zera_a_contagem,
      ::test_prosa_sobre_o_teto_no_meio_do_stream_nao_e_teto
    layer: cli-e2e
    evidence: verified
    run: >
      `python3 tests/test_cepa_until_cota.py` (as 5 seções acima) e as suítes
      de regressão `python3 tests/test_cepa_until.py`,
      `python3 tests/test_cepa_until_rede.py`,
      `python3 tests/test_cepa_until_adversarial.py` — todas terminam com
      "✓ tudo verde" / "todos passaram", sem regressão no comportamento de
      `limite_de_uso` intra-item.
    verdict: complete
    gap: null
