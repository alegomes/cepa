    demonstrated_by:
      test: "tests/test_aviso_worktrees_fantasma.py (dispara o hook real via subprocess num repo git descartável)"
      layer: "subprocess do hook inteiro (não uma função isolada de _wtlib) lendo o additionalContext"
      evidence: verified
      run: |
        python3 tests/test_aviso_worktrees_fantasma.py
          ok   classify: ref apagado é branch_gone
