notes: |
  Fora do escopo por decisão do card (não afeta o veredito): o sintoma
  "session/2118 anunciada como sessão aberta" vem do bloco de registro de
  sessões (item 2c de on_start), não do bloco 📋 auditado aqui.

  Teste roda o hook de verdade via subprocess (session-registry.py), não uma
  função isolada de _wtlib.py — altitude confere com o texto do critério, que
  fala do bloco do SessionStart, não de uma função interna.

  branch_exists() em _wtlib.py usa `git rev-parse --verify --quiet
  refs/heads/<branch>`, equivalente à checagem "existe em git branch -a" para
  branches locais (que é o universo de `git worktree list`).
