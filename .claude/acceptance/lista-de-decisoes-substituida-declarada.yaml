notes:
  repeat_still_holds_numbering: >
    O esboço do backlog dizia que a linha "repete o que ainda vale, com numeração
    que não colide". A implementação exige só a linha de substituição; a mensagem
    do bloqueio e o SKILL.md mandam repetir os itens que ainda valem, mas isso
    não é verificado (o hook não tem como saber quais itens valem). Julgamento:
    não é lacuna de critério. A linha declarada é o que desfaz a ambiguidade
    (o dono sabe que só a lista nova vale); a checagem de numeração sem colisão
    seria heurística frágil. Fica registrado como diferença do esboço, não como
    pendência; se o dono quiser a checagem, vira card novo.
