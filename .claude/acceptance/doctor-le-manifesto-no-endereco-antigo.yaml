    surface: "saída do binário `common/bin/cepa-doctor --projeto`, rodado
      como subprocesso (o usuário só observa o texto do relatório do
      doctor, nunca chama check_env_manifest diretamente)."
    test: "tests/test_doctor_env_manifest_path.py::test_legado_claude_env_yaml_porta_ocupada_tambem_avisa
      e ::test_docs_env_yaml_ganha_do_legado_na_porta — o primeiro monta um
      repo só com `.claude/env.yaml` (sem docs/env.yaml) e exige o aviso; o
      segundo monta os dois manifestos com portas diferentes e exige que só
      a porta de docs/env.yaml apareça no relatório, provando a ordem de
      precedência de `_wtlib.env_manifest_path`."
    layer: "subprocess.run([sys.executable, cepa-doctor, '--projeto']) —
      integração real via CLI, não chamada direta de função Python."
    evidence: verified
    run: "python3 tests/test_doctor_env_manifest_path.py -> 'test_legado_claude_env_yaml_porta_ocupada_tambem_avisa:
      ok  .claude/env.yaml (legado, sem docs/env.yaml) também dispara o
      aviso' e 'test_docs_env_yaml_ganha_do_legado_na_porta: ok docs/env.yaml
      ganha: avisa da porta do docs/env.yaml / ok ...e NÃO menciona a porta
      do legado (docs/env.yaml venceu)'; ao final: '✓ tudo verde' (3 funções
      de teste executadas, todas ok, nenhuma falha). Confirmei no diff que
      check_env_manifest deixou de hardcodar `.claude/env.yaml`
