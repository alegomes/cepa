notes: >
  Nenhum gap encontrado. maestro-prune é testado com git real + herdr fake
  (contrato mecânico, tests/test_maestro_prune.py, 30 checks) e também
  confirmado ao vivo contra o herdr 0.9.1 de verdade instalado nesta máquina
  (docs/proof/evidence/herdr-space-por-worktree-e2e.sh) — rodei o roteiro ao
  vivo eu mesmo nesta auditoria e o resultado bateu exatamente com o .out
  gravado (Space de A cai, Space de B permanece, git confirma). As partes de
  run.md (passo 2, 6a, 9) são instrução para agente (prompt), não código; a
  verificação possível para essas é textual (grep), convenção já usada em
  outras auditorias deste repo (ex.: .claude/acceptance/maestro-run-nao-diz-a-aba.yaml).
  AC2 cobre DONE e FAIL diretamente; TIMEOUT/ESCALATED/pending/running não têm
  teste dedicado mas passam pelo mesmo caminho de código (`landed_slices`: só
  `status == "LANDED"` ou presença em `landed:` legado entra em prune) — risco
  residual baixo, registrado aqui por transparência, não como gap.
