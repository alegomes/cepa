  - id: CA-8
    text: >
      A reconciliacao plano x quadro Jira existe como CODIGO chamavel
      (cepa-plan reconcile), usada tanto pelo /common:next --sync quanto pelo
      /common:drain-plan, e nao como prosa duplicada.
    altitude: cli (o binario) + prosa-do-comando (os dois pontos de chamada)
    surface: >
      python3 common/bin/cepa-plan reconcile <nome> --board ARQUIVO [--apply];
      e as duas prosas que devem chama-lo: common/commands/next.md (passo
      "Sync", com --sync) e common/commands/drain-plan.md (passo 0)
    test: >
      O binario `reconcile` esta testado
      (tests/test_common_drain_plan.py::test_reconcile_traz_o_quadro_para_a_fila
      e outros). O lado drain-plan.md esta testado em
      tests/test_common_drain_plan.py::test_contrato_do_comando (checa
      "cepa-plan reconcile" no texto). O lado common/commands/next.md AGORA TEM
      teste dedicado: tests/test_common_next.py (novo neste commit), com 10
      checagens que leem common/commands/next.md e confirmam: (1) a leitura do
      quadro e delegada ao atlassian-expert, nao lida direto; (2) a comparacao
      passa por `cepa-plan reconcile` em vez de "comparar de olho"; (3) o passo
      Sync grava pelo mesmo comparador com `--apply`; (4) proibe editar o YAML
      a mao; (5) declara que o comparador nunca fecha human_pending — so o
      usuario fecha; (6) card do quadro ausente do plano nao e anexado, e diz
      quem os coloca (--from-jira); (7) sem --sync o comando e read-only; (8)
      sem tracker, o status e declaradamente auto-declarado.
    layer: cli-subprocess (reconcile) + string-match no .md (as duas prosas de chamada)
    evidence: verified
    run: "python3 tests/test_common_next.py -> 'all green' (rodado nesta reauditoria, HEAD 853b67e, 11 checagens todas ok)"
    verdict: complete

