    detalhe: >
      O commit 853b67e acrescentou tres checagens novas a
      test_contrato_do_comando que fecham exatamente a lacuna apontada na
      auditoria anterior: (1) fatia o texto entre "### 0." e "### 1." e
      confirma que "cepa-plan reconcile" aparece dentro dessa fatia — ou seja,
      a reconciliacao esta DENTRO do passo 0, antes do passo 1 que monta a
      fila via `cepa-plan queue`; (2) confirma que a substring `--offline`
      aparece no arquivo; (3) confirma que `--offline` aparece pelo menos 3
      vezes no texto limpo (sem crases), o que forca a opcao a aparecer em
      mais de um lugar em vez de so na lista de variaveis. Conferido no
      arquivo fonte: `--offline` aparece nas linhas 47 (declaracao da
      variavel), 89 (condicao "sem quadro nao ha..., ou com --offline", no
      passo 0) e 258 (condicao da transicao do card no passo 3.d) de
      common/commands/drain-plan.md — as duas pontas citadas no criterio
      (leitura do quadro e transicao do card) estao cobertas, e o teste
      falharia se qualquer uma delas voltasse a ignorar a flag.

