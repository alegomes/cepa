      quadro e nao veio --offline).
    altitude: prosa-do-comando
    surface: common/commands/drain-plan.md (comando e prompt, nao executa como codigo)
    test: tests/test_common_drain_plan.py::test_contrato_do_comando
    layer: string-match no .md
