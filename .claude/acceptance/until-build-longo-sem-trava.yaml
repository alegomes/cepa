    test: nenhum teste automatizado no repo nesta altitude — apenas o
      experimento manual E (/tmp/exp-bg-longo/E)
    layer: e2e manual (nested claude -p, fora da suíte de testes)
    evidence: assumed
    run: >-
      Não rodei eu mesmo (exigiria `claude -p` aninhado por ~12,5 min, e a
      tarefa pede nada em segundo plano e nenhum build completo). Inspecionei
      os artefatos: /tmp/exp-bg-longo/E/{prompt.txt,inicio,fim_claude,
