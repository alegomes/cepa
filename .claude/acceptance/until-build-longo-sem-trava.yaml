julgamento_do_objetivo: >-
  Os dois commits desta rodada (5f0ff71, 85848ad) melhoram a evidência de
  AC2 sem fechá-la na altitude do critério. 5f0ff71 versiona e repete o
  experimento manual que a rodada anterior descontava (agora é um script no
  repo, `tests/e2e_build_longo_claude_p.py`, e o experimento F confirma o
  mesmo resultado do experimento E: 737s, resultado colhido). 85848ad corrige
  um defeito de verdade que o transcript do experimento F revelou (parênteses
  de subshell grudando no arquivo de EXIT=) e o cobre com um teste de
  unidade. Isso é progresso real sobre o MECANISMO do hook. Mas o critério
  fala do item da FILA chegando a `done` "rodado por trás" do
  `common/bin/cepa-until" — e nenhum teste, novo ou antigo, faz o
  `cepa-until` de verdade (com seu `monta_comando`/`/common:drain-plan`, sua
  fila, seu `cepa-plan finish`) disparar um build de mais de 10 min e colher
  o resultado. Continua exatamente a mesma lacuna nomeada na rodada anterior:
  o hook está provado sob agente real (fora do supervisor) e o loop do
  supervisor está provado com um duplo (sem os hooks, sem Bash real). "As
  duas metades cobertas separadamente" — o card de regras da auditoria chama
  isso, textualmente, de incompleto, não de rodapé. status permanece
  incomplete.
