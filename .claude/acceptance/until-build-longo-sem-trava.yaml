      "Última linha: BUILD SUCCESS" + "Código de saída: 0";
      /tmp/exp-bg-longo/F.out = "claude saiu 0 em 737s (custo 0.162...)" e
      "ok  build de mais de 10 min colhido dentro da janela"; o transcript em
      ~/.claude/projects/-private-tmp-exp-bg-longo-F/*.jsonl confirma a
      sequência real: 1ª tentativa de segundo plano sem `EXIT=$?` bloqueada
      pelo hook às 17:07:43; 2ª tentativa com `echo EXIT=$? >> /tmp/b.fim`
      aceita; espera em primeiro plano cortada pelo próprio Bash aos 600s
      (17:16:55) e retomada no turno seguinte até ler `EXIT=0` (17:19:39);
      resultado.txt escrito e confirmado às 17:19:50 — do disparo do build
      real ao resultado colhido, ~12 min.
    status: incomplete
    gap: >-
      O gap continua sendo exatamente o apontado na rodada anterior, e o
      commit novo NÃO o fecha: falta um teste — automatizado ou, na falta
      disso, o próprio experimento manual rodando de verdade — em que
      `common/bin/cepa-until` (não um script solto com settings.json
      fabricado) dispara o agente via seu caminho real
      (`monta_comando`/`/common:drain-plan`), esse agente roda um build
      sintético que passa de 10 min gravando `EXIT=`, e o ITEM da fila
      termina `status=done` (ou `blocked`, dependendo do desenho) com o
      resultado presente. Hoje isso está partido em duas metades que nunca se
      encontram no mesmo teste: (a) `e2e_build_longo_claude_p.py` prova que o
      MECANISMO do hook funciona sob um `claude -p` de verdade, mas por fora
      do `cepa-until` — sem fila, sem `cepa-plan finish`, sem os argumentos
      reais que `monta_comando` monta (`/common:drain-plan <fila> --max 1`,
      `--output-format stream-json`); (b) `test_cepa_until.py` prova que o
      LOOP do `cepa-until` leva itens a `done`/`blocked` e resume o motivo,
      mas com `fake_claude` — um duplo que nunca chama Bash, nunca é
      interceptado pelos hooks e nunca leva 10 minutos. "As duas metades
      cobertas separadamente" é o caso textual de incompleto: nenhum teste do
      repo prova que uma regressão em `monta_comando` (o comando/args reais
      que o `cepa-until` manda para o `claude -p`) ou na leitura do resultado
      pelo supervisor quebraria a colheita de um build real de mais de 10 min
      rodando através da fila de verdade. Um follow-up razoável: adaptar
      `e2e_build_longo_claude_p.py` para montar uma fila/plano mínimo e
      chamar `common/bin/cepa-until` de verdade (com um item cujo
      `/common:drain-plan` real dispara o `make verify` sintético) em vez de
      um `claude -p` avulso — aí sim a superfície bateria com o texto do
      critério.
