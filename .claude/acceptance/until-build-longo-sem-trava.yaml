regressao:
  - test: tests/test_no_background_build.py
    run: "python3 tests/test_no_background_build.py -> ✓ tudo verde (exit 0)"
  - test: tests/test_cepa_until.py
    run: "python3 tests/test_cepa_until.py -> ✓ tudo verde (exit 0)"
julgamento_do_objetivo: >-
  A troca do passo 2 do esboço ("sem vigia: bloqueio como hoje" virou "sem fim
  declarado: bloqueio como hoje") atende à intenção do item — o dono não
  herdar um build longo como pendência silenciosa. O mecanismo (gravar `EXIT=`
  + esperar em primeiro plano com laço curto + Stop barrado sem `EXIT=`) está
  implementado, testado em unidade (AC3, verde) e demonstrado sob um agente
  real de ponta a ponta uma vez (experimento E, ~12,5 min, resultado colhido).
  Isso é evidência forte de que o mecanismo funciona. O que falta para
  `complete` é estritamente o que o próprio card listou como "Teste que
  falta" item 1 (AC2): nenhum teste automatizado no repo leva um ITEM da fila
  do `cepa-until` a `done` com resultado colhido depois de um build de mais
  de 10 min — só o hook foi testado em unidade, e só uma vez, manualmente,
  fora da suíte, um script solto que não passa pelo laço do `cepa-until`. O
  experimento E é evidência de que o hook funciona sob agente real; NÃO
  conto ele como o teste que a altitude do critério AC2 pede — ele não
  demonstra `cepa-until` levando um item a `done`, e não é repetível/commitado.
