      saída do build), rodando pelo `cepa-until` de verdade — não um script
      solto num diretório à parte com um `settings.json` fabricado à mão. O
      experimento E prova o hook sob agente real; não prova que `cepa-until`
      leva esse item a `done`. Sem esse teste, uma regressão futura no laço
      principal do `cepa-until` (não no hook) que quebre a colheita do
      resultado não seria pega por nenhum teste do repo.
