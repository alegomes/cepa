  rodei em escopo os quatro arquivos de teste que demonstram os critérios
  deste card (test_bash_path_lock_exec.py, test_lock_copies_drift.py,
  test_path_lock_out_of_root.py, test_bash_path_lock_redir.py), todos verdes.
  Arquivos não commitados no worktree no momento deste audit (BACKLOG.md,
