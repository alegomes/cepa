      não por lista de strings — cobre o vetor real do WEGO-1936 (python3 -c)
      e variantes não listadas antes (perl/ruby/node -e, sh -c, heredoc,
      script em /tmp, xargs com escritor, git apply/checkout--/restore,
      binário compilado na hora, verbo desconhecido).
    altitude: subprocess
    surface: >
      bash-path-lock.py invocado com agent_type trancado (ex.:
      build-hex:qa-engineer) e comando de interpretador inline visando um
      arquivo fora da pista do agente.
    test: tests/test_bash_path_lock_exec.py (função test_baldes, casos DENY
      "WEGO-1936" + 25+ variantes de classe rodando nas 5 cópias)
    layer: integração via subprocess real do hook (não import/mocking)
    evidence: verified
    run: |
      $ python3 tests/test_bash_path_lock_exec.py
      975 verificações, 0 FAIL, exit 0, linha final "tudo verde em 5 cópias"
    veredito: complete

