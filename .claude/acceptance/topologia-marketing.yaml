criteria:
  - id: AC1
    description: >-
      Novo plugin instalável marketing registrado como os irmãos (marketplace.json,
      bin/install.sh, bin/gen-locks.py, docs/topologies.md, README).
    altitude: install
    surface: .claude-plugin/marketplace.json, bin/install.sh, bin/gen-locks.py, docs/topologies.md, README.md
    test: tests/test_topologia_marketing.py (test_marketplace_entry, test_plugin_json) + inspeção do diff para bin/install.sh, bin/gen-locks.py, docs/topologies.md, README.md
    layer: install-surface (parse de manifest) + diff review (linhas adicionadas nos 4 outros pontos de registro)
    evidence: verified
    run: "python3 tests/test_topologia_marketing.py -> exit 0, 51 checks 'ok', 'all green'"
    result: complete

  - id: AC2
    description: >-
      5 papéis: content-lead (lead, delega via Task, não escreve prosa),
      content-strategist (BRIEF.md com tabela de números canônicos, cada linha
      com fonte), copywriter (worker, uma peça por chamada, nunca inventa
      número fora do brief), brand-style-critic (gate PASS/REVISE: proibições
      de estilo, termos reservados, anonimização, claims honestos),
      fact-checker (gate PASS/REVISE: todo número rastreia ao brief).
    altitude: domain (conteúdo declarativo de prompt de agente — não há runtime LLM para exercitar em teste automatizado)
    surface: marketing/agents/{content-lead,content-strategist,copywriter,brand-style-critic,fact-checker}.md
    test: tests/test_topologia_marketing.py (test_agentes_frontmatter, test_content_lead_nunca_produz)
    layer: structural (frontmatter tools/Task, frase "never delegates", frase "nothing except own expertise")
    evidence: verified
    run: "python3 tests/test_topologia_marketing.py -> exit 0, checks para os 5 agentes 'ok'"
    result: complete
    note: >-
      A checagem estrutural (tools/frontmatter/frases-chave) é a altitude honesta
      disponível para conteúdo declarativo de prompt; o comportamento em runtime
      (copywriter realmente nunca inventar número) não é verificável sem rodar o
      agente de fato, o que está fora do escopo de um teste determinístico. Li o
      corpo integral dos 5 arquivos de agente e confirmei que as regras descritas
      no card (uma peça por chamada, nunca inventa número, PASS/REVISE
      determinístico, leitura de brand-rules.yaml opcional) estão escritas.

  - id: AC3
    description: >-
      Um comando de flow /marketing:brief-write-review (brief → write em
      paralelo → review dos dois gates ⇄ write, teto de 2 rodadas de REVISE
      então BLOCKED).
    altitude: cli (slash command)
    surface: marketing/commands/brief-write-review.md, docs/commands.md
    test: tests/test_topologia_marketing.py (test_comando_brief_write_review, test_catalogo_cita_o_comando) + tests/test_catalogo_comandos.py
    layer: structural (frontmatter interaction/argument-hint, menção a content-lead e ao teto "2"+"REVISE") + varredura do catálogo de comandos
    evidence: verified
    run: >-
      python3 tests/test_topologia_marketing.py -> exit 0;
      python3 tests/test_catalogo_comandos.py -> exit 0, 'tudo ok (64 comandos no catálogo)'
    result: complete

  - id: AC4
    description: >-
      As 3 pendências de design respondidas em marketing/marketing-topology.md
      "Decisões": brand-rules.yaml opcional por projeto (crítico avisa quando
      ausente; exemplo incluído), board-flow no mesmo nível do design, BRIEF.md
      versionado como fonte única.
    altitude: domain (documento de decisão)
    surface: marketing/marketing-topology.md ("## Decisões"), marketing/brand-rules.example.yaml
    test: leitura direta do arquivo (não há teste automatizado para prosa de decisão)
    layer: manual review
    evidence: verified
    run: "cat marketing/marketing-topology.md (lido integralmente) + ls marketing/brand-rules.example.yaml -> existe"
    result: complete
    note: >-
      As 3 perguntas do BACKLOG.md são respondidas nominalmente na seção
      "Decisões": (1) brand-rules.yaml opcional, crítico diz "no brand-rules
