      (3) BRIEF.md versionado no repo do projeto como fonte única, fact-checker
      confere contra a versão corrente, não uma cópia congelada.

  - id: AC5
    description: >-
      Path-lock aplica a pista de escrita de cada papel (strategist só
      BRIEF.md, copywriter só pecas/**, gates só reviews/**, lead nada) e o
      Bash path-lock é o gerado (não copiado à mão).
    altitude: hook (PreToolUse, invocado via JSON no stdin — subprocess)
    surface: marketing/hooks/path-lock.py, marketing/hooks/bash-path-lock.py
    test: >-
      tests/test_topologia_marketing.py (test_pathlock_permite_peca_dentro_da_pista,
      test_pathlock_nega_fora_da_arvore, test_pathlock_content_strategist_e_o_unico_dono_do_brief,
      test_pathlock_gates_so_escrevem_reviews, test_pathlock_lead_nao_produz_nada,
      test_pathlock_expertise_propria_sempre_liberada) + tests/test_lock_copies_drift.py
      (bash-path-lock.py:* idêntico em 6 cópias, path-lock.py:* idêntico) +
      tests/test_bash_path_lock_exec.py (lane marketing exercitada via subprocess
      com comandos Bash reais)
    layer: subprocess (payload JSON no stdin do hook real, exatamente como o
      Claude Code invoca)
    evidence: verified
    run: >-
      python3 tests/test_topologia_marketing.py -> exit 0 (copywriter permitido em
      docs/marketing/x/pecas/a.md, negado em common/hooks/x.py e em BRIEF.md;
      content-strategist permitido em BRIEF.md; brand-style-critic e fact-checker
      permitidos só em reviews/**, negados em pecas/**; content-lead negado em
      BRIEF.md; expertise própria sempre liberada);
      python3 tests/test_lock_copies_drift.py -> exit 0, 'all green' (bash-path-lock.py
      e path-lock.py idênticos nas 6 cópias, incluindo marketing);
      python3 tests/test_bash_path_lock_exec.py -> exit 0, 'tudo verde em 6 cópias'
      (lane marketing libera awk/curl/docker/python3/git dentro da pista e nega
      balde 1 fora dela)
    result: complete

summary: >-
  5 critérios, 5 complete. Rodei os 4 arquivos de teste indicados
