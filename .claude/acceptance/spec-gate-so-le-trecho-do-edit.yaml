surface: >
  common/hooks/spec-readiness-gate.py invocado como subprocesso (PreToolUse
  hook), payload JSON no stdin, exit code 0 (libera) / 2 (bloqueia). Testado
  via subprocess.run([sys.executable, HOOK], input=json.dumps(payload)) em
  tests/test_spec_readiness_gate.py — é o mesmo modo como o hook roda de
  verdade no Claude Code.
