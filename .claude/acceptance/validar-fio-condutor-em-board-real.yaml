      transições de card que o comando pede, seguida de revisão do dono
      sobre a fila (plan.yaml) resultante — confirmando que a ordem
      sobrevive a essa revisão sem regressão manual.
    followup: >-
      Agendar uma sessão com o dono para rodar /board-flow:triage ao vivo no
      WEGO (fora de horário de lote desatendido, já que o comando transiciona
      cards e pede confirmação humana); comparar a fila antes/depois e pedir
      ao dono para revisar explicitamente se a ordem resultante bate com a
      prioridade que ele esperava.
