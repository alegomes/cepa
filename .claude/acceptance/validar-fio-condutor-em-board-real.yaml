      só mudaram a linha `source` (nota PARCIAL) e title/why de 5 dos 9
      itens `ready` citados.
    verdict: complete
    notes: >-
      Único porém herdado da rodada anterior: a evidência original usa o
      repasse arquivado de 2026-09-25, não uma classificação nova — adequado
      para este critério específico (testa se o comando de escrita preserva
      ordem, não se a triagem classifica bem cards novos). Nesta
      re-auditoria, o mesmo comportamento foi confirmado de forma
      independente contra uma execução real com --apply (ver AC3), o que é
      evidência mais forte, não mais fraca, do que o --dry-run original.

  - id: AC3
    text: >-
      Critério literal do título do item: "Rodar /board-flow:triage num
      board com fila real e ver a ordem sobreviver à revisão." Isto é, o
      comando de triagem em si (não apenas os comandos de baixo nível que
      ele alimenta) rodando contra cards vivos e classificando-os, com o
      dono revisando a fila resultante e a ordem sobrevivendo a essa revisão.
    altitude: cli (board-flow) + human-review
    surface: /board-flow:triage (roda ao vivo, comenta cards, pede
      confirmação do dono) sobre o board 971/WEGO real, seguido de
      `cepa-plan write --from-triage --apply` real (não --dry-run) contra a
      fila viva
    test: >-
      Execução ao vivo em 2026-09-28 (sessão acompanhada), no repo
      wego-acessos-backend — mesmo projeto Jira WEGO e mesmo board 971 que o
      item alvo, ainda que a rota textual do item citasse
      wego-assinatura-backend; os dois repos são mirrors locais de
      plan.yaml do mesmo board vivo, e o critério fala do board, não do
      caminho do repo. Evidência durável auditada de forma independente
      (não apenas relatada): (1) handoff
      .claude/programs/WEGO/triagem-2026-09-28.json em disco, gitignored,
      com 27 cards no escopo, 15 classificados (9 ready, 6
      needs-refinement — contagem confirmada por leitura direta do json,
      Counter({'ready': 9, 'needs-refinement': 6})) e remaining_in_column:
      12 (27 - 15 = 12, consistente); (2) diff de git
      `246c7c9a..19d76204` (.claude/programs/WEGO/plan.yaml) mostrando a
      escrita real (--apply, não simulada) com ordem, status e
      human_pending idênticos nos 249 itens antes/depois, WEGO-2283 na
      mesma posição (242, 0-index) nos dois lados; (3) comentário real no
      Jira confirmado ao vivo via `twg jira workitem comment query
      --issue-id WEGO-1922`, retornando o comentário id 38384, autor
      Alexandre Gomes, criado em 2026-09-28T10:27:16 — dentro da faixa de
      ids (38384-38389) relatada para os 6 Epics comentados; (4) commit
      eab1cee no repo cepa fechando a rota humana do próprio item, com
      mensagem descrevendo exatamente esta sessão e deixando `status:
      pending` explicitamente para este auditor decidir.
    layer: >-
      end-to-end real: comando board-flow ao vivo + revisão humana via
      AskUserQuestion (o dono confirmou o plano de escrita numa única
      rodada e pediu para manter WEGO-2283 fora do handoff, uma decisão de
      conteúdo, não um carimbo) + escrita real (--apply) na fila viva do
      Jira, com efeito colateral verificável no próprio Jira (comentários).
    evidence: verified
    run: >-
      $ cd /Users/alegomes/coding/wego/wego-acessos-backend && git diff
      --stat 246c7c9a..HEAD -- .claude/programs/WEGO/plan.yaml -> 1 file
      changed; comparação campo a campo (id, status, human_pending) dos 249
      itens: 0 diffs, ids em ordem idêntica, WEGO-2283 na posição 242 nos
      dois lados. $ python3 -c "json.load(...triagem-2026-09-28.json...)"
      -> remaining_in_column: 12, 15 cards (9 ready / 6 needs-refinement).
      $ twg jira workitem comment query --issue-id WEGO-1922 --first 10
      --order-by=-created -> comentário id 38384, criado
      2026-09-28T10:27:16-03:00 (dentro do dia e da faixa relatada).
    verdict: complete
    notes: >-
      Isto fecha a lacuna apontada na auditoria anterior (2026-09-28,
      primeira rodada): agora existe uma execução real de
      /board-flow:triage contra cards vivos, com o dono revisando e
      decidindo sobre a fila resultante (a decisão explícita de excluir
      WEGO-2283 do handoff é sinal de revisão de conteúdo, não de
      aprovação automática) — e a ordem sobreviveu a essa revisão com
      escrita real (--apply), não apenas em --dry-run. Caveat honesto que
      não vira gap: a rota textual do item citava
      "wego-assinatura-backend" e o dono rodou em "wego-acessos-backend";
      ambos são o mesmo projeto e board Jira (WEGO / 971), então a
      superfície nomeada pelo critério (o board real) foi de fato
      exercitada — só o repositório local usado como mirror do plano
      mudou. Não pude reexecutar a sessão interativa em si (é ao vivo e
      não repetível), mas confirmei de forma independente os três rastros
      duráveis que ela deixou: o diff de git da escrita real, o handoff em
      disco, e um comentário do Jira lido ao vivo pela API — o que satisfaz
      `evidence-over-assumption` para uma superfície que por natureza não
      se roda de novo em auditoria.
