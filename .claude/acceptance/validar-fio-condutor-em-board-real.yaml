      nesta re-auditoria: `git diff 246c7c9a..HEAD -- .claude/programs/WEGO/plan.yaml`
      no wego-acessos-backend (execução real com --apply, não --dry-run) —
      249 itens antes e depois, tupla (id, status, human_pending) idêntica
