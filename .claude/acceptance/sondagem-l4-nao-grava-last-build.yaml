    altitude: subprocess
    surface: o mesmo de AC1, mais effective_build_dir para as variantes de agrupamento de shell
    test: >
      test_perturbation_l4_probe_in_subshell_does_not_touch_main_state (0 testes, EMPTY na
      worktree, nada na sessão) e test_effective_build_dir_sees_build_inside_shell_grouping
