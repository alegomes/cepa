criteria:
  - id: AC1
    text: >
      "build de sondagem não grava o registro de último build, ou grava separado"
      (BACKLOG.md, palavras do dono, fb-20261106-3): um build Maven disparado na
      forma da L4 (cd <worktree /tmp> && (timeout ... ./mvnw ... | grep | head))
      não escreve no .claude/last-build.json da sessão; o registro vai para a
      worktree do build.
    altitude: subprocess
    surface: >
      payload JSON de PostToolUse (Bash) em stdin de common/hooks/capture-build-result.py;
      efeito observado no sistema de arquivos (last-build.json da sessão x da worktree).
    test: tests/test_capture_build_result_classify.py::test_perturbation_l4_probe_in_subshell_does_not_touch_main_state
    layer: subprocess (hook binary, git init real, TMPDIR isolado)
    evidence: verified
    run: >
      python3 -m pytest -q tests/test_capture_build_result_classify.py -> "31 passed in 1.18s".
      Além disso, rodei o hook como subprocesso com o comando LITERAL da L4
      (cd /tmp/proof-WEGO-2005x && (timeout 580 ./mvnw -q -o -pl application -am test
      -Dtest='Wego2005AdversarialL4Test#timing' -Dsurefire.failIfNoSpecifiedTests=false 2>&1
      | grep -E "L4-|Tests run|BUILD|ERROR|falha" | head -100)) com cwd num repo git:
      stderr "build ran outside the session tree ... main baseline untouched", ausente
      /tmp/projx/.claude, presente /tmp/proof-WEGO-2005x/.claude/last-build.json
      (status EMPTY, tests_run 0). Vizinhos: root_install, pytest, django, background
