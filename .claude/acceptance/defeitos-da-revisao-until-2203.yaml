    test: tests/test_eval_suite.py::test_corrida_que_falha_guarda_o_diff_e_nao_deixa_worktree
    layer: cli (chama run.cmd_run real, com git/PATH apontados para um repo/binário `claude` falsos)
    evidence: verified
    run: >
      python3 tests/test_eval_suite.py -> 'ok  nenhuma worktree da corrida fica
      registrada', 'ok  nem o diretório dela fica no disco', 'ok  a tarefa falhou,
      como devia', 'ok  o resultado aponta o .patch com o que o agente escreveu',
      'ok  o .patch mora ao lado do resultado, não em /tmp', 'ok  não sobra o campo
      que apontava a worktree'; suíte inteira: 'all green'
    result: complete
    gap: null

