      ledger.parent.parent/plan.yaml (a cópia da worktree de largada).
    altitude: cli
    surface: "saída de `cepa-until-digest <ledger>` rodado com um ledger dentro de uma worktree ligada"
    test: tests/test_cepa_until_digest.py::test_estado_da_fila_vem_do_clone_principal_nao_da_worktree
    layer: cli (invoca o binário real common/bin/cepa-until-digest via subprocess)
    evidence: verified
    run: "python3 tests/test_cepa_until_digest.py -> 'ok  lê o estado da fila do clone principal' / 'ok  não lê a cópia velha da worktree' / 'ok  diz de qual arquivo leu a fila'; suíte inteira: '✓ tudo verde' (13 checks, 0 FAIL)"
    result: complete
    gap: null

  - id: AC2
