      quedas_de_rede igual ao número de eventos queda_de_rede (não 0).
    altitude: cli
    surface: "ledger .jsonl escrito pelo CLI real do cepa-until com um `claude` falso"
    test: >
      tests/test_cepa_until_rede.py::test_rede_que_nao_volta_dentro_da_janela_para_o_run
      e test_tres_quedas_seguidas_param_o_run_sem_culpar_o_item (ambos cenários
      terminam com motivo `sem-rede`)
    layer: cli (usa `roda`/`fake_claude` de tests/test_cepa_until.py, que invocam o binário common/bin/cepa-until de verdade)
    evidence: verified
    run: >
      python3 tests/test_cepa_until_rede.py -> 'ok  run_end conta a queda da qual a
      rede não voltou' (fim["quedas_de_rede"] == 1), 'ok  run_end conta as 3 quedas,
      inclusive a que parou o run' (fim["quedas_de_rede"] == len(eventos) == 3);
      suíte inteira: 'todos passaram' (33 checks, 0 FAIL)
    result: complete
    gap: null

