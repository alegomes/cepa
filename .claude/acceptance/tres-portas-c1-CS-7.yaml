    test: "tests/test_veto_walk_opens_existing_doc.py (test_spec, test_epic). Lê somente o passo de abertura, que precisa vir antes do passo da entrevista; exige: caminhada do veto nomeada, chamadas a `cepa-plan decisions` e `cepa-plan verdict`, três vereditos, nunca gravar marcador à mão, pulada não trava e fica sem marcador, Status não muda, repasse do aviso 'já virou código na fila', numeração exata do `decisions` sem renumerar, parágrafo da caminhada antes de 'write the skeleton with' (spec) e de 'Otherwise (the file does not exist)' (epic), 'up to four per round' e --continuar/--fechar no spec.md, 'one per turn' no epic.md."
    layer: application
    evidence: verified
    run: "HEAD 42fbbb0. python3 tests/test_veto_walk_opens_existing_doc.py -> 31 linhas 'ok', 0 FAIL, 'all passed' (N>0); python3 -m pytest tests/test_veto_walk_opens_existing_doc.py -q -> 2 passed. Diff de produção lido: spec.md e epic.md contêm o parágrafo da caminhada, coerente com as decisões do item 4 (spec ~l.95-120) e com a estratégia (~l.113)."
    verdict: complete
