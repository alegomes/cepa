    text: "`/common:spec --continuar`/`--fechar` e `/common:epic` sobre um documento existente abrem com a caminhada do veto antes de retomar a entrevista ou o crivo: até quatro decisões por rodada na spec, uma por turno no Epic, cada resposta gravada por `cepa-plan verdict`, decisão pulada fica sem marcador (item 4). Red test: um teste que lê common/commands/spec.md e common/commands/epic.md e acha, no passo que abre o documento existente e antes do passo da entrevista, a chamada a `cepa-plan decisions` e `cepa-plan verdict`, o limite de quatro por rodada no spec.md, uma por turno no epic.md, e a frase de que decisão pulada não trava."
