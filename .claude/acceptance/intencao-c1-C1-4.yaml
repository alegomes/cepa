      evidence: verified
      run: "python3 tests/test_cepa_encadeamento.py -> 64 'ok', 0 FAIL, 'OK' (HEAD bf9ca35)"
    verdict: complete
    gap: null
  - id: AC2
    text: "`/common:session` grava a intenção a partir das perguntas de largada, sem segundo ritual (arquivo .claude/session-intent após a largada)"
    altitude: cli
    surface: "passo 3b de common/commands/session.md: o comando documentado, executado literalmente contra o cepa-intencao real"
    demonstrated_by:
      test: "tests/test_session_intencao_contrato.py (3b entre o 3 e o 4; não roda no --help; executa a linha documentada num repo temporário: 1a gravação rc 0 com propósito e plano de 3 passos; regravar sem --motivo rc 4; com o --motivo documentado rc 0 e a anterior vai ao histórico; os dois --passo rc 0 e cursor termina no 3; nenhum item do plano tem ':')"
      layer: texto do comando extraído do markdown e executado por shell contra o escritor real
      evidence: verified
      run: "python3 tests/test_session_intencao_contrato.py -> 21 'ok', 0 FAIL, 'OK'"
    verdict: complete
    gap: "Julgamento de altitude: adequado. /common:session é um prompt em markdown, sem superfície executável própria; o ponto mais externo automatizável é o comando que ele manda rodar, e o teste o extrai do próprio .md (não uma cópia) e roda. Resíduo não automatizável: um modelo seguir a instrução do 3b em sessão viva. Isso só se vê numa execução real de /common:session, e vale uma conferência manual de uma vez, mas não é lacuna de teste."
