    altitude: cli
    surface: mesmo subprocess do AC1, mesmas 6 cópias.
    test: tests/test_bash_path_lock_exec.py::test_dica_diretorio_nao_resolvido
    layer: hook-subprocess
    status: complete
    evidence: verified
    run: >
      Mesma execução do AC1 (exit=0, 1232 ok, 0 falhas). Casos "cd <literal>
