      chamada anterior não existe nesta e sugere caminho literal ou
      git -C <literal> — nas 6 cópias do hook (build-hex, build-team, design,
      discovery, docs-topology, marketing), rodando o hook como subprocesso
      com payload JSON no stdin.
    altitude: cli
    surface: >
      */hooks/bash-path-lock.py invocado como subprocess (stdin JSON,
      stdout/stderr, exit code) — a mesma forma como o Claude Code invoca o
      hook em produção.
    test: tests/test_bash_path_lock_exec.py::test_dica_diretorio_nao_resolvido
    layer: hook-subprocess
    status: complete
    evidence: verified
    run: >
      python3 tests/test_bash_path_lock_exec.py -> exit=0; 1232 asserções
      "ok" (0 falhas); cobre as 6 topologias (build-hex, build-team, design,
      discovery, docs-topology, marketing) para "cd \"$VAR\" && git checkout"
      e "git -C \"$VAR\" checkout": nega (rc==2), nomeia a variável
      ("$CEPA_WT_NAO_EXISTE não tem valor"), explica a causa ("Cada chamada
      do Bash é lida sozinha") e sugere caminho literal/git -C.
    gap: null
