notes: "Não rodei tests/run-all.sh (do supervisor). Observação sem efeito no veredito: o corpus tem 45 chamadas, todas escritas à mão, e os três hooks cobertos batem com o ledger recontado. A seção do BACKLOG pedia escrever a fonte como transcrições, mas a decisão do dono de 2026-11-12 a substitui por entradas à mão."
