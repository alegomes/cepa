      layer: teste de integração
      evidence: verified
      run: |
        Mesma rodada: "ok  all 45 corpus calls match their label", "ok  covers the three hooks", e por arquivo "no personal paths", "no recorded-session fields", "no client names", "every call has a valid expect"; por hook "has deny and allow / redundant call / must_deny call".
    verdict: complete
    gap: null

  - id: AC4
    text: "R1: nenhum hook adicionado ou alterado (docs/estrategia-lacunas-ecc.md §9)."
    altitude: cli (diff)
    surface: "git diff --name-only 0ba9ae1 HEAD"
    demonstrated_by:
      test: "inspeção do diff (não há teste para ausência)"
      layer: diff
      evidence: verified
      run: |
        git diff --name-only 0ba9ae1 HEAD -> só tests/replay/** (README, run.py, 9 JSON) e tests/test_hook_replay.py; contagem de caminhos com "hooks" = 0.
