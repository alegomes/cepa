    layer: subprocess (real shim binary, PATH scrubbed to /usr/bin:/bin)
    evidence: verified
    run: |
      $ python3 -m pytest tests/test_board_flow_cepa_plan_shim.py::test_nenhum_candidato_sai_127_e_nomeia_os_caminhos_tentados -v
      PASSED (exit=0) -- asserts returncode == 127, "não encontrado" in stderr,
      the tried repo path is named, and "instale o plugin" appears
    verdict: complete

