    altitude: "fonte (a própria criação da guarda é sobre a FORMA do código, não sobre comportamento em runtime — é o que o critério pede)"
    surface: "grep estrutural sobre common/hooks/*.py: presença de `session_root(` e ausência do padrão `Path(payload.get(\"cwd\"...` "
    test: tests/test_session_anchor_root.py (bloco "guarda de deriva")
    layer: source-static-check (intencional — o próprio critério pede uma guarda estrutural, não um teste de comportamento)
    evidence: verified
    run: "mesma execução -> 14 checagens 'ok ... usa session_root' / 'ok ... nenhum Path(payload[\"cwd\"]) cru' + 'ok _wtlib expõe session_root'"
    verdict: complete

