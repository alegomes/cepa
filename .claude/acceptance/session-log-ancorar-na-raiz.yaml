      cwd num subdiretório; nenhum .claude órfão fora da raiz; dois turnos
      (raiz + subdiretório) caem no mesmo arquivo.
    altitude: cli
    surface: "python3 common/hooks/session-log.py < payload JSON (cwd em subdiretório)"
    test: tests/test_session_anchor_root.py (bloco "session-log.py — o defeito original", linhas 91-111)
    layer: cli-subprocess (run_hook() invoca o script real via subprocess.run com stdin)
    evidence: verified
    run: "python3 tests/test_session_anchor_root.py -> exit 0, incluindo 'ok log gravado na RAIZ', 'ok nenhum .claude órfão no subdiretório', 'ok os dois turnos moram no mesmo log'"
    verdict: complete

