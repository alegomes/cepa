notes: >
  Item vem da fila single-track (.claude/programs/cepa/plan.yaml), sem card
  Jira. Enunciado original fala só de session-log.py, mas o `why` já registra
  que é uma CLASSE de sete hooks que montam `.claude/<estado>` a partir do
  `cwd` cru do payload em vez da raiz da worktree (`_wtlib.session_root`).
  10 critérios extraídos do enunciado da tarefa. Superfície declarada para
  TODOS: cli/processo (o hook roda como script Python recebendo JSON no
  stdin). Reauditoria após ebe5dca, que fechou os 2 gaps da 1a rodada
  (AC8: session-checkpoint deixou de ser exercitado por importlib; AC9: os
  7 hooks passaram a ser chamados fora de repo, cada um no seu diretório;
  de quebra, AC7 perdeu o `or` frouxo). tests/test_session_anchor_root.py
  roda sem dependência externa e a suíte completa (tests/run-all.sh) também
  foi rodada nesta auditoria: 52/52 arquivos verdes.

criteria:
  - id: AC1
