  - id: AC8
    text: >
      session-checkpoint.py acha a intenção que o session-log gravou a
      partir de um subdiretório (escritor e leitor com a mesma âncora).
    altitude: cli
    surface: "python3 common/hooks/session-checkpoint.py < payload JSON (Stop hook, session_id + cwd), lendo o session-log.md gravado por session-log.py e produzindo o handoff em <raiz>/.claude/handoffs/<branch-slug>.md"
    test: tests/test_session_anchor_root.py (bloco session-checkpoint, "checkpoint sai 0" / "handoff gravado" / "a intenção do subdiretório chegou ao handoff")
    layer: >
      cli-subprocess de verdade agora — session-checkpoint.py roda como
      PROCESSO via run_hook() com payload completo no stdin
      (session_id + cwd em subdiretório), passando por main(), por
      L.main_root e por H.write; o teste então lê o arquivo de handoff
      gravado no disco e confere que o prompt do session-log aparece nele.
      Deixou de importar recent_intents() via importlib.
    evidence: verified
    run: "mesma execução -> 'ok checkpoint sai 0', 'ok handoff gravado', 'ok a intenção do subdiretório chegou ao handoff'"
    perturbation: >
      Reverti session-checkpoint.py (em cópia isolada fora do repo, não no
      código de produção) para usar `Path(cwd)` cru em vez de
      `Path(L.session_root(cwd))` na linha que lê o session-log.md. Rodei o
      mesmo tests/test_session_anchor_root.py contra a cópia perturbada:
      ficou vermelho tanto o caso comportamental ("a intenção do
      subdiretório chegou ao handoff") quanto o estrutural ("session-checkpoint.py:
      usa session_root"). Confirma que o caso de AC8 realmente prova o
      comportamento, não só a forma do código.
    verdict: complete

  - id: AC9
    text: >
      Fora de um repo git o hook sai 0 e cai no próprio cwd — hook nenhum
      morre por causa disto.
    altitude: cli
    surface: "cada um dos 7 hooks ancorados, rodado via subprocess com cwd fora de qualquer repo git, num diretório próprio por hook"
    test: tests/test_session_anchor_root.py (bloco "fora de um repo git" — session-log.py com as duas checagens originais + laço `fora` sobre os outros 6, cada um em `tmp/sem-git-<i>`)
    layer: cli-subprocess para os 7 hooks nomeados no `why`
    evidence: verified
    run: "mesma execução -> 'ok session-log.py sai 0 fora de repo', 'ok session-log.py cai no próprio cwd', e 'ok <hook>.py sai 0 fora de repo' para capture-build-result, mark-build-stale, gate-advance, acceptance-gate, loop-budget e session-checkpoint"
    perturbation: >
      Removi (em cópia isolada fora do repo) o fallback de `_wtlib.session_root`
      para fora de um repo git — fazendo-o devolver só `repo_root(cwd)` (string
      vazia fora de git) em vez de `root or os.path.abspath(cwd)`. Rodando a
      suíte contra a cópia perturbada: só "session-log.py cai no próprio cwd"
      fica vermelho; os outros 6 continuam saindo 0. Isso é esperado e não é
      fraqueza do teste: os 6 hooks têm um `except Exception` amplo que sempre
      sai 0 por design ("nunca bloqueia por erro próprio" — comentário em
      loop-budget.py), e o texto do critério só amarra "cai no próprio cwd" ao
      comportamento que o defeito original (session-log.md partindo em dois)
      de fato exercitava; para os outros 6, o critério pede só "não morre", e
      isso continua coberto pelos 7 casos "sai 0 fora de repo". Concordo com a
      leitura do card: não é um buraco, é o critério fazendo exatamente o que
      diz.
    verdict: complete

  - id: AC10
    text: >
      Guarda de deriva: fica vermelha se um hook voltar a montar `.claude/`
