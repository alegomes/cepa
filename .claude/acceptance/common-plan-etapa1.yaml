summary: >
  Reauditoria de AC2 e AC3 contra o commit 0bb75db ('feat(cepa-plan): a
  leitura da spec vira código, não promessa de prompt'). A lacuna nomeada na
  primeira passada era exatamente esta: `--from-spec` não tinha NENHUM código
  que lesse docs/spec/*.md, só a instrução em common/commands/plan.md, e o
  único teste possível era grepar essa prosa — provando que o comando
  PROMETE herdar a ordem, nunca que uma execução produz a fila prometida.

  Agora existe `cepa-plan from-spec <spec.md>`, um subcomando real: lê a
  especificação, extrai um item por `### CS-N` na ordem do texto, monta o
  `why` com a Superfície e o Teste vermelho declarados na spec (capturando o
  campo multi-linha inteiro) mais a frase de herança
  ("herdado da ordem do texto da especificação; ninguém priorizou os
  critérios entre si"), e avisa sobre spec em rascunho, pergunta em aberto
  ou critério sem Teste vermelho. `write --from-spec` encadeia leitura e
  gravação. tests/test_common_plan.py::test_from_spec_le_os_criterios e
  test_from_spec_avisa_rascunho_e_recusa_vazia rodam o binário como
  subprocesso real contra uma spec-fixture de verdade e conferem: 1 item por
  critério, a ordem do texto, o `why` com a frase de herança, o Teste
  vermelho INTEIRO (não cortado na primeira linha), e a fila relida do disco
  depois de write --from-spec. Rodei pessoalmente:
  `python3 tests/test_common_plan.py` -> 'all green' (14 casos, incluindo os
  2 novos), exit 0; e `bash tests/run-all.sh` -> 49/49 arquivos, 'tudo
  verde'. A altitude está correta: a superfície que o critério nomeia
  (--from-spec produz itens) agora é exercitada via subprocess CLI real, não
  via grep de markdown.

  Com AC1, AC4 e AC5 reconfirmados (não reabertos, mas cobertos pela mesma
  execução verde da suíte) e AC2/AC3 fechados por esta reauditoria, os 5
  critérios de aceite estão `complete` com `evidence: verified`. Status do
  card: complete.

