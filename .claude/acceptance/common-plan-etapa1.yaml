    gap: "nenhum teste roda --from-spec (nenhum código lê docs/spec/*.md);
      falta ao menos uma fixture de spec + assert de que a fila gravada
      tem 1 item por ### CS-N na ordem do texto"
    follow_up: "card para extrair a conversão spec->itens do prompt para uma
      função testável (ou para uma fixture de teste que simule o passo
      manual do agente), cobrindo a etapa 1 antes de avançar para a etapa 2"
  - id: AC3
    gap: "a frase de herança do why só é checada como texto de instrução em
      plan.md, nunca como conteúdo de um item de fila realmente gravado"
    follow_up: "mesmo card do AC2 — o teste que fecha AC2 deve também
      afirmar o texto exato do why quando a spec não declara motivo de
      posição"
