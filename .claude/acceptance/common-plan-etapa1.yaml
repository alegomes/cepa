criteria:
  - id: AC1
    text: >
      Existe `/common:plan <nome>` e ele é o escritor da fila `single-track`
      em `<raiz-principal>/.claude/programs/<nome>/plan.yaml`, sem exigir Jira.
    altitude: cli
    surface: "cepa-plan write <nome> --items ... --repo . grava
      .claude/programs/<nome>/plan.yaml a partir da raiz principal (resolvida
      via git rev-parse --git-common-dir), sem qualquer dependência de Jira."
    test: "tests/test_common_plan.py::test_grava_fila_valida,
      test_raiz_e_a_do_clone_principal, test_reescrita_preserva_execucao,
      test_item_sumido_nao_some_calado, test_dry_run_nao_grava,
      test_colisao_com_ondas"
    layer: cli (subprocess real do cepa-plan, arquivo lido de volta do disco)
    evidence: verified
    run: "python3 tests/test_common_plan.py -> 'all green' (14 casos); exit 0"
    verdict: complete

  - id: AC2
    text: >
      Duas fontes funcionam: `--from-spec docs/spec/<slug>.md` (um item por
      critério de sucesso) e a fila ditada à mão. `--from-jira` NÃO faz parte
      desta etapa e o comando deve dizer isso em vez de improvisar.
    altitude: cli
    surface: "cepa-plan from-spec <spec.md> — LÊ a especificação e devolve os
      itens em JSON (um por `### CS-N`, na ordem do texto); cepa-plan write
      --from-spec <arquivo> faz leitura + gravação de uma vez. A fila ditada
      à mão continua em cepa-plan write --items."
    test: "tests/test_common_plan.py::test_from_spec_le_os_criterios (lê uma
      spec-fixture real via subprocess, confere 1 item por CS-N na ordem,
      grava com write --from-spec e relê a fila do disco) e
      test_from_spec_avisa_rascunho_e_recusa_vazia (spec em rascunho avisa
      mas aceita; spec sem CS-N recusa exit 2). A fila à mão segue coberta
      por test_grava_fila_valida e afins."
    layer: cli (subprocess real do binário, tanto `from-spec` isolado quanto
      `write --from-spec`; a fila gravada é relida do disco, não inferida)
    evidence: verified
    run: "python3 tests/test_common_plan.py -> ok 'lê a spec e devolve itens';
      ok 'um item por critério de sucesso'; ok 'a ORDEM é a do texto'; ok
      'write --from-spec grava a fila'; ok 'a fila gravada tem um item por
      critério, na ordem do texto'; ok 'aceita a spec em rascunho mas AVISA';
      ok 'recusa uma spec sem nenhum critério de sucesso'; 'all green' (14
      casos); exit 0. Também: python3 -c \"import re; print('from-spec' in
      open('common/bin/cepa-plan').read())\" -> True (subcomando existe no
      argparse, não só em prosa)."
    verdict: complete
    note: >
      A lacuna da primeira auditoria era estrutural, não de cobertura: não
      existia código nenhum que lesse docs/spec/*.md, só a promessa em
      common/commands/plan.md. Agora `common/bin/cepa-plan from-spec` é a
      superfície `cli` que faz essa leitura, e o teste bate essa superfície
      via subprocess real (não grep de prosa). `--from-jira` continua fora
      do escopo, e a checagem de que o comando DIZ isso em vez de improvisar
      segue coberta por test_contrato_do_comando (grep de prosa é altitude
      correta aqui, porque o critério é sobre o TEXTO que o comando expõe ao
      operador, não sobre um comportamento executável — não há "--from-jira"
      para rodar e recusar, ele simplesmente não existe).

  - id: AC3
    text: >
      Quando a fonte é uma spec, a ordem é HERDADA do texto e o comando DIZ
      que herdou (decisão registrada no `why` do item: "ninguém priorizou os
      critérios entre si").
    altitude: cli
    surface: "o campo `why` de cada item devolvido por `cepa-plan from-spec`
      e gravado por `write --from-spec` — precisa conter a frase de herança
      literal, mais a Superfície e o Teste vermelho (campo inteiro, não só a
      primeira linha) que a spec já declarou."
    test: "tests/test_common_plan.py::test_from_spec_le_os_criterios"
    layer: cli (subprocess real; assert sobre o why de itens JSON devolvidos
      e sobre a fila relida do disco depois de write --from-spec)
    evidence: verified
    run: "python3 tests/test_common_plan.py -> ok 'o \`why\` DIZ que a ordem
      foi herdada' (confere 'ninguém priorizou os critérios entre si' em
      todos os itens); ok 'o \`why\` carrega a superfície declarada na spec'
      (confere 'http' e 'domain', os textos de Superfície da spec-fixture);
      ok 'o \`why\` carrega o teste vermelho INTEIRO, não a primeira linha'
      (confere a frase 'passará quando devolver 200 com o CSV no corpo',
      que só existe se o campo multi-linha foi capturado por inteiro); 'all
      green'; exit 0."
    verdict: complete
    note: >
      Fecha a segunda metade da mesma lacuna do AC2: antes só existia a
      instrução escrita mandando o agente registrar a herança; agora o
      texto do `why` é produzido por `itens_de_spec()` (função determinística
      em cepa-plan) e o teste confere o conteúdo literal do campo, não a
      prosa que descreve a intenção. Um detalhe que fortalece a evidência:
      o teste também prova que o campo multi-linha "Teste vermelho" é
      capturado inteiro (RE_CAMPO em cepa-plan usa um lookahead até a
      próxima linha em branco/heading/campo, não só a primeira linha) — a
      falha mais provável de uma implementação ingênua de regex.

