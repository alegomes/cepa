card: common-plan-etapa1
title: "/common:plan escreve a fila single-track sem exigir tracker (etapa 1 de 'Cinco portas de planejamento')"
status: incomplete
diff: ac5f72c..HEAD (c2c2e80, 7e70f1d)
source: ".claude/programs/cepa/plan.yaml (common-plan-etapa1) + BACKLOG.md 'Cinco portas de planejamento'"

criteria:
  - id: AC1
    text: >
      Existe `/common:plan <nome>` e ele é o escritor da fila `single-track`
      em `<raiz-principal>/.claude/programs/<nome>/plan.yaml`, sem exigir Jira.
    altitude: cli
    surface: "cepa-plan write <nome> --items ... --repo . grava
      .claude/programs/<nome>/plan.yaml a partir da raiz principal (resolvida
      via git rev-parse --git-common-dir), sem qualquer dependência de Jira."
    test: "tests/test_common_plan.py::test_grava_fila_valida,
      test_raiz_e_a_do_clone_principal, test_reescrita_preserva_execucao,
      test_item_sumido_nao_some_calado, test_dry_run_nao_grava,
      test_colisao_com_ondas"
    layer: cli (subprocess real do cepa-plan, arquivo lido de volta do disco)
    evidence: verified
    run: "python3 tests/test_common_plan.py -> 'all green' (12 casos); exit 0"
    verdict: complete

  - id: AC2
    text: >
      Duas fontes funcionam: `--from-spec docs/spec/<slug>.md` (um item por
      critério de sucesso) e a fila ditada à mão. `--from-jira` NÃO faz parte
      desta etapa e o comando deve dizer isso em vez de improvisar.
    altitude: cli
    surface: "para a fila ditada à mão: cepa-plan write recebendo um arquivo
      de itens já montado — coberto. Para `--from-spec`: um comando de barra
      que, dado docs/spec/<slug>.md, PARSEIA os critérios `### CS-N` do
      arquivo e produz a lista de itens que o cepa-plan grava. Essa segunda
      metade da superfície não existe em código: `common/bin/cepa-plan` não
      tem flag `--from-spec` nem lê docs/spec/*.md (grep vazio), e
      `common/commands/plan.md` só descreve em prosa o que o agente
      conversacional deve fazer ao ler a spec (seção 'Com --from-spec')."
    test: "a fila ditada à mão: tests/test_common_plan.py::test_grava_fila_valida
      e outros (verified, acima). `--from-spec`: nenhum teste roda um arquivo
      .md de verdade contra um parser; test_contrato_do_comando só grepa a
      prosa de common/commands/plan.md checando frases como '--from-jira'
      ainda não existe' e 'CS-N' — é checagem de que o TEXTO do comando
      existe, não de que a conversão spec→itens acontece."
    layer: "fila à mão: cli (subprocess real). --from-spec: nenhuma — é
      grep de prosa em markdown, camada abaixo de qualquer execução."
    evidence: assumed
    run: "grep -n 'from.spec\\|from_spec\\|docs/spec' common/bin/cepa-plan
      tests/test_common_plan.py -> nenhuma ocorrência de código; a única
      menção a 'spec' em testes é no bloco de asserts de prosa de
      test_contrato_do_comando (linha ~281 em diante)."
    verdict: incomplete
    gap: >
      `/common:plan` é `interaction: conversational` por desenho explícito
      (ver plan.md: "por isso este comando é conversational... perguntar a
      ordem é o trabalho, não o último recurso") — a leitura da spec e a
      extração dos CS-N é deliberadamente trabalho do agente durante a
      conversa, não de um parser determinístico. Isso é uma escolha de
      design defensável (a spec já é prosa; forçar um parser rígido de
      markdown seria frágil). MAS a consequência é que a superfície legítima
      do critério "--from-spec produz um item por critério de sucesso,
      herdando a ordem" não é `cli` de forma automatizável hoje: é
      `conversational`/prompt, e um teste NESSA altitude (rodar o comando de
      verdade contra uma spec fixture e conferir a fila gravada) não existe
      e não pode existir sem instanciar o agente. O que falta, no mínimo,
      para fechar a lacuna real (e não apenas de altitude): um teste de
      INTEGRAÇÃO fim-a-fim onde uma spec fixture com 2-3 `### CS-N` é
      processada (manualmente pelo operador do teste, simulando o agente, OU
      por uma função determinística extraída do prompt) e o resultado é
      passado ao `cepa-plan write`, conferindo que a fila gravada tem um item
      por CS, na ordem do texto, e `why` contendo a frase "herdado da ordem
      do texto da especificação; ninguém priorizou os critérios entre si"
      quando a spec não declarar motivo de posição. Hoje esse comportamento
      só existe como instrução para o agente seguir, nunca verificado.

  - id: AC3
    text: >
      Quando a fonte é uma spec, a ordem é HERDADA do texto e o comando DIZ
      que herdou (decisão registrada no `why` do item: "ninguém priorizou os
      critérios entre si").
    altitude: cli/conversational (mesma superfície do AC2 — ver nota lá)
    surface: "a frase exata que plan.md manda o agente escrever no `why`
      quando a spec não declara motivo de posição."
    test: "tests/test_common_plan.py::test_contrato_do_comando, o check
      'manda dizer quando a ordem foi HERDADA do texto da spec' —
      confirma que as strings 'herdou' e 'herdad' aparecem em
      common/commands/plan.md."
    layer: "grep de prosa em markdown — não executa o comando, não gera
      uma fila a partir de spec nenhuma, não confere o `why` de um item
      real gravado."
    evidence: verified
    run: "python3 tests/test_common_plan.py -> ok 'manda dizer quando a
      ordem foi HERDADA do texto da spec'; exit 0 (mas o teste verifica a
      instrução escrita, não o comportamento)."
    verdict: incomplete
    gap: >
      Mesma lacuna do AC2: o teste prova que o *comando instrui* o agente a
      registrar a herança no `why`, não que uma execução real produz um item
      com esse `why`. Não existe hoje nenhum arquivo de fila gravado (nem
      fixture, nem golden file) por um fluxo `--from-spec` de ponta a ponta.
      Falta um teste (fixture de spec com CS sem motivo de posição declarado
      -> fila gravada -> assert de que every item tem no `why` a frase
      "herdado da ordem do texto da especificação; ninguém priorizou os
      critérios entre si", na ordem em que os CS aparecem no arquivo).

  - id: AC4
    text: >
      A fila gravada é válida segundo `common/plan-schema.yaml` (schema_version
      2, mode single-track, items com id/title/why/status/blocked_by/human_pending).
    altitude: cli
    surface: "cepa-plan validate <plan.yaml> e as recusas de cepa-plan write
      (why vazio, id repetido, blocked_by fantasma/ciclo, human_pending sem
      chave, schema_version, mode)."
    test: "tests/test_common_plan.py::test_grava_fila_valida,
      test_recusa_sem_why, test_recusa_human_pending_ausente,
      test_recusa_ciclo_e_fantasma, test_recusa_id_repetido,
      test_validate_recusa_plano_de_ondas, test_colisao_com_ondas"
    layer: cli (subprocess real, exit code + arquivo lido do disco)
    evidence: verified
    run: "python3 tests/test_common_plan.py -> 'all green' (12 casos); exit 0"
    verdict: complete

  - id: AC5
    text: >
      O `/board-flow:triage` NÃO foi alterado nesta etapa (mexer nele é a
      etapa 2).
    altitude: cli/repo
    surface: "diff ac5f72c..HEAD não toca nenhum arquivo sob board-flow/."
    test: "git diff --stat (auditoria direta, não um teste automatizado —
      é uma checagem factual sobre o diff, não um comportamento a exercitar)"
    layer: "verificação de diff"
    evidence: verified
    run: "git diff ac5f72c..HEAD -- '*board-flow*' '*triage*' -> saída vazia
      (nenhuma linha alterada); git diff --stat confirma os 9 arquivos
      tocados são todos fora de board-flow/."
    verdict: complete

summary: >
  AC1 e AC4 são a superfície central da etapa (o escritor mecânico
  `cepa-plan` e a fila à mão) e estão de fato demonstrados por
  tests/test_common_plan.py rodando o binário como subprocesso real,
  lendo o arquivo gravado de volta do disco — 12 casos, todos verdes, e
  tests/run-all.sh confirma 49/49 verde no repo inteiro. AC5 é factual e
  confirmado pelo diff.

  AC2 e AC3, sobre `--from-spec`, são a lacuna real desta auditoria: não é
  que falte "um teste melhor" no formato certo, é que a conversão
  spec→itens (ler docs/spec/<slug>.md, extrair um `### CS-N` por item, herdar
  ordem, escrever o `why` de herança) não existe em nenhum lugar executável
  hoje — nem no cepa-plan, nem em teste, nem em qualquer script auxiliar.
  Existe só como instrução de prompt em common/commands/plan.md, e o único
  teste que toca essa parte (test_contrato_do_comando) confirma que o TEXTO
  da instrução está lá, não que a instrução produz o resultado quando
  seguida. Isso é uma decisão de design plausível (o comando é
  `interaction: conversational` de propósito, e a leitura de uma spec em
  prosa por um agente é razoável não ser um parser rígido) — mas o efeito
  é que hoje não há NENHUMA evidência rodada de que `--from-spec` funciona,
  apenas a promessa em prosa. O card '--from-spec funciona' listado como
  critério de aceite pede pelo menos um teste fim-a-fim com uma spec
  fixture, mesmo que a etapa de "ler e interpretar" seja feita por fora do
  cepa-plan (por uma função auxiliar determinística, por exemplo, extraída
  do prompt) — sem isso, o critério 2 e o critério 3 continuam incompletos
  por ausência total de evidência rodada, não por altitude errada de teste.

gaps:
