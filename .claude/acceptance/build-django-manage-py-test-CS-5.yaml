    text: "depois de um `manage.py test` verde, a trava libera o `git commit`. Teste vermelho declarado: num repositorio git temporario com `pyproject.toml`, um `.py` alterado e `.claude/last-build.json` em STALE, rodar `capture-build-result.py` com o payload verde do CS-1 e depois `gate-advance.py` com o payload de PreToolUse de `git commit -m x` termina sem bloqueio (exit 0). Hoje o `gate-advance.py` bloqueia com \"build is STALE\"."
