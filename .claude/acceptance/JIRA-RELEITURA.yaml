criteria:
  - id: AC1
    text: "board-flow/agents/atlassian-expert.md não manda mais ler o card antes de transicionar/comentar só para olhar, mas MANTÉM: read-back depois de cada escrita, leitura de claim, scope guard, detail audit, leitura dos irmãos na cascata, e getTransitionsForJiraIssue antes da transição."
    altitude: document
    surface: "board-flow/agents/atlassian-expert.md"
    demonstrated_by:
      test: "tests/test_jira_releitura.py (3 checagens: regra nova presente, read-back mantido, regra antiga 'Read, then act' removida) + leitura manual das seções Claim/Scope/Detail-audit/Cascata"
      layer: doc assertion (substring) + leitura manual seção a seção
      evidence: verified
      run: |
        python3 tests/test_jira_releitura.py ->
          "ok  agente não lê o card só para olhar antes de escrever"
          "ok  agente mantém o read-back depois de cada escrita"
          "ok  a regra antiga de ler antes de agir saiu"
          all green, exit 0
        Leitura manual confirma que ficaram intactas: "Verify every write with a
        read-back before reporting success" (linha 58), a rotina de Claim ("Ler:
        getJiraIssue; devolva status + responsável..."), o Scope guard ("Check a
        single card's scope membership"), o Detail audit ("getJiraIssue; return
        summary + description..."), a leitura dos irmãos na cascata ("read the
        card's issuelinks, pick the sibling-type links, read each sibling's
        status") e "Use getTransitionsForJiraIssue to find the real transition
        id" antes de "Transitions via transitionJiraIssue".
    verdict: complete
    gap: null

  - id: AC2
    text: "/board-flow:prove-drain faz a leitura de claim trazer também summary, description, acceptance criteria, issue type e o Implementation Summary mais recente, e o passo 4b entrega esse conteúdo à prova; prove.md passo 1 reaproveita esse conteúdo sem buscar de novo, sem perder campo que os passos seguintes usam (status, issue type, SHA/arquivos do Implementation Summary). Rodando sozinho, /board-flow:prove continua buscando."
    altitude: document
    surface: "board-flow/commands/prove-drain.md (Reserva do card, passo 4b) + board-flow/commands/prove.md (passo 1, passo 2, passo 3)"
    demonstrated_by:
      test: "tests/test_jira_releitura.py (2 checagens) + leitura manual dos passos 2/3 do prove.md"
      layer: doc assertion + leitura manual cruzando os campos pedidos pela leitura de claim com os campos usados no restante do prove.md
      evidence: verified
      run: |
        python3 tests/test_jira_releitura.py ->
          "ok  claim do prove-drain lê também o que a prova precisa"
          "ok  prove-drain entrega o conteúdo à prova sem buscar de novo"
          all green, exit 0
        Leitura manual: a leitura de claim (prove-drain.md, "Antes de tocar em
        cada card") pede "status atual, responsável, ... summary, description,
        acceptance criteria, issue type e o texto completo do Implementation
        Summary mais recente" — cobre exatamente os 4 usos localizados no resto
        do prove.md: status (passo 2, precondição in_review), issue type (passo
        3, delegação ao proof-reviewer), SHA e arquivos tocados (passo 3, "head
        commit + touched files", extraídos do texto completo do Implementation
        Summary). prove.md passo 1 tem o bloco "Already have the card? ... Reuse
        it and skip this delegation" citando "prove-drain" e listando os mesmos
        campos. Quando prove roda sozinho (fora do prove-drain), o passo 1 segue
        com a delegação normal ao atlassian-expert (texto do passo 1 não foi
        removido, só ganhou a checagem condicional no topo).
    verdict: complete
    gap: null

  - id: AC3
    text: "board-flow/commands/fix.md passo 1 reaproveita o card quando despachado por /board-flow:execute (que entrega o conteúdo), sem perder campo que o fix usa; rodando sozinho, continua buscando."
    altitude: document
    surface: "board-flow/commands/fix.md (passo 1) + board-flow/commands/execute.md (passo 1a)"
    demonstrated_by:
      test: "tests/test_jira_releitura.py (2 checagens) + leitura manual comparando os campos pedidos por execute.md passo 1 com os usados por fix.md (reproducer audit)"
      layer: doc assertion + leitura manual
      evidence: verified
      run: |
        python3 tests/test_jira_releitura.py ->
          "ok  fix reaproveita o card lido pelo execute"
          "ok  execute entrega o card ao fix"
          all green, exit 0
        Leitura manual: execute.md passo 1 pede "summary, description, acceptance
        criteria, issue type, status, last 3 comments" — os mesmos 6 campos que
        fix.md passo 1 pediria via delegação própria ("full details (summary,
        description, acceptance criteria, issue type, status, last 3 comments)").
        execute.md passo 1a diz explicitamente "Hand `fix` the card content from
        step 1 so it does not fetch the card again". fix.md passo 2 (reproducer
        audit) só usa descrição/comportamento observado-esperado/repro, subconjunto
        do que já veio. Rodando fix.md sozinho, o bloco "Already have the card?"
        é condicional ("When /board-flow:execute dispatched here") e a delegação
        normal abaixo dele continua de pé.
    verdict: complete
    gap: null

