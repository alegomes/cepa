    verdict: complete
    gap: null

  - id: AC5
    text: "A spec manda usar defaults.site literal como cloudId nos prefixos camelCase e diz que erro de cloudId não se resolve trocando de servidor; a regra de tentar mcp-atlassian em 'No such tool available' continua."
    altitude: document
    surface: "board-flow/agents/atlassian-expert.md (seção Tool binding)"
    demonstrated_by:
      test: "tests/test_atlassian_expert_spec.py (2 checagens novas: 'cloudId é o defaults.site literal', 'erro de cloudId não troca de servidor') + 'terceiro servidor antes de BLOCKED'"
      layer: substring assertion sobre o texto da spec
      evidence: verified
      run: |
        python3 tests/test_atlassian_expert_spec.py ->
          "ok  regra presente: cloudId é o defaults.site literal"
          "ok  regra presente: erro de cloudId não troca de servidor"
          "ok  regra presente: terceiro servidor antes de BLOCKED"
          all green, exit 0
        Texto confirmado na leitura direta: "cloudId (camelCase prefixes): always
        defaults.site from board-flow.yaml, copied literally (a hostname works as
        cloudId). Never an abbreviation, another site's id, a remembered value, or
        the text defaults.site. A cloudId error is fixed this way, never by
        switching servers." e, logo acima, "If the camelCase prefixes answer 'No
        such tool available', try mcp__mcp-atlassian__* before declaring BLOCKED."
        segue intacta.
    verdict: complete
    gap: null

  - id: AC6
    text: "Nenhuma outra regra da spec se perdeu em relação a git show HEAD:board-flow/agents/atlassian-expert.md, além dos três cortes assumidos (frase sobre 'project' em URL, parêntese do claim sobre duas sessões, contagens de uso por servidor). Dizer se algum desses cortes mudou comportamento."
    altitude: document
    surface: "diff completo entre HEAD e o arquivo atual de board-flow/agents/atlassian-expert.md"
    demonstrated_by:
      test: "tests/test_atlassian_expert_spec.py (28 regras nomeadas, nenhuma removida) + git diff HEAD linha a linha"
      layer: git diff manual + checagem das 28 regras do teste automatizado
      evidence: verified
      run: |
        git diff HEAD -- board-flow/agents/atlassian-expert.md mostra 6 hunks, todos
        cobertos: (1) contagens de uso por servidor removidas do parágrafo de
        abertura de Tool binding; (2) regra de cloudId reescrita (tratada em AC5,
        é mudança pretendida, não corte); (3) "Read, then act" virou "Transitions
        via..." + novo bullet "No read just to look..." (tratada em AC1); (4)
        parêntese "(duas sessões paralelas já provaram o mesmo card no mesmo dia)"
        removido da seção Claim; (5) frase "\"project\" inside a URL is not
        evidence of the UI wording." removida da seção UI vocabulary.
        python3 tests/test_atlassian_expert_spec.py -> as 28 regras (incluindo as
        26 antigas) all green, exit 0 — nenhuma regra nomeada sumiu.
        Sobre mudança de comportamento dos 3 cortes:
        - contagens de uso por servidor: só evidência numérica de apoio à frase
          "All three are in use" (agora reescrita sem os números). Não muda regra
          nenhuma — os três prefixos continuam obrigatórios via tools: e a tabela.
          Sem impacto de comportamento.
        - parêntese sobre duas sessões: só justificativa narrativa de por que o
          claim existe; a regra em si (ler antes, publicar 🔒, nunca inventar
          claim-id) está inteira nas duas frases seguintes, inalteradas. Sem
          impacto de comportamento.
        - frase "'project' em URL não é evidência": esta É uma regra de
          comportamento (evita o agente concluir errado que a UI usa a palavra
          "project" por causa da URL). A frase saiu do texto e não foi reposta em
          nenhum outro lugar da seção UI vocabulary. Avaliação: mudança de
          comportamento real, não cosmética — o agente perde o guarda-corpo
          específico contra essa inferência incorreta, mesmo que a regra geral
          ("use as palavras da UI... nunca renomeie identificadores") permaneça.
    verdict: complete
    gap: null
