      layer: doc assertion + leitura manual
      evidence: verified
      run: |
        python3 tests/test_jira_releitura.py ->
          "ok  capture não delega segunda checagem de existência"
          "ok  capture ainda exige o read-back do agente"
          all green, exit 0
        Leitura manual: "Confirm Jira issue <KEY> exists" (a segunda delegação)
        não existe mais no arquivo; o passo 3 mantém "Apply your read-back
        verification rule — confirm the card actually exists before reporting
        success. If getJiraIssue doesn't find the key, return BLOCKED", e logo
