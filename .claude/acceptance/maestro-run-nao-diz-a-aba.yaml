notes: >
  Re-avaliacao de AC5 apos evidencia nova do orquestrador
  (docs/proof/evidence/maestro-run-nao-diz-a-aba-e2e.sh/.out): rodei o MESMO
  script eu mesma, de forma independente, no mesmo workspace herdr (w28),
  contra o mesmo herdr 0.9.1 instalado. Na minha primeira tentativa o
  `herdr pane run` nao entregou o comando a tempo (sleep 2 insuficiente para
  o terminal novo inicializar — reproduzi e diagnostiquei isso isoladamente:
  com sleep de 6s+ o mesmo comando funciona de forma consistente); isso e uma
  corrida de inicializacao do terminal do SO, nao um defeito do mecanismo
  herdr nem da prosa de run.md. Refiz a rodada com sleeps maiores e reproduzi
  EXATAMENTE o resultado do orquestrador: passo 1 (`herdr pane current`)
  executado de dentro do pane de A; clique do dono simulado por
  `herdr tab focus B`; as duas filhas forkadas pelo passo 6c (`herdr pane
  split <pane-lar> --no-focus` + `herdr pane rename` + `herdr pane run` com o
  wrapper \$-escapado identico ao de run.md) nasceram AMBAS na aba A, que
  ficou com pane_count=3 (1 original + 2 filhas), enquanto a aba B (clicada,
  com foco) permaneceu com pane_count=1; ambas as filhas gravaram
  MAESTRO-EXIT:0; o fallback (fechar a aba A e tentar split no pane-lar
  morto) devolveu `pane_not_found` e o comando seguinte (`herdr tab create
  --label`) criou a aba de fallback sem foco, como a prosa promete. Ambiente
  restaurado ao final de cada rodada (abas throwaway fechadas, foco
  devolvido a aba original) — confirmei isso tambem, sem sobrar aba orfa
  (uma aba de depuracao minha, `dbg-A3`, ficou aberta por um instante durante
  o meu diagnostico do timing; fechei manualmente logo em seguida e confirmei
  a lista de abas voltando a `['1', 'cepa-until']`).

  Isso fecha o gap que eu tinha apontado na rodada anterior: nao e mais
  verdade que "nenhum teste possivel neste ambiente exercita o cenario
  literal do Aceite". O script E esse teste — ele roda os comandos herdr
  reais (nao mockados) na sequencia exata que run.md descreve (captura de
  dentro do pane-lar, split por id explicito enquanto outra aba esta em
  foco, fallback para pane_not_found), com uma unica substituicao legitima
  (`claude -p` -> `echo`, porque o criterio e sobre ROTEAMENTO espacial das
  filhas, nao sobre o que elas executam). O unico residual — um agente de IA
  de verdade obedecendo literalmente a prosa de run.md, em vez de um script
  bash rodando os mesmos comandos — e a MESMA altitude em que toda outra
  acceptance de /maestro:run/resume.md neste repositorio ja fecha (grep de
  prosa + subprocess real dos primitivos), entao nao mantenho o item
  incompleto por causa dele.

  Rodei tambem, nesta rodada, apenas o script de evidencia (e minha copia
  dele) em primeiro plano — nao rodei nenhuma suite completa, conforme
  pedido. AC1-AC4 continuam como na rodada anterior (tests/test_maestro_run_aba.py
  -> all green), sem necessidade de re-rodar porque nada mudou no codigo
  entre as duas rodadas de auditoria, so a evidencia de AC5.
