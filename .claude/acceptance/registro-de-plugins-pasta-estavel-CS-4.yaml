notes:
  - "Alegacao do implementador verificada em bin/install.sh (nao mudou em 09bee86..9f37dae; git diff --stat mostra so tests/test_install_live_dir.py, +34): (1) `set -e` na linha 35; (2) `ops_write \"in_progress\"` na linha 268, antes de qualquer copia; (3) a copia vai para `${LIVE_DIR}.new` (linhas 296-310, `rm -rf` do staging antigo e `shutil.copytree` de cada plugin); (4) o `mv`/`rm -rf` de `${LIVE_DIR}` so acontece nas linhas 311-319, depois do python3 de copia, e `set -e` encerra o script antes disso se o copytree levantar. O registro so vira `ok` mais adiante. Portanto o comportamento ja valia desde CS-1 e o criterio nao exigia mudanca no instalador."
  - "O teste e vermelho por razao certa: a pasta ilegivel (`build-solo/agents`, existe no repo e `build-solo` esta no marketplace.json) quebra o copytree, nao outra etapa; o teste restaura chmod 755 em `finally`. Roda como usuario nao-root (alegomes), onde chmod 0 realmente bloqueia a leitura; como root o teste nao provaria nada, ressalva menor de ambiente."
  - "Criterio satisfeito no teste sem enfraquecimento: a checagem de integridade e byte a byte (snapshot antes e depois), nao so existencia do diretorio; o `in_progress` vem do arquivo no disco, nao de saida."
  - "Ressalva menor, nao bloqueante: o teste nao confere que a mensagem de erro do instalador cita a pasta ilegivel; o criterio nao pede isso."
  - "Prova de execucao: rodei so `python3 tests/test_install_live_dir.py`, em primeiro plano (exit 0, 'all ok'); nao rodei a suite completa."
