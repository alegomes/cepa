# Example jira-flow project config — for the discovery topology.
#
# When --topology=discovery is passed to bin/install.sh, this file is copied
# to the host project as `jira-flow.yaml` (at project root). Edit it after
# install to match YOUR Jira site, project, board, and the discovery board's
# status names.
#
# Three sections:
#
# 1. defaults — identity values atlassian-expert reads to fill site/project/
#    board/etc. on every Jira call. atlassian-expert is FORBIDDEN to infer
#    or guess any of these from context (repo name, conversation, etc.) —
#    if a value is missing here, the operation refuses with BLOCKED.
#
# 2. default_topology — which topology's leads /jira-flow:execute and
#    /jira-flow:plan-track-build-validate delegate to.
#
# 3. lifecycles — matched by (project_key, current status) when running
#    /jira-flow:advance. Multiple lifecycles supported in one file.

schema_version: 1

# --- 1. Defaults: identity values for every Jira operation ---
defaults:
  site: example.atlassian.net           # YOUR Jira cloud site (e.g. acme.atlassian.net)
  project_key: WEGO                     # default project for new cards
  board_id: 766                         # default board (Scrum/Kanban) — used by /jira-flow:drain
  status_map:
    # Literal Jira status names for the four states the canonical flow uses.
    # /jira-flow:drain pulls cards from `to_do`. /jira-flow:execute and
    # /common:autonomous-start move cards from `to_do` → `in_progress` →
    # `in_review`. Cards that hit a blocker stay in `in_progress` (or move
    # to `blocked` if your project has that column).
    #
    # The split between Backlog (unrefined / unprioritized) and `to_do`
    # (refined and ready for development) is a project convention — drain
    # only pulls from `to_do`, so unrefined Backlog items stay safe.
    to_do:       "To Do"          # ready-for-development column /drain pulls from
    in_progress: "In Progress"    # work in flight
    in_review:   "In Review"      # done, awaiting review. MUST match the board's literal
                                  #          status name — some boards call this column
                                  #          "Review", not "In Review". /jira-flow:prove and
                                  #          /jira-flow:prove-drain pull from this status, so a
                                  #          mismatch means they find zero cards.
    blocked:     "Blocked"        # optional; if your project doesn't have this status,
                                  #          set it to null and blocked cards stay in `in_progress`
                                  #          with a comment.
    done:        "Done"           # optional; the status AFTER in_review. When set, /jira-flow:prove
                                  #          auto-advances a PROVEN card here. Leave unset (or null)
                                  #          for triage-only: PROVEN gets a ✅ comment but stays in
                                  #          Review for you to move manually.
  issue_types:
    story: "Story"
    bug: "Bug"
    epic: "Epic"
    task: "Task"
  required_fields: []                   # custom fields with project-mandated defaults, e.g.:
                                        # - { id: customfield_10010, name: "Team", value: "Engineering" }

# --- 2. Default topology for build/validate flows ---
# Tells /jira-flow:execute and /jira-flow:plan-track-build-validate which
# topology's leads to delegate to (e.g. hex-backend:engineering-lead).
default_topology: discovery

# --- 3. Per-topology overrides (optional) ---
# When a topology is active, fields here REPLACE the matching field
# in `defaults`. Used by atlassian-expert when creating issues or
# applying required_fields. List fields like `required_fields` are
# atomic: the topology's list replaces the defaults' list entirely,
# not merged item-by-item.
#
# Active topology resolution order:
#   1. Explicit `topology: <name>` in the orchestrator's delegation.
#   2. `.claude/topology` marker file.
#   3. `defaults.default_topology` above.
#   4. No topology → use defaults alone.
#
# Common use case: same Jira project, different Team field per
# topology. Discovery work goes to the product team; hex-backend work
# goes to engineering.
topologies:
  discovery:
    # Product team owns discovery cards.
    required_fields:
      - { id: customfield_10010, name: "Team", value: "Product" }
    # If discovery uses a different Jira project, override here:
    # project_key: DISC

  hex-backend:
    # Engineering team owns code Stories. If matching `defaults`,
    # this block is optional.
    required_fields:
      - { id: customfield_10010, name: "Team", value: "Engineering" }

  multi-team:
    required_fields:
      - { id: customfield_10010, name: "Team", value: "Platform" }

# --- 4. Lifecycles for /jira-flow:advance ---
lifecycles:
  - topology: discovery
    project_key: WEGO
    # Set issue_type to whatever your discovery board uses for opportunity
    # cards. Common values: Story, Idea, Opportunity, Discovery. Used as
    # the default for /discovery:capture.
    issue_type: Story
    columns:
      - name: Inbox
        # Initial status — where /discovery:capture lands the card.
        status: "To Do"
      - name: Framing
        status: "Framing"
        on_enter: opportunity-framer
      - name: Researching
        status: "Researching"
        on_enter: user-researcher
      - name: Validating
        status: "Validating"
        # The card cannot enter Validating until assumption-tester has
        # written assumptions.md with pre-declared success criteria.
        enter_gate: "card has assumption-tester test plan in docs/discovery/<KEY>/assumptions.md"
      - name: Validated
        status: "Validated"
        # The card cannot enter Validated until evidence-auditor has
        # returned Confirmed across all gating assumptions.
        enter_gate: "evidence-auditor verdict in docs/discovery/<KEY>/audit.md = Validate (all gating assumptions Confirmed)"
      - name: Handed off
        status: "Done"
        on_enter: epic-briefer
      - name: Discarded
        status: "Won't Do"
