    altitude: strategic
    original_choice: "Option B — slot de corpo no out-port para que o teste de hash-sobre-texto-claro exercite o caminho real do anexar(); DTO/in-port seguem sem o campo"
    user_verdict: refine
    user_reason: "refine"
    refined_rationale: "A escolha esta certa (a alternativa — testar calcularHash isolado — testa a costura errada: calcularHash JA recebe o plaintext pronto; quem escolhe o que passar e verificar()/anexar(). E forjar a linha por SQL exigiria reimplementar o canonico no teste, que entao passa junto com o bug). O que faltou no rationale: reconhecer que o slot deixa o portao de producao apoiado APENAS na ausencia do campo no DTO, sem nenhuma assercao prendendo o null. Ao abrir um slot de porta que so o teste preenche, PRENDA o comportamento de producao com um teste no service (ex.: assertNull(reg.corpo())) no mesmo commit — senao a seguranca e estrutural por acidente e evapora no dia em que o proximo card adicionar o campo ao in-port. Feito em eea8ee6."
    tag: principle

