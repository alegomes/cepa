  - run_id: 20260709-trilha-fundacao
    date: 2026-07-09
    topic: "canonico do hash dropa so recurso/recursoCodigo; mantem detalhe e saude_*"
    altitude: strategic
    original_choice: "Option B — manter detalhe e saude_* no lacre; dropar apenas os dois campos que o ADR nomeia como derivados"
    user_verdict: refine
    user_reason: "refine — apos investigar: o critério do rationale estava impreciso, ainda que a escolha estivesse certa"
    refined_rationale: "A escolha esta certa, o criterio do rationale nao. Nao e \"observado vs composto\": detalhe E composto pela borda (era ele que empacotava \"GET 200\"), e ainda assim pertence ao lacre. O criterio correto, que o ADR 0001 §2 enuncia sem nomear, e: NADA QUE O BACKEND VA RECOMPUTAR PODE ESTAR DENTRO DO LACRE. recurso/recurso_codigo saem porque o backend os re-deriva na leitura (VIEW, ADR §7) — selados, cada melhoria da regra exigiria abrir o envelope. detalhe e saude_* sao carga opaca que o backend so armazena e nunca re-derivara; selá-los nao pode causar aquele modo de falha. Corolario pratico, mais importante que a regra: o que fica FORA do canonico e exatamente o que alguem pode reescrever de graca sem quebrar verificar(). Logo o canonico nao se \"simplifica\" — sele toda coluna gravada exceto (a) o que o backend recomputa e (b) a maquinaria de tombstone (purgado/purgado_em/motivo_purga) e o proprio lacre (seq/prev_hash/hash). Tirar saude_* deixaria alguem virar injecaoOk de false para true e apagar a prova de que a instrumentacao estava cega. Achado decorrente, levado ao WEGO-1896: truncado/tamanho_original estao fora do canonico e precisam entrar NO MESMO COMMIT em que ganharem escritor — um campo cujo proposito e declarar \"aqui cortamos dado\" e justamente o que um adversario vira para false."
    tag: principle

