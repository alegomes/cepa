  - run_id: 2026-05-30-wego-1705
    date: 2026-05-30
    topic: defense-in-depth — verify-green ≠ system-correct
    user_verdict: principle
    user_reason: |
      WEGO-1705 fix relaxou validator (API layer) e shipou verde — mas validator-aceita
      ≠ system-aceita. Domain Signatario.requireNonNull e PlugSignPort.requireNonNull
      ainda enforçavam a regra antiga em layers downstream → consumidores recebiam 500.
      Bug nunca detectado pelo verify (testes focados só no validator) e o Swagger
      documentava o request quebrado.
    refined_rationale: |
      Para qualquer mudança que relaxe validação / mude contrato (validator, openapi,
      domain invariant, adapter), aplicar defense-in-depth: R1 grep do campo pelo
      pipeline inteiro antes do fix; R2 teste no nível onde o COMPORTAMENTO vive
      (não só onde a code-change vive); R3 gaps deliberados de teste = card de
      follow-up (nunca silente); R4 smoke real (curl) antes de "ready to ship".
      Ver common/skills/defense-in-depth/SKILL.md.
    tag: principle

  - run_id: 2026-06-03-drain-followups
    date: 2026-06-03
    topic: shape de sub-recurso aninhado em DTO de lista (medico em GET /atendimentos)
    altitude: strategic
    original_choice: Option A — subset enxuto MedicoResumoResponse{id,nome,crm,crmUf} na lista, distinto do MedicoInfo completo do detalhe
    user_verdict: overrule
    user_reason: |
      Espelhar o MedicoInfo completo do detalhe na lista — consistência de
      contrato (mesmo shape em todo endpoint) vale mais que payload enxuto;
      o front não quer dois formatos de medico.
    refined_rationale: |
      Ao adicionar um sub-recurso aninhado (medico, paciente, responsavel...)
      a um DTO de LISTA, o default é ESPELHAR o shape COMPLETO já exposto no
      endpoint de DETALHE — não criar um subset enxuto endpoint-específico.
      Consistência de contrato > economia de payload; o front não quer dois
      formatos do mesmo recurso. Só divergir para um subset slim se o
      produto/usuário pedir explicitamente. (No WEGO-1735 fiz subset e foi
      overruled.)
    tag: principle
