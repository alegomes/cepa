    date: "2026-05-08"
    topic: "Rename strategy — big-bang vs deprecation window for breaking API renames"
    original_choice: "Option C — big-bang for EQUIPE_CLINICA (internal-only), deprecation window for Arquivo→Documento (more consumers)"
    user_verdict: refine
    user_reason: "I'd have chosen A. We don't have active clients yet. It's time to keep the house clean"
    refined_rationale: "When there are no active external clients, prefer big-bang rename over deprecation windows — transitional routes add complexity without protecting anyone. Only choose deprecation window when real clients (confirmed, in production) consume the endpoint."
