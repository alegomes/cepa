  - run_id: 2026-05-27-wego-1683
    date: 2026-05-27
    topic: debrief presentation style
    altitude: meta
    original_choice: "(behavioral feedback, not a decision in the run — surfaced mid-debrief)"
    user_verdict: principle
    user_reason: "Apresente todas as demais decisões nesse nível de clareza."
    refined_rationale: |
      When walking decisions in /common:debrief, do NOT copy-paste the
      raw Decision block from the artifact. For EACH decision, present:
      (1) topic in plain language; (2) Contexto — what the surrounding
      code/flow is and why this choice matters; (3) Risco se errar —
      concrete bad outcomes of picking wrong; (4) Opções — labeled with
      what each one means in practice (not abstract trade-off jargon);
      (5) Diferença prática — what changes for the user/operator/dev
      between options; (6) Rationale (verbatim) — quoted from the block;
      (7) Verdict? prompt. The user shouldn't have to ask "I don't
      understand this decision" — every decision should be self-explained
      at the level of someone who didn't author the run.
    tag: principle

  - run_id: 2026-06-02-wego-1732
    date: 2026-06-03
    topic: divergência entre reviewers — sustentar o que aponta CORREÇÃO sobre o que dá APPROVE
    altitude: strategic
    original_choice: Option A — REJECT o gate; sustentei o refactor-advisor (Finding "MEDIUM") contra o code-reviewer (APPROVE), tratei como bug de correção, roteei conserto + teste-guarda
    user_verdict: keep
    user_reason: "(no reason given)"
    refined_rationale: |
      Quando code-reviewer e refactor-advisor divergem e UM deles aponta um
      defeito de CORREÇÃO (não estilo), não despache pelo APPROVE — verifique
      o achado no código você mesmo e, se confirmado, REJECT mesmo com build
      verde e reviewer aprovando. Rótulo de severidade do advisor (MEDIUM)
      não é confiável para correção: um falso-abort/falso-positivo de runtime
      é HIGH na prática. O loop adversarial existe exatamente para isso —
      o refactor-advisor pegou no run 1732 um falso-abort que qa + code-reviewer
      deixaram passar. Confirmar-no-código > confiar no veredito do artefato.
    tag: principle

