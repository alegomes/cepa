  - run_id: 2026-05-27-wego-1683
    date: 2026-05-27
    topic: remove @Retry(maxRetries=2) from TasyGatewayAdapter (HIS dispatch path)
    altitude: strategic
    original_choice: Option A — remove @Retry from adapter entirely (affects all callers, not just dispatch)
    user_verdict: refine
    user_reason: "Eu quero que o retry+timeout seja uma feature flag"
    refined_rationale: |
      Don't hard-remove @Retry+@Timeout — make them feature-flagged
      (e.g. wego.his.retry.enabled, wego.his.timeout.ms). The fail-fast
      decision has TWO real benefits, not one: (1) latency UX (avoid
      10s × 3 attempts = 30s waits for operator); (2) observability of
      chronic HIS instability — retries mask intermittent failures and
      let HIS degrade silently, so removing retry surfaces every blip as
      a 503 the operator complains about, generating a ticket and root
      cause. Feature-flagging both knobs lets ops tune per environment
      without code change, AND keeps the "expose chronic problems" lever
      available even after the initial rollout settles. Follow-up task
      to introduce the flags.
    tag: principle

