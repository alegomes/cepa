  - run_id: 2026-06-03-drain-followups
    date: 2026-06-03
    topic: classificar bloqueio na triagem de um drain — separar tipos de bloqueio
    altitude: strategic
    original_choice: "Option A — executar só os 4 cards in-repo; deixar 1736/1737/1741 (GitOps) e 1743 (CNPG) em To Do com comentário de bloqueador"
    user_verdict: refine
    user_reason: "refine via debrief — separar tipos de bloqueio"
    refined_rationale: |
      Manter a decisão (não executar o que não dá para verificar), MAS o
      racional deve SEPARAR os tipos de bloqueio em vez de agrupá-los como
      "infra/bloqueado":
      (1) bloqueio por ACESSO — cluster/Keycloak/ArgoCD fora de alcance da
          sessão → realmente não-executável nem verificável;
      (2) bloqueio por REPO AUSENTE — ex. clinic-manager-gitops não está
          local mas é CLONÁVEL → considerar clonar antes de rotular como
          bloqueado (a ausência não é o mesmo que inacessível);
      (3) bloqueio por CONFIRMAÇÃO EXTERNA — ex. CNPG permitir
          pg_trgm/unaccent → é uma pergunta a responder, não um repo a tocar.
      Cada categoria tem tratamento diferente; não colapsar as três num só
      "bloqueado". Na triagem, checar a categoria 2 (clonável?) antes de
      descartar.
    tag: principle

  - run_id: 2026-06-03-drain-followups
    date: 2026-06-03
    topic: shape de sub-recurso aninhado em DTO de lista (medico em GET /atendimentos)
    altitude: strategic
    original_choice: "Option A — subset enxuto medico{id,nome,crm,crmUf} na lista, distinto do MedicoInfo completo do detalhe"
    user_verdict: overrule
    user_reason: |
      Espelhar o MedicoInfo completo do detalhe na lista — consistência de
      contrato (mesmo shape em todo endpoint) vale mais que payload enxuto;
      o front não quer dois formatos de medico.
    refined_rationale: |
      Default para sub-recurso aninhado (medico, paciente, etc) em DTO de
      lista: ESPELHAR o shape COMPLETO já usado no endpoint de detalhe, não
      inventar um subset enxuto endpoint-específico. Consistência de contrato
      > economia de payload (o front não quer dois formatos do mesmo recurso).
      Só fazer subset se o usuário/produto pedir explicitamente uma lista
      slim. Em modo autônomo, NÃO tratar isso como decisão livre do
      orquestrador rumo ao "enxuto" — o default seguro é consistência total.
    tag: principle

