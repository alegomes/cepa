# build-hex.yaml — project root layout config for the build-hex topology.
#
# Maps architectural ROLES (the invariants of hexagonal architecture)
# to the physical modules in YOUR project.
#
# The build-hex plugin is opinionated about the architectural
# invariants:
#   - Domain is framework-free (no JPA / @Inject / Quarkus annotations)
#   - Dependencies always point inward (Anti-Corruption Layer at adapters)
#   - Driving adapters call use cases through ports
#   - Driven adapters implement driven ports
#
# It is NOT opinionated about directory names. The default layout
# (used when this file is absent) maps each role to a module of the
# same name plus `api` → `api-rest` and `adapter` → `infrastructure`:
#
#   role          → module
#   ─────────────   ────────────
#   domain        → domain
#   application   → application
#   api           → api-rest
#   adapter       → infrastructure
#   bootstrap     → bootstrap
#
# If your project follows that convention, you can DELETE this file
# entirely — the plugin uses the defaults.
#
# If your project uses different module names (e.g.,
# `tenancy-core/tenancy-api/tenancy-adapter/tenancy-app`), edit the
# `roles` block below to map each architectural role to your module.
# Roles can share a module (e.g., domain and application code living
# together is common in smaller projects).

schema_version: 1

roles:
  # The framework-free core: entities, value objects, domain exceptions.
  # No @Inject, no @ApplicationScoped, no JPA annotations.
  domain: domain

  # Use cases + driving/driven ports. Pure Java; may share a module
  # with domain in smaller projects.
  application: application

  # Driving adapters: REST controllers, GraphQL resolvers, message
  # consumers. Translates external requests into use case calls.
  api: api-rest

  # Driven adapters: persistence, third-party API clients, message
  # producers. Implements driven ports defined in application/.
  adapter: infrastructure

  # Composition root: CDI wiring, framework config, main entry point.
  bootstrap: bootstrap

# Single-module projects: use `.` (or empty string) to mean "no
# module-level prefix; sources live directly under project root,
# under src/main/...". Example for a single-module hex project where
# all layers share `src/`:
#
# roles:
#   domain:      .
#   application: .
#   api:         .
#   adapter:     .
#   bootstrap:   .
#
# Result: each role's glob becomes `src/main/**` (not `./src/main/**`).
# fnmatch doesn't normalize `./` so the literal `.` is what makes it
# work as a single-module marker.

# Optional: project-specific write paths that fall outside the
# canonical role-based allowlists.
#
# Use case: a one-off migration script, a project-specific tooling
# directory, an integration test fixtures dir, etc. — paths that
# legitimately need writes from a specific agent but don't fit the
# hex-architecture roles above.
#
# Format: `<agent-name>: <comma-separated-globs>`. Multiple agents
# may have extras. Each list is APPENDED to the canonical role-based
# allowlist for that agent (deduplicated), so the agent keeps its
# default writes AND gains the extras.
#
# Use sparingly. If you find yourself adding many extras for the same
# agent, the project probably wants a `roles:` remap or a different
# topology, not an ever-growing extras block.
#
# Two equivalent syntaxes for the value:
#
#   # Comma-separated string (concise; no quoting):
#   extra_write_globs:
#     adapter-dev: scripts/fase0-concierge/**,scripts/other-migration/**
#     qa-engineer: e2e-fixtures/**
#
#   # Inline list (more readable when items contain commas or special chars):
#   extra_write_globs:
#     adapter-dev: ["scripts/fase0-concierge/**", "scripts/other-migration/**"]
#     qa-engineer: ["e2e-fixtures/**"]
#
# Both are parsed equivalently. Multi-line YAML lists (with `-` items
# on separate lines) are NOT supported by the minimal parser. Stick
# to one of the two inline forms above.
