- id: WEGO-1974
  title: PlugSignAdapter não trata HTTP 408 — Request Timeout vira erro de negócio
    e não retenta
  why: 'Mesmo defeito do WEGO-1973, outro status code. 408 cai na regra genérica
    `>= 400 && < 500` (PlugSignAdapter.java:1237 e :1294) → PlugSignBusinessException
    → abortOn dos 11 @Retry → não retenta. "A conexão com o fornecedor demorou demais"
    chega ao cliente como "você mandou dado errado" (422). 503/504 já estão corretos
    — o buraco é só nos 4xx transitórios. Urgência MÉDIA (validation-lead): 408
    é bem mais raro que 429 e o conserto é de uma linha no mesmo ponto. Fazer no
    próximo toque neste arquivo, de preferência junto com WEGO-1962 (mesmo adapter).

    '
  status: done
  blocked_by: []
  human_pending: null
  notes: '✅ CONCLUÍDO 2026-08-02 — In Review, aceite COMPLETE (.claude/acceptance/WEGO-1974.yaml).
    Human validation route: not applicable (substrato interno) — o sintoma só seria
    reproduzível à mão provocando um 408 real do fornecedor, o que exigiria bater
    na API de produção; a prova automatizada é mais forte e já está feita. Fix:
    PlugSignRequestTimeoutException nova em domain (herda de PlugSignException,
    a base retentável, e NÃO de PlugSignClientException, que está no abortOn) +
    classificação do 408 antes da regra genérica de 4xx nos três sítios do adapter.
    Diff +941/-0, puramente aditivo; as 11 anotações @Retry NÃO foram tocadas. Full
    verify verde em 018b1b1c (2.743 testes, 0 falhas). RED-at-base refeito do zero
    pelo completion-auditor: Tests run: 5, Failures: 5. Correção de premissa apurada
    na execução: o teste original cobria o sítio :1328, não os que se supunha —
    os outros dois estavam descobertos e foram cobertos. Matriz de perturbação com
    isolamento 1→1 nos três. Achados que NÃO viraram card ainda: (a) downloadFile
    não tem @Retry, só @Timeout(30s), então o 408 ali é classificado certo mas nunca
