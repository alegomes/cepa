      s1_dead_code_check:
        status: pass
        run: "read common/bin/cepa-plan:3681-3783 (cmd_answer) and 3642-3678 (decide_waivers) at 35b06c4. The waiver file is written only inside decide_waivers (3658 'sim', 3667 'não'), called from cmd_answer at 3736, and only when item_proposals found a `status: proposta` file for the item (`--keep`, an answer that is neither sim nor não, and no proposals write no waiver). cmd_answer then sets `it['evidence'] = ' '.join(parts)` (3766): parts starts with `Resposta do dono em <today>: <answer>.` and, whenever the item had evidence, ends with `Evidência anterior: <previous>`; the new evidence is never byte-equal to the old one. `write_body(target, plan, ...)` (3772) rewrites the queue file, which is the first element of cepa-until's `paths` (run_record_paths). So wherever the waiver changed in a normal pass, the queue snapshot changed too."
        residual: "one path writes the waiver and not the queue: an OSError (or yaml error) inside write_body (3772) AFTER decide_waivers already rewrote the waiver (3736). `answer` then ends with a traceback and rc != 0, the queue is untouched and the waiver stays modified; with the clause removed `decide` leaves that waiver uncommitted. Needs a failed write of the queue file right after the waiver write succeeded (disk full, read-only queue); not reachable in normal use. Not gating."
