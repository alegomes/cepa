          - "decide second-signal test: the intended event is 'decide is blocked opening a FIFO waiver file'. The feeder thread decides whether to send the second signal by checking `gate.is_set()` at each FIFO open and sleeps 0.5 s after sending; the main loop polls the pty with a 0.5 s select and has 30 s / 120 s deadlines. It depends on the pairing of FIFO readers and writers between decide's start-time snapshot, cepa-plan answer and the end-time snapshot, and that pairing raced: 1 in 6 unperturbed runs never got the second signal and hung (false red). It is not synchronised only on an event; it is timing-dependent and flaky (small sample)."
