    perturbation:
      status: pass
      results:
        - "P1 — só `pending` vira demanda: `if st == \"pending\":` (em demandas_da_fila) trocado por `if True:` — 9 asserções foram para FAIL (in_progress/blocked/done/dropped voltaram a virar demanda, a cascata sumiu, o piso D7 relatou 4 demandas em fila que devia dar 2, o `source` mudou de 3-de-4 para 4-de-4) — RED confirmado, restaurado"
        - "P2 — a ordem da fila é preservada: `ordenados = [it for it in candidatos if ...]` trocado por uma versão que ordena por `id` — a asserção 'promote: preserva a ordem da fila' (fila Z,Y,X,W) foi para FAIL — RED confirmado"
        - "P3 — onda_minima sobe pelo `blocked_by`: `alvo = max([1] + [piso[b] + 1 ...])` trocado por `alvo = 1` — 4 asserções foram para FAIL (sobe de onda, dependência encadeada empilha 1→2→3, `ondas_minimas` do plano, e o caso 'aponta para item POSTERIOR na fila') — RED confirmado"
        - "P4 — bloqueador `done` não segura: a guarda `if b in fechados: continue` desativada — a asserção 'bloqueador done não segura ninguém' foi para FAIL (B, que dependia de A `done`, virou candidato excluído em vez de onda_minima 1) — RED confirmado"
        - "P5 — bloqueador `dropped` sai do campo com AVISO: o bloco inteiro que gera o aviso e faz `continue` foi removido — a asserção 'bloqueador dropped sai do campo mas vira AVISO' foi para FAIL (B, que dependia de A `dropped`, virou EXCLUÍDO em vez de demanda com aviso) — RED confirmado"
        - "P6 — cascata (bloqueador aberto e fora da promoção tira o item junto, e quem depende dele): a linha `vivos.discard(ident); mudou = True; break` (dentro do laço de ponto-fixo) virou `pass` — 3 asserções foram para FAIL (B, que dependia de A `in_progress`, voltou a ser demanda; C, que dependia de B, também; o resto da fila passou a incluir B e C junto com D,E,F) — RED confirmado"
        - "P7 — `human_pending` aberto vira `human_gate: \"open: <rota>\"` numa linha só: `_human_gate` reduzida a sempre `return \"none\"` — a asserção do gate aberto foi para FAIL (`none` em vez de `open: abrir /admin...`) — RED confirmado"
        - "P8 — piso D7 (< 4 demandas = exit 4, JSON sai mesmo assim): `piso_ok = len(demandas) >= PISO_DEMANDAS` trocado por `piso_ok = True` — 4 asserções foram para FAIL (exit 0 em vez de 4 com 3 demandas, sem a recomendação de /common:drain-plan no stderr, `floor.atingido` mentindo True, e a fila só com item `done` deixou de recusar) — RED confirmado"
        - "P9a — recusa de plano `parallel-waves` (exit 3): o bloco `if modo_de(plan) != MODE: ...; return 3` em `cmd_promote` desativado — a asserção 'recusa um plano de ondas (exit 3)' foi para FAIL (caiu no `valida_plano`, que devolveu 'mode é parallel-waves' via outro caminho, mas com a mensagem/exit errados) — RED confirmado"
        - "P9b — recusa de fila inexistente (exit 2, apontando /common:plan): o bloco de checagem `if not alvo.is_file(): ...; return 2` no início de `cmd_promote` desativado — a asserção correspondente foi para FAIL (o comando estourou tentando ler um arquivo inexistente, com mensagem genérica de arquivo ilegível em vez da recusa nomeada) — RED confirmado"
        - "P9c — recusa de fila inválida (`why` vazio, exit 2): a chamada `valida_plano(plan)` e a recusa correspondente em `cmd_promote` desativadas — a asserção 'recusa promover fila inválida' foi para FAIL (o comando seguiu adiante e devolveu PISO NÃO ATINGIDO em vez de recusar a fila inválida) — RED confirmado"
        - "P10 — `source` de rastreio (fila, caminho, contagem, data, fonte da própria fila): `fonte_da_fila` substituída por uma versão que devolve texto fixo — 2 asserções foram para FAIL ('diz de qual fila, de qual caminho e quantos itens' e 'carrega a fonte da própria fila') — RED confirmado"
        - "P11 — `promote` NÃO escreve na fila: `cmd_promote` alterado para marcar todo item `pending` como `in_progress` e chamar `grava_corpo` antes de calcular as demandas — a suíte quebrou com múltiplas asserções em FAIL e um traceback (KeyError) no meio do run, provando que o disco mudou sob o comando — RED confirmado (o precedente `[from-plan:queue-untouched]` da suíte, que compara bytes do arquivo antes/depois, é o teste desenhado exatamente para isto e também acusaria a quebra caso a suíte não tivesse abortado antes de chegar nele)"
      run: >-
        worktree descartável /tmp/proof-program-plan-from-plan (git worktree
        add --detach HEAD, HEAD = 2e57cf0). GREEN de partida confirmado
        primeiro: `python3 tests/test_program_plan_from_plan.py` →
