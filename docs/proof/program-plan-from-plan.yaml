      recusas do card É o roteiro de adversarial input desta CLI, no mesmo
      padrão de common-plan-etapa2.yaml e common-drain-plan.yaml. `cli` não é
      o módulo `api-rest` do vocabulário Quarkus (este repo não tem um), então
      a condição estrutural do `n/a` (nenhuma classe mudada em módulo
      input-bearing no sentido Quarkus) é vácua aqui — mas a condição de fundo
      (razão nomeada, diff que abre superfície mas já coberta por L3) se
      mantém.
  bugfix_regression_red_at_base:
    status: n/a
    run: "issue_type Feature, não Bug — não há regressão a reproduzir na base"
routing_reason: >-
  Todos os 13 comportamentos pedidos para o `cepa-plan promote` foram, cada
  um, quebrados na CLI real (common/bin/cepa-plan) dentro de um worktree
  descartável, e o caso de tests/test_program_plan_from_plan.py que deveria
  acusar a quebra foi para RED em todas as 13 perturbações — depois restaurado
  e a suíte confirmada GREEN de novo (junto com test_cepa_promptcov.py, que
  cruza os checkpoints [from-plan:*] da prosa de program-plan.md). Cobertura:
  só pending vira demanda, ordem preservada, onda_minima subindo pelo
  blocked_by (inclusive apontando para frente e em cadeia), bloqueador done
  não segura, bloqueador dropped sai do campo com aviso, cascata de exclusão,
  human_gate numa linha só, piso D7 (exit 4, JSON mesmo assim), as três
  recusas (ondas, fila inexistente, fila inválida), a linha `source` de
  rastreio, e `promote` não escrevendo na fila. Nenhum nível ficou
  assumed/skipped/gap/survived no que decide o verdito. Um único achado fica
  reportado dentro de l2_coverage como ressalva nomeada (não como gap que
  bloqueia): o mecanismo de ponto-fixo de `onda_minima` não é distinguido de
  um único passe pelas duas fixtures existentes, porque a ordem delas coincide
  por acaso com a ordem da dependência — isso não torna o COMPORTAMENTO
  observável não-provado (P3 provou o mecanismo real, com um alvo que quebra
  independente de ordem), só significa que uma fixture de ordem inversa ainda
  não existe. PROVEN.
