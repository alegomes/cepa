  l2_coverage:
    status: pass
    uncovered_lines: []
    run: >-
      leitura estrutural (não há coverage tool wired neste repo Python): as 13
      perturbações cobrem toda linha de decisão nova em `demandas_da_fila`
      (filtro pending, ordem, cascata, done/dropped no blocked_by, ponto-fixo
      de onda_minima), `_human_gate`, `fonte_da_fila` e `cmd_promote` (as três
      recusas e o piso D7) — nenhuma ficou verde ao ser quebrada. RESSALVA
      nomeada (não bloqueia o verdito, é achado): a alegação "por ponto-fixo"
      do docstring de `demandas_da_fila` — convergência iterativa que lida com
      `blocked_by` apontando tanto para trás quanto para a frente, mesmo com
      cadeias mais longas que um passe resolve por acaso — não é distinguida
      pelos 2 testes de `onda_minima` existentes: rodei manualmente (fora da
      suíte, só para investigar) uma versão com `for _ in range(1)` (1 passe
      em vez do ponto-fixo completo) contra as DUAS fixtures que a suíte usa
      (cadeia A→B→C e o caso "aponta para item posterior") e o resultado ficou
      IDÊNTICO ao ponto-fixo completo — a ordem de inserção nessas duas
      fixtures coincide por acaso com a ordem que a dependência precisa. Uma
      fixture com a ordem INVERSA da dependência (D bloqueado por C, C por B,
      B por A, nessa ordem na fila) exigiria de fato mais de um passe — não
      existe hoje, então esse detalhe do algoritmo (necessidade de múltiplos
      passes, e não só o resultado correto nos casos testados) fica como
      `assumed`, não `verified`, e é reportado separadamente da proteção geral
      de onda_minima (P3 acima, que USA um alvo genuinamente independente de
      ordem e por isso pega o mecanismo real).
