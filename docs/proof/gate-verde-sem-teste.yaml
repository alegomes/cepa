  l4_adversarial_input:
    status: clean
    findings: []
    reason: >-
      Testado contra as saídas realistas pedidas — nenhuma classificou errado:
      (1) maven multi-módulo com um módulo 'Tests run: 0' e outro 'Tests run: 3'
      (MAVEN_COM_TESTE tem duas linhas 'Tests run:' repetidas, por-classe +
      Results): count_tests_run() usa max(a-s for a,s in runs), não soma
      módulos, pega o maior — um módulo real com testes classifica SUCCESS
      corretamente. (2) pytest '2 passed, 3 deselected' (PYTEST_COM_TESTE): a
      soma 'passed'+'failed' vence antes do fallback de deselected —
      corretamente SUCCESS com tests_run=2. (3) surefire
      failIfNoSpecifiedTests=true (build falha de verdade, não passa vazio):
      fora do escopo do EMPTY por desenho — sai com marcador BUILD FAILURE,
      cai no caminho FAILURE normal do classify(), nunca chega em
      refine_empty() (que só atua sobre status == SUCCESS). (4) jest com tudo
      'skipped' (JEST_TUDO_PULADO: 14 skipped, 14 total, sem 'passed'): a
      regex 'Tests:' captura a linha, mas nem 'passed' nem 'failed' casam →
      soma 0 → EMPTY, correto. Nenhum desses cenários produziu um SUCCESS
      falso nem um bloqueio indevido.
