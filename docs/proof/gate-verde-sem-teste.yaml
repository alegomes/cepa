  9eef3a4 → 19 falhas) confirma que o teste realmente amarra no código novo,
  não passa por coincidência. L4 adversarial rodou contra as saídas realistas
  pedidas (maven multi-módulo, "N passed, M deselected", jest tudo pulado,
