  in_review/done nos dois lugares, e SÓ nessas direções/status; bounce e
  blocked/pending continuam livres) é de fato load-bearing — RED confirmado e
  restaurado em cada um. P3 também vai a RED, mas só via um guard estrutural
  pré-existente (regex sobre o texto-fonte em test_session_anchor_root.py),
  não por uma asserção comportamental do próprio card; reproduzido à parte,
  confirma que um `cd` para subdiretório de fato vazaria o bloqueio se esse
  guard não existisse — registrado como achado de robustez, não bloqueia
  sozinho. P6 SOBREVIVEU de verdade: nada na suíte (nem
  test_verde_sem_teste.py, nem test_common_drain_plan.py) distingue a raiz da
  worktree ligada do clone principal para o check de EMPTY em `cepa-plan
  finish`, e a reprodução fora da suíte (worktree ligada real + fila no clone
  principal) mostra o `done` sendo aceito quando deveria ser recusado — linha
  mudada, load-bearing pela própria documentação do código, sem teste que a
  prove. Isso sozinho já força UNPROVEN (L2/L3: linha alterada e
  descoberta/sobrevivente na altitude reivindicada). Além disso, L4 encontrou
  um caminho real e não-hipotético (STALE herdando de um EMPTY sem novo build)
  em que o bloqueio inteiro do card não se aplica — não decide o veredito
  sozinho (UNPROVEN já está decidido por P6), mas tem de ir para a fila do
  humano junto. UNPROVEN.
