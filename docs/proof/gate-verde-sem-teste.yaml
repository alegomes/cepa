        - "P7 — build-hex/agents/proof-reviewer.md: mesmo tratamento no bloco de verdict routing (item 1 da UNPROVEN routing) — 1 asserção foi para FAIL — RED confirmado, restaurado."
        - "ACHADO DE ROBUSTEZ (não bloqueia o veredito): os 3 regexes específicos de marcador-zero (pytest 'no tests ran'/'deselected', go '[no tests to run]', jest 'No tests found') NÃO são individualmente load-bearing — quebrar os três ao mesmo tempo não produziu nenhum RED, porque count_tests_run() já cai no ramo 'n is None' quando o regex não casa, e refine_empty() trata None do mesmo jeito que 0 (ambos viram EMPTY). O comportamento observável (nunca SUCCESS com zero teste) não regride; só a mensagem de motivo fica genérica em vez de nomear o marcador exato."
