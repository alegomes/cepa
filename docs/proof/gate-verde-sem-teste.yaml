  ÚNICO ACHADO DE ROBUSTEZ (não bloqueia, reportado em L3): os 3 regexes de
  marcador-zero específicos por ferramenta (pytest/go/jest) são redundantes
  frente ao fallback "sem contagem reconhecida → EMPTY" — quebrá-los não
  produz SUCCESS falso, só perde a precisão da mensagem de motivo. Nenhum
  nível ficou assumed/skipped/gap/survived/findings no que decide o veredito.
  PROVEN.
