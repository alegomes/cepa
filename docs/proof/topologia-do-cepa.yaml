  declara topologia (P1), a topologia declarada e um plugin instalado deste
  repo (P2), ela tem os dois flows que o /common:autonomous-start e o
  /common:drain-plan despacham (P3, P4), e os flows carregam as duas clausulas
  de prosa de que o supervisor do cepa-until depende — suite em primeiro
  plano (P5a) e commit sem push (P5b). RESSALVA NOMEADA (nao bloqueia o
  veredito, e achado reportado): o conteudo dos dois .md e prosa executada por
  um modelo, nao codigo interpretado — o grep de "tests/run-all.sh" +
  "foreground" e de "Commit" + "No push" (o que o teste mecanico verifica e o
  que P5a/P5b perturbaram) prova que a CLAUSULA EXISTE no texto, nao que o
  modelo vai obedecer-la em toda execucao futura. Essa lacuna estrutural (toda
  prosa de comando tem) e FECHADA aqui, e nao so por leitura, pela evidencia
