  l4_adversarial_input:
    status: n/a
    reason: >-
      a mudança abre uma superfície de entrada (o plan.yaml no disco, e os
      argumentos `--max`/`--status`/`--evidence`/`--human-pending` da CLI),
      mas ela já é adversarialmente coberta pelos próprios comportamentos
      exigidos e perturbados em L3 (id fantasma, ciclo, item já reservado,
      rota humana aberta, evidência vazia, human_pending vazio) — o roteiro de
      recusas exigido pelo card É o roteiro de adversarial input desta CLI.
      `cli` não é o módulo `api-rest` do vocabulário Quarkus (este repo não
      tem um), então a condição estrutural do `n/a` (nenhuma classe mudada em
      módulo input-bearing no sentido Quarkus) é vácua aqui — mas a condição
      de fundo (razão nomeada, diff que abre superfície mas já coberta por L3)
      se mantém, no mesmo padrão de common-plan-etapa2.yaml.
  bugfix_regression_red_at_base:
    status: n/a
    run: "issue_type Feature, não Bug — não há regressão a reproduzir na base"
routing_reason: >-
  Todos os comportamentos pedidos para a etapa 3 ("um escritor, três fontes")
  foram, cada um, quebrados na CLI real (common/bin/cepa-plan) dentro de um
  worktree descartável, e o caso de tests/test_common_drain_plan.py que deveria
  acusar a quebra foi para RED em todas as 12 perturbações — depois restaurado
  e a suíte confirmada GREEN de novo. Cobertura: ordem do lote (não reordenar),
  teto --max, parada em human_pending aberto, parada em item bloqueado por algo
  fora do lote, o caso oposto (dependência interna ao lote não bloqueia),
  parada em in_progress, parada em bloqueado-antes, aviso de bloqueador
  dropped, recusa de plano parallel-waves em queue, recusa de reserva dupla no
  start, exigência de --evidence no finish, recusa de fechar human_pending, e
  preservação do cabeçalho escrito à mão. Nenhum nível ficou
  assumed/skipped/gap/survived; o único n/a estrutural (l4_adversarial_input)
  tem razão nomeada e é honesto quanto ao motivo, no mesmo padrão do card
  anterior da mesma série (common-plan-etapa2). PROVEN.
