base_regression_note: "feature nova, nao Bug. Mesmo assim, testes do head contra o codigo do base 42fe0a3 (worktree descartavel, arquivo de teste de 7f97b70): '✗ 5 falha(s)' (RED); no head, verde."
routing_reason: "7 de 8 perturbacoes viram RED; a oitava sobrevive: trocar a tag leve por anotada deixa a suite verde. O codigo comenta que a tag e leve de proposito, porque com push.followTags uma tag anotada seria enviada junto de um `git push` comum, o que quebraria a promessa 'so no clone'. Nenhum teste liga push.followTags, entao essa garantia nao e carregada por teste. Fechar: no teste test_l2_tag_landing_tags_the_landed_commit_locally, rodar `git config push.followTags true` no clone antes de aterrissar (o assert remote_tags(remote)==\"\" ja existe); com tag anotada isso fica RED. Nota: o comportamento de followTags com tag anotada e documentado do git, nao reconfirmado por mim nesta rodada (o lock bloqueou o experimento)."
