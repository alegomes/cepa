        - "SURVIVED — o bloco inteiro de matar item por timeout (`os.killpg` com SIGTERM/SIGKILL, a `folga` estendendo o prazo) foi trocado por um `except` que finge sucesso silencioso (`matou=False; codigo=0`, sem matar o processo). `tests/test_cepa_until.py` continuou 100% verde: NENHUM teste força um item a estourar o prazo e ser morto. Esse é o mecanismo que a folga (default 60min) e o `--folga` inteiros dependem para existir — está descrito em detalhe no docstring do arquivo e nunca é exercitado. GAP real."
        - "SURVIVED — `parse_ate` (a flag `--until HH:MM`, um dos dois modos de uso documentados: `cepa-until fila --until 07:00`) trocado para sempre lançar `ValueError('quebrado')` — suíte continuou 100% verde. Nenhum teste chama `--until`; só `--for` é exercitado. GAP real: o segundo modo de uso documentado não tem prova alguma."
