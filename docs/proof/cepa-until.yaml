        - "SURVIVED (parcial) — `TERMINAIS = {\"done\",\"blocked\",\"dropped\"}` reduzido para `{\"done\"}` (retirando `blocked` e `dropped` da contagem de progresso): `tests/test_cepa_until.py` continuou 100% verde, INCLUSIVE `test_item_blocked_nao_trava_a_noite_atras_dele`, o teste que existe especificamente para este comportamento. Medido à parte (fora da suíte, replicando o mesmo cenário): com a perturbação, o item `blocked` some da contagem `com_progresso` e entra em `sem_progresso` (`com_progresso=2, sem_progresso=1` vs. `com_progresso=3, sem_progresso=0` sem a perturbação) — nenhuma asserção do teste olha esses dois campos neste cenário. Efeito real: uma sequência de itens que saem `blocked` (não um único) tropeça o disjuntor (default 3) e encerra a janela sozinha — exatamente o incidente que a decisão do dono de 2026-08-30 diz ter resolvido (\"era o último jeito de um item só travar uma janela inteira\"). GAP real e de maior risco: é o comportamento CENTRAL da mudança, sub-provado."
      run: >-
        worktree descartável /tmp/proof-cepa-until (git worktree add --detach,
        base em HEAD=7fd8798, depois em b6dbb23 para a baseline). GREEN de
