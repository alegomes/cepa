routing_reason: >-
  Os 4 achados da rodada anterior (kill por timeout/grupo nunca exercido,
  `--until` sem teste, avisos da fila somem calados, `blocked` saindo da
  contagem de progresso sem nenhuma asserção acusar) foram perturbados de
  novo, de forma independente, e todos foram para VERMELHO — inclusive a
  quinta lacuna que o gate de aceite achou depois (guarda de branch). Duas
  armadilhas de relógio/vacuidade que o implementador relatou ter caído
  também foram conferidas: o teste do kill agora espera passar a hora em que
  o órfão teria escrito o marcador antes de cobrar o silêncio (perturbação
  confirmou: sem essa espera o teste passava com o kill errado); e a
  variável `GRACA_SIGTERM` foi avaliada como costura de teste aceitável, não
  achado, porque tem default seguro e só muda com opt-in explícito do
  ambiente. Não achei nenhum comportamento externally-observable sobrevivendo
  quebrado nesta rodada — por isso não é UNPROVEN. Mas o nível L4
  (adversarial) segue `skipped` por decisão de escopo (não dá para rodar um
  agente real 12h em CI, e a própria instrução desta reprova proíbe tentar
  provar a janela real) — por regra de roteamento, um nível `skipped` nunca
  vira `proven` por si só, mesmo quando não há falha determinística: vira
  NEEDS-HUMAN. Recomendação para o humano: aceitar a prova de mecanismo (o
  relógio, o disjuntor, o kill, as guardas — todos provados load-bearing) e
  tratar a resistência de uma noite real de 12h como risco operacional
  monitorado no primeiro run de verdade, não como bloqueio de merge.
