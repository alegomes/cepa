        - "PASS (RED) — reserva mínima nunca corta: `if restante < reserva:` trocado por `if False:` — 3 asserções de test_reserva_minima_impede_comecar_item_que_nao_cabe foram para FAIL (disparou item que não cabia na janela). Restaurado."
