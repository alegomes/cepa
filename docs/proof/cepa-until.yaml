routing_reason: >-
  A maior parte dos comportamentos declarados pelo implementador (relógio de
  --for, reserva mínima, disjuntor com progresso zerando a contagem,
  human_pending como progresso, guardas de largada, cascata de adiamento no
  cepa-plan, gate do doctor) foi perturbada por mim, de forma independente, e
  cada perturbação foi para VERMELHO (uma delas via timeout/loop infinito,
  tratado como vermelho por instrução explícita). Mas achei, procurando
  especificamente o que NÃO foi perturbado, quatro comportamentos
  externally-observable que sobrevivem quebrados: (1) o bloco inteiro de matar
  um item por timeout — o mecanismo que a `--folga` (default 60min) inteira
  depende para existir, e que o próprio arquivo descreve como central
  ("Onde o corte acontece"); (2) a flag `--until HH:MM`, um dos dois modos de
  uso documentados no próprio `Uso:` do arquivo, sem UM teste sequer; (3) a
  propagação de avisos (`warnings`) do `cepa-plan queue` para o log/ledger; e
  (4), o mais sério, a contagem de `blocked` como progresso no disjuntor — o
  comportamento CENTRAL da decisão do dono de 2026-08-30 ("era o último jeito
  de um item só travar uma janela inteira") tem um teste dedicado
  (`test_item_blocked_nao_trava_a_noite_atras_dele`) que passa mesmo quando
  esse comportamento é removido, porque nenhuma asserção olha
  `com_progresso`/`sem_progresso` nesse cenário — uma sequência de itens
  `blocked` (não um só) pode tropeçar o disjuntor sozinha, sem nenhum teste
  acusando. Isso são hunks externally-observable sobrevivendo à perturbação
  externa (green-when-broken) — por regra de roteamento, isso é UNPROVEN, não
  NEEDS-HUMAN: são gaps determinísticos e nomeáveis, seguros para devolver ao
  time.
