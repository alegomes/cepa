routing_reason: >
  NEEDS-HUMAN por regra 2 (L4 achou algo). Os dois achados da 1ª rodada estão
  RESOLVIDOS e reverificados de forma independente: a correção nas 5 cópias do
  bash-path-lock agora tem cobertura própria (test_bash_path_lock_redir.py fica
  RED perturbando as 7 fontes juntas, o que antes só o detector de divergência
  falhava em pegar), e o aviso de construção indecidível (python3 -c, patch,
  heredoc) está implementado, testado e não engole bloqueio legítimo nem é
  descartável em silêncio — 3 perturbações próprias confirmam. Nenhuma condição
  de UNPROVEN (regra 1) permanece: nenhuma perturbação sobrevive, nenhuma linha
  mudada por este diff ficou sem teste. Mas a checagem pedida pelo coordenador
  ("sobrou alguma rota que não cai nem no bloqueio nem no aviso?") achou uma
  resposta que ainda é sim: curl -o, wget -O, rsync, touch e `python3
  arquivo.py` escrevem sem bloqueio, sem aviso e sem log — uma 3ª categoria,
  distinta dos dois achados fechados nesta rodada, que o card não cobriu e a
  suíte não documenta como escopo aceito.
