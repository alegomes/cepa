routing_reason: >
  NEEDS-HUMAN por regra 2 (L4 achou algo), mesma regra da rodada anterior — o
  motivo mudou de conteúdo, não de forma. Os achados 1, 2 e 3 (perturbação
  sobrevivente nas 5 cópias; python3 -c/patch silenciosos; curl/wget/touch/
  rsync silenciosos) estão todos RESOLVIDOS e reverificados de forma
  independente nesta rodada — nenhuma condição de UNPROVEN (regra 1)
  permanece: nenhuma perturbação sobrevive, nenhuma linha mudada por este
  diff ficou sem teste, e a exclusão declarada (curl -O / wget sem destino) é
  coberta por comportamento, não só por prosa. Mas a pergunta desta rodada —
  "sobra uma 4ª rota?" — tem resposta sim, e mais especificamente: `git
  checkout -- <caminho>` / `git restore <caminho>` reabrem exatamente o
  padrão de risco do `git mv` (mesma ferramenta, já parcialmente
  instrumentada, mesmo efeito de sobrescrever fora da lista) sem gerar
  nenhum sinal — nem bloqueio nem aviso —, e `scp` é o irmão não-coberto do
  `rsync` que acabou de ganhar tratamento nesta mesma rodada. `python3
  arquivo.py` (rodar um script) segue como débito aberto desde a rodada
  anterior, não mencionado no commit desta.
