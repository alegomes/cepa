routing_reason: >
  UNPROVEN por regra 1 (perturbação sobrevivente): a mudança nas 5 cópias +
  molde de bash-path-lock.py (filtro de token vazio, que fecha o falso-bloqueio
  do sed BSD `-i ''`) não tem cobertura própria em test_bash_path_lock_redir.py
  — só existe cobertura INDIRETA via a cópia paralela em _shellscan.py, testada
  através do modo-escrita-gate. Se as duas fontes regredirem JUNTAS (o estado
  real do base_commit, ou uma futura edição feita nas duas ao mesmo tempo), o
  detector de divergência entre fontes (test_lock_copies_drift.py) não acusa
  nada, porque ele compara as fontes ENTRE SI, não o comportamento certo.
  Além disso, L4 achou um escape real e silencioso (python3 -c, patch) que
  contradiz a promessa do próprio hook de fechar o Bash como rota de fuga —
  registrado como finding, não como segundo motivo do veredito (o motivo
  mecânico já é a perturbação sobrevivente).
