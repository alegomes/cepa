routing_reason: >-
  15 das 17 perturbações desenhadas para os 8 comportamentos pedidos foram
  para RED (o teste que deveria acusar a quebra realmente acusou). DUAS
  sobreviveram (P3b e P17), ambas no comportamento 3 (queue nunca reescreve o
  plan.yaml) e no comportamento 8 (reconcile nunca anexa card ausente do
  plano) — nos dois casos a implementação real está correta (lida linha por
  linha), mas o teste que deveria proteger essa invariante contra regressão
  futura não olha o estado em disco: compara bytes que não mudam quando a
  escrita é idempotente (P3b), ou confere só um campo do relatório JSON em vez
  do plan.yaml gravado (P17). Por regra "perturbação verde = comportamento não
  é load-bearing no teste que deveria guardá-lo", isso é UNPROVEN — não porque
  o código de b71a404 esteja errado, mas porque a prova que o protegeria
  contra a próxima regressão ainda não existe. Rota de fechamento: acrescentar,
  em test_adiar_nao_reescreve_a_ordem_gravada, uma checagem independente de
  bytes (ex.: mtime do arquivo antes/depois de queue(), ou um monkeypatch que
  falha se grava_corpo for chamada dentro de cmd_queue); e em
  test_reconcile_nunca_anexa_card_nem_fecha_divida_humana, ler plan.yaml do
  disco após --apply e afirmar que os ids de `missing_from_plan` (W-9) NÃO
  aparecem em `items`.
