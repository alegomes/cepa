  As duas sobreviventes do ciclo anterior (P3b, P17) foram fechadas
  exatamente como recomendado: test_adiar_nao_reescreve_a_ordem_gravada agora
  confere st_mtime_ns/st_ino além do conteúdo, e
  test_reconcile_nunca_anexa_card_nem_fecha_divida_humana agora relê
  plan.yaml do disco depois do --apply. Reconfirmadas RED nas duas
  reinjeções (P3b-reteste, P17-reteste). As checagens novas de prosa
  aguentaram 4 das 5 perturbações desenhadas (P18, P20, P21, P22 foram
  vermelhas) e a reamostragem de comportamentos antigos (P1, P13) não
  mostrou afrouxamento algum. MAS uma sobrevivente NOVA apareceu: a checagem
  "e a reconciliação é o passo 0, ANTES de resolver a fila" em
  test_contrato_do_comando (drain-plan.md) fica verde mesmo depois de mover
  fisicamente o bloco de reconciliação para DEPOIS do passo 1 — porque o
  parágrafo de introdução do comando (antes de "## Workflow") já cita
  "cepa-plan reconcile" de passagem, e o corte de texto que a checagem faz
  (`f.split("### 1.")[0].split("### 0.")[-1]`) degrada silenciosamente para
  "o texto inteiro antes do primeiro passo 1" quando "### 0." deixa de
  aparecer ANTES de "### 1." no arquivo — em vez de detectar a ausência e
  falhar. Por regra "perturbação verde = comportamento não é load-bearing no
  teste que deveria guardá-lo", isso é UNPROVEN de novo — desta vez numa
  checagem introduzida no PRÓPRIO commit 853b67e, não numa herdada do
  anterior. Rota de fechamento sugerida: trocar o corte por posições
  numéricas explícitas (`i0 = f.index("### 0. Reconciliar")`,
  `i1 = f.index("### 1. Resolver a fila")`, exigir `i0 < i1` E que
  "cepa-plan reconcile" ocorra especificamente no intervalo `f[i0:i1]`, não
  em qualquer prefixo antes de `i1`).
