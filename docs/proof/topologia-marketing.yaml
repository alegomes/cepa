routing_reason: "Quase todo hunk mudado (path-lock.py, o arquivo GERADO
  bash-path-lock.py, marketplace.json, LANES do teste de execução, a linha do
  catálogo de comandos) foi perturbado isoladamente numa worktree descartável
  e voltou VERMELHO — nenhum desses sobreviveu à quebra. Mas um hunk real do
  diff sobreviveu: a linha que registra 'marketing' em
  bin/gen-locks.py:TOPOLOGIES (e sua espelhada em
  tests/test_lock_copies_drift.py:TOPOLOGIES) pode ser apagada sem que
  NENHUM teste do repositório acuse — o `--check` do gerador e o teste de
  anti-deriva contam quantas cópias existem usando a MESMA lista que perdeu a
  entrada, então a contagem sempre bate consigo mesma. Isso não é
  externamente observável (não há camada HTTP neste harness), mas é
  exatamente o `defense-in-depth` que este gate existe para pegar: um passo
  do onboarding da topologia nova (a linha em TOPOLOGIES) não é hoje
  load-bearing — se ela sumir por engano numa edição futura, a cópia
  `marketing/hooks/bash-path-lock.py` para de ser regenerada quando o molde
  comum mudar, e nada avisa. Rota mecânica: hunk sobrevivente em nível não
  PIT-instrumentável → l3.perturbation: survived → l2_coverage: gap →
  `proven` estruturalmente indisponível → UNPROVEN."
