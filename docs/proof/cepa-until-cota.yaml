  o teste que faltava (test_item_que_fecha_entre_cortes_zera_a_contagem,
  encadeando corte→corte→item fecha→corte→item fecha) e estabiliza dois testes
  intermitentes fixando o reset. Reperturbei a única sobrevivente da rodada 1
  (common/bin/cepa-until:841, `esperas_seguidas = 0` no ramo `if progresso:`)
  no worktree descartável /tmp/proof-cepa-until-cota: removida a linha, o
  teste novo foi para VERMELHO (3 falhas, incluindo "as 5 chamadas
  aconteceram" — só 4 aconteceram, o run parou uma chamada antes por engano).
  Restaurada a linha, as três suítes (test_cepa_until_cota.py,
  test_cepa_until.py, test_cepa_until_adversarial.py), rodadas em sequência,
  voltaram 100% verdes. As outras onze perturbações da rodada 1 continuam
  válidas sem precisar ser refeitas, porque a linha que cada uma quebra não
  mudou. Não há mais lacuna nomeada nem lacuna estrutural: PROVEN.
