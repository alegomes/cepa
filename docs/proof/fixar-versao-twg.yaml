routing_reason: >
  Todas as linhas de comportamento alteradas nos dois scripts (guarda de
  silêncio sem declaração, comparação igual/diferente, None quando ausente,
  leitura por item vs. cache, e a própria gravação do campo twg_version no
  evento item_start) foram quebradas uma a uma em worktree descartável e cada
  quebra fez o teste de regressão correspondente ir de verde para vermelho.
  O L4 adversarial rodou 4 entradas atacando a extração por regex e o
  timeout, todas limpas. A resolução docs-vs-.claude do manifesto de
  ambiente é código pré-existente (_wtlib.env_manifest_path), não tocado
  neste diff, e já coberto por teste que passou verde na baseline sem
  perturbação minha. O bump de versão do plugin.json e a atualização de
  docs/env-manifest.md são não-comportamentais.
finding_vacuous_test: >
  test_sem_twg_no_path_grava_null (tests/test_cepa_until_twg_version.py)
  continuou verde mesmo com o campo twg_version REMOVIDO do evento — porque
  o assert é `.get("twg_version") is None`, que é verdadeiro tanto para
  "campo ausente" quanto para "campo presente e None". Não bloqueia o
  veredito porque as outras duas asserções do MESMO arquivo já capturaram a
  quebra (RED), mas o teste em si é vácuo para este caso específico e vale
  reforçar com um `"twg_version" in evento` explícito.
finding_message_accuracy: >
  Quando a CLI `twg` trava além do timeout de 10s (não crasha, não sai do
  PATH, só demora), o doctor e o cepa-until tratam isso como se ela
  estivesse ausente ('não está instalada ou não está no PATH'). Funciona
  (nunca trava o run, sempre avisa), mas a mensagem confunde quem for
  investigar depois.
