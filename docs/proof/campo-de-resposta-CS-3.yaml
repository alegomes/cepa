  l4_adversarial_input:
    status: clean
    findings: []
    run: >-
      `git worktree add --detach /tmp/proof-cs3-r3 b757d23`; runner Python em primeiro plano (`python3 -I l4run.py <caso>...`) que reaproveita build_repo, fake_claude(BLOCKS_WITH_QUESTION), run_until e on_tty de tests/test_cepa_until_decide.py e dirige `cepa-until decide fila/<run>` numa pty real, com `$EDITOR` apontando para um editor falso que ANEXA o conteúdo hostil ao arquivo temporário (o cabeçalho `#` fica). Entradas `v` e, quando há texto, `s`. Para cada caso conferi: sem "Traceback" na tela, rc 0, todos os .yaml sob programs/plans recarregam com yaml.safe_load, e o item ou foi gravado com o texto preservado ou ficou intacto com mensagem. Worktree removido ao fim.
      Resultados (10 casos, 0 achados):
      (1) byte \xcb no meio da palavra -> gravado; o byte vira U+FFFD (`errors="replace"`), o resto do texto e a segunda linha ficam; item `pending`.
      (2) CRLF -> gravado "linha 1\nlinha 2", sem \r (splitlines).
      (3) 7 linhas em branco entre linhas -> gravado com as quebras e as linhas em branco preservadas.
      (4) ~5.000 bytes, 80 linhas com acento (ç, ã, ú) -> gravado inteiro (evidência de 6.421 caracteres incluindo o texto anterior), item `pending`, yaml recarrega.
      (5) só linhas `#` -> texto vazio: item continua `blocked` com a evidência original, sem Traceback e sem prompt de envio (mensagem de vazio é CS-6).
      (6) resposta terminando em `?` -> cepa-plan recusa ("resposta recusada para a1: o texto é uma pergunta, não uma resposta; nada foi gravado" + a pergunta da rota + dica de --force); item intacto, fila intacta, sem crash.
      (7) texto hostil a YAML (`: isso`, `- item`, aspas simples e duplas, `| pipe`, `{a: [b}`, `& *ref !tag %dir @at` e crase) -> gravado literal; yaml recarrega; só a indentação inicial de cada linha é achatada pelo `" ".join(l.split())` do --multiline.
      (8) primeira linha começando com `|` -> gravado literal, yaml recarrega.
      (9) `$EDITOR` entre aspas apontando para script em diretório com espaço no caminho -> editor abre, gravado "com espaco\nok", `pending`.
      (10) `$EDITOR="<script> --flag"` (divisão de shell no estilo git) -> script recebe `--flag` como $1, gravado "com flag\nok", `pending`.
      Caso extra, sem entrar na contagem: `$EDITOR` SEM aspas com espaço no caminho (`.../fake editor.sh`) é dividido pelo shell, o editor não abre, o item fica `blocked` com evidência intacta e a tela mostra o erro do shell, sem Traceback (igual ao git; mensagem melhor é CS-6).
      Observações sem veredito (não são achados do CS-3): o byte inválido é trocado por U+FFFD em vez de recusado; uma linha da resposta que comece com `#` é descartada pelo filtro (desenho declarado, como mensagem de commit do git) e nenhum teste cobre isso.
