routing_reason: >-
  O comportamento pedido pelo CS-3 está preso: tirando o chip, a tecla, o
  repasse de --multiline, o ramo multilinha do cepa-plan ou a checagem de
  saída do editor, o teste fica vermelho. Mas uma linha que o diff criou, a
  que remove do texto salvo o cabeçalho `#` (id, título e pergunta do item),
  pode ser quebrada sem nenhum teste reclamar, porque o editor falso apaga o
  cabeçalho ao gravar. Um editor de verdade (vi, code --wait) mantém o
  cabeçalho, e a resposta do dono sairia com a pergunta dentro. Fechar:
  um segundo editor falso que acrescenta a linha de resposta ao arquivo sem
  apagar o cabeçalho e o teste conferir que a evidência não contém o id nem
  a pergunta.
