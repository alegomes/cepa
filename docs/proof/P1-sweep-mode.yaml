  l2_coverage:
    status: assumed
    uncovered_lines: []
    run: >
      Não há ferramenta de cobertura aplicável a prosa markdown (não é código
      instrumentável). Para o artefato real (plan.yaml), não há linha
      "descoberta" no sentido de cobertura de código — o cepa-dor lê o
      arquivo inteiro a cada invocação, e isso foi demonstrado diretamente no
      L3 (o mesmo binário lê e reage tanto ao original quanto à cópia
      perturbada, e agora também a um segundo artefato real produzido de
      forma independente — EIXO 3). Reavaliado em 2026-08-23 à luz do EIXO 3:
      uma segunda execução bem-sucedida e cega de program-plan.md por um
      agente fresh é mais uma amostra de comportamento correto, não uma
      medição de cobertura. Ela não identifica quais frases/blocos da prosa
      foram de fato exercitados, nem quais ficaram nunca lidos/nunca
      relevantes — é exatamente o tipo de pergunta que uma ferramenta de
      cobertura formal responderia e que reruns manuais não respondem, por
      mais que se acumulem. N reruns bem-sucedidos aumentam a confiança
      indutiva no comportamento típico do agente, mas não convertem
      "nenhuma medição" em "medição parcial" — a lacuna é de instrumentação
      (não existe o equivalente de um coverage.py para prosa conversacional
      seguida por um agente Claude), não de quantidade de amostras. Mantenho
      `assumed`: a evidência estrutural do L3 é agora mais robusta (dois
      eixos + uma réplica independente), mas este nível continua sem
      instrumentação formal, e essa lacuna não decide sozinha se é aceitável
      — chamada do humano, não minha.
