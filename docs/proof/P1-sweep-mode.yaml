routing_reason: >
  Os dois eixos originais aplicáveis a este card conversacional passaram com
  evidência verificada e reproduzida por mim, green→red→green, em dois
  worktrees git descartáveis distintos (/tmp/proof-P1-sweep-mode-axis1 e
  -axis2, criados a partir de 995625c, ambos removidos ao final; git status
  --porcelain limpo na árvore principal nos dois casos). Eixo 1 prova que a
  trava de regressão da prosa (tests/test_program_plan_sweep.py) é sensível a
  mudanças reais no texto que o próximo agente vai ler. Eixo 2 prova que o
  gate mecânico (cepa-dor) de fato lê e avalia o conteúdo do plan.yaml real
  produzido pela sessão de varrimento. Em 2026-08-23 recebi nova evidência: um
  segundo agente, sem contexto desta sessão, seguiu program-plan.md do zero
  numa fatia diferente do BACKLOG.md e produziu de forma independente um
  segundo plan.yaml real (lotes-sweep-verify). Reproduzi eu mesmo, ao vivo,
  `cepa-dor --wave 1` e `--wave 2` sobre esse segundo artefato, apontando
  --repo para esta worktree — os resultados batem exatamente com o relatado
  pelo agente fresh (3/3 READY exit=1 na onda 1; 0/1 READY exit=2 na onda 2,
  vetada pela mesma zona de enforcement e pelo mesmo human_gate aberto). Isso
  vira EIXO 3 dentro de l3_load_bearing, reforçando a confiança comportamental
  de que a prosa é seguível corretamente por um agente cego. MAS isso não
  fecha l2_coverage: a lacuna ali não é "poucas amostras", é ausência de
  instrumentação — não existe ferramenta que meça qual fração da prosa de
  program-plan.md foi exercitada, nem por uma nem por N execuções bem-
  sucedidas. Rerun manual, por mais que se acumule, mede comportamento típico
  (mais L3), não substitui medição de cobertura (L2). Pela regra do schema, um
  nível `assumed` torna `proven` estruturalmente indisponível, mesmo com L3
  robusto em três eixos. Mantenho NEEDS-HUMAN — não por dúvida sobre o
  resultado do L3, que agora tem uma segunda amostra independente concordante,
  mas porque este gate segue sem instrumentação para fechar L2 nesta natureza
  de card, e essa lacuna estrutural continua sendo chamada do humano, não
  minha.
