  l4_adversarial_input:
    status: findings
    reason: >-
      o diff abre uma superficie de entrada: o teste consome docs/commands.md
      como texto livre com um regex ancorado por linha, entao testei entradas
      adversarias contra esse regex especifico em busca de outra forma de
      "documentar" um comando sem uma linha de catalogo de verdade.
    findings:
      - >-
        GAP NOVO (nao e o mesmo da rodada anterior, que foi fechado) — o
        regex `^\|\s*`/plugin:cmd`\s*\|` (com re.M) casa em QUALQUER linha
        que comece com pipe, inclusive dentro de um comentario HTML
        `<!-- ... -->`. Apaguei a linha real de tabela de
        /build-solo:plan-build-validate e coloquei uma linha de tabela
        idêntica dentro de um comentario HTML no fim do arquivo (`<!--\n|
        \`/build-solo:plan-build-validate\` | x | y |\n-->`). O teste
        continuou 100% verde (8/8 "ok", exit 0) porque o regex le o texto
        bruto do arquivo e nao sabe que aquele trecho esta comentado — no
        markdown renderizado (GitHub, VS Code preview, etc.) essa linha e
        invisivel, entao o comando fica de fato sem documentacao visivel
        para quem le o catalogo, mas o guard mecanico aceita. Restaurado
        apos o teste.
