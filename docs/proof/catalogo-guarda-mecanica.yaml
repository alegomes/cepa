        - "P4 (o gap exato da rodada 2, reproduzido na arvore real de docs/commands.md, nao so no autoteste do arquivo de teste) — apaguei a linha de tabela real de /build-solo:plan-build-validate e recriei a MESMA linha dentro de um comentario HTML (`<!--\\n| ... |\\n-->`) no fim do arquivo: o teste foi para FAIL citando exatamente /build-solo:plan-build-validate como fora do catalogo — RED confirmado. Restaurado, GREEN de novo (9/9, exit 0)."
