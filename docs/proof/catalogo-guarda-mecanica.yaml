routing_reason: >-
  O gap que gerou o NEEDS-HUMAN da rodada anterior (mencao solta em prosa
  substituindo a linha de tabela) esta fechado: P1 confirma que apagar a
  linha real e deixar so a frase solta agora acusa RED citando o comando
  certo. P2 confirma que o marcador da Parte 1 do /common:spec, sozinho,
  nao bastava — a linha de tabela nova do fix e que fecha aquele buraco
  especifico. P3 confirma que a checagem de prefixo (ja presente desde a
  rodada anterior) continua funcionando contra a arvore real, nao so contra
  o teste unitario do proprio arquivo. Mas a busca por "qualquer jeito
  remanescente de passar sem linha de catalogo" achou um gap novo e real: o
  regex ancorado por linha nao distingue uma linha de tabela viva de uma
  linha de tabela identica dentro de um comentario HTML — o comando fica
  fora da documentacao visivel e o guard aceita mesmo assim. Isso e um
  achado de L4, nao hipotetico (reproduzido e revertido na arvore real), e a
  documentacao do proof-reviewer classifica achado de L4 como bloqueante por
  definicao: nao sou eu quem decide se esse gap e aceitavel para fechar o
  card agora ou se vira um proximo item de fila. Veredito mecanico da rota:
  NEEDS-HUMAN.
