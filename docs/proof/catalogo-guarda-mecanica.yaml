    run: >-
      leitura estrutural (nao ha coverage tool wired neste repo Python): a
      unica mudanca do diff 46ee306..39ab099 e a linha `re.sub(r"<!--.*?-->",
      ...)` dentro de `faltando()` mais o autoteste novo que a exercita. A
      perturbacao P4 cobre exatamente essa linha na arvore real (nao so no
      autoteste) e ela nao ficou verde ao ser quebrada.
  l4_adversarial_input:
    status: findings
    reason: >-
      o diff continua abrindo a mesma superficie de entrada da rodada
      anterior: o teste consome docs/commands.md como texto livre com um
      regex ancorado por linha depois de um pre-processamento que remove só
      comentarios HTML. Testei se existe outro jeito de mascarar uma linha
      de tabela viva que o pre-processamento atual nao cobre.
    findings:
      - >-
        GAP NAO FECHADO POR ESTE COMMIT (mesma familia do gap da rodada 2,
        mecanismo de disfarce diferente) — uma linha de tabela real dentro
        de um bloco de codigo cercado por tres crases (```` ``` ````) tambem
        passa pelo regex ancorado por linha sem ser filtrada, porque o
        pre-processamento novo so remove `<!-- -->`, nao blocos de codigo.
        Reproduzido e revertido na arvore real (ver a perturbacao "Achado L4"
        na secao l3 acima): apagar a linha real e recria-la dentro de um
        bloco cercado manteve o teste 100% verde.
        Avaliacao de risco para o humano decidir (nao decido isso sozinho):
        ao contrario do comentario HTML (que fica INVISIVEL no markdown
        renderizado — GitHub, VS Code preview etc. — e por isso e um jeito
        plausivel de "sumir" uma linha sem ninguem notar), uma linha de
        tabela dentro de um bloco cercado aparece no render como texto
        pre-formatado quebrado e feio: qualquer um que abra o preview do
        arquivo notaria o bloco de codigo estranho imediatamente. Minha
        leitura e que nao e um jeito realista de um comando escapar do
        catalogo por acidente ou por um "veja tambem" descuidado — exigiria
        alguem deliberadamente cercar uma linha de tabela em tres crases,
        sem motivo de autoria plausivel. Recomendo fechar mesmo assim, e ja,
        porque o custo e trivial: adicionar
        `texto = re.sub(r"\`\`\`.*?\`\`\`", "", texto, flags=re.S)` ao lado
        da linha de comentario HTML em faltando() (mesmo padrao usado para o
        comentario HTML), sem novo ciclo de rodada. Mas a decisao de aceitar
        o risco como esta ou exigir o fechamento antes de fechar o card e do
        humano — o guard mecanico (proof-verdict-guard.py) bloqueia
        `verdict: proven` sempre que L4 tem findings, e essa regra nao e
        minha para contornar mesmo quando julgo o achado de baixo risco.
  bugfix_regression_red_at_base:
    status: n/a
    run: "issue_type Feature, nao Bug — nao ha regressao a reproduzir na base"
routing_reason: >-
  O gap que gerou o NEEDS-HUMAN da rodada 2 (linha de tabela real escondida
  dentro de um comentario HTML) esta fechado: a perturbacao "P4" reproduziu o
  cenario exato na arvore real de docs/commands.md (nao so no autoteste
  dentro do proprio arquivo de teste) e o guard foi para RED citando o
  comando certo. A perturbacao "P2" reconfirma que o gap da rodada 1 (mencao
  solta em prosa) continua fechado e nao foi reaberto por este fix. A busca
  por "mais algum jeito remanescente" achou um gap real da mesma familia
  (bloco de codigo cercado por tres crases tambem escapa do
  pre-processamento) — documentado em l4_adversarial_input.findings com
  minha avaliacao de que e baixo risco (visivel no render, sem motivo de
  autoria plausivel) e recomendacao de fechar mesmo assim, ja que o custo e
  trivial. Mas a definicao do proof-reviewer e mecanica aqui: achado de L4
  bloqueia `proven` estruturalmente, e o proof-verdict-guard.py recusa
  gravar `verdict: proven` ao lado de um `l4_adversarial_input.status:
  findings` — nao e uma decisao minha para pesar, e a politica que existe
  justamente para eu nao autocertificar um "achado de baixo risco" como se
  fosse aceitavel. Veredito mecanico da rota: NEEDS-HUMAN, com recomendacao
  explicita de fechar o gap do bloco cercado (troca trivial) e voltar para
  nova rodada, ou o humano aceitar o risco e liberar manualmente.
