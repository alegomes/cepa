        - "PERTURBAÇÃO 1 (load-bearing, RED) -- revertido em common/bin/cepa-plan todo o hunk da regra R3 (git apply -R do diff base->head restrito a esse arquivo, isolando exatamente a mudança de produção do card, teste do HEAD mantido): python3 tests/test_common_drain_plan.py -> 12 falhas, exit 1, incluindo os 3 asserts do teste-alvo ('card done que voltou atrás no quadro NÃO vira divergência (R3)', 'nenhum item done vira divergência, qualquer que seja o quadro', 'e o disco guarda todos como done depois do --apply') e as 2 regressões vizinhas. Restaurado com `git -C <worktree> checkout 8f84bb2 -- <worktree>/common/bin/cepa-plan` (pathspec absoluto, fora da raiz do clone principal — o path-lock e o modo-escrita-gate da sessão não têm jurisdição ali), GREEN reconfirmado (154 ok, exit 0)."
        - "PERTURBAÇÃO 2 (load-bearing, RED) -- dentro do bloco R3, trocado `if papel in (\"done\", \"em-revisao\"):` por `if False:` (o item done nunca mais entra em_dia, mesmo quando o quadro já bate — Code Review/Concluído incluídos): python3 tests/test_common_drain_plan.py -> 2 falhas, exit 1 ('done + Code Review fica em dia', 'done + Concluído fica em dia, sem aviso') — confirma que o ramo silencioso (sem aviso quando o quadro já corresponde ao papel done/em-revisao) é load-bearing e não um efeito acidental do `continue`. Restaurado (mesmo comando de pathspec absoluto), GREEN reconfirmado (154 ok, exit 0)."
        - "VERIFICAÇÃO INDEPENDENTE DO FECHAMENTO DO GAP (2ª rodada desta prova, commit 5464f2b, feita a pedido do coordenador sobre um teste que a sessão principal escreveu, não eu): nova worktree descartável /private/tmp/proof-reconcile-l2-fechado (git worktree add --detach 5464f2b), endereçada pelo caminho literal. (a) GREEN no head: python3 tests/test_common_next.py -> 8 ok, incluindo as 2 asserções novas de test_item_done_nao_desce_de_categoria, exit 0. (b) RED com common/commands/next.md na versão da base (git checkout 7aa500b -- <path literal>/common/commands/next.md, doc ainda sem a regra R3): 2 falhas, exit 1, ambas no teste novo. Restaurado (git checkout 5464f2b -- <path literal>/common/commands/next.md), GREEN reconfirmado. (c) PERTURBAÇÃO por frase, cada uma isolada e restaurada antes da próxima: c1 — reescrevi a linha 168 removendo só 'stays `done`** (rule R3:' (troquei para 'gets updated** (per policy:', mantendo a segunda frase intacta) -> 1 falha, exit 1, exatamente 'a tabela diz que item done continua done contra o quadro (R3)'; a segunda asserção continuou 'ok'. Restaurado, GREEN reconfirmado. c2 — reescrevi a mesma linha removendo só 'reopening it is the user's call, through `/common:plan`' (troquei para 'it is a call for the team lead to make', mantendo 'stays `done`... rule R3' intacto) -> 1 falha, exit 1, exatamente 'e que reabrir é decisão do usuário, pelo /common:plan'; a primeira asserção continuou 'ok'. Restaurado, GREEN reconfirmado (8 ok, exit 0) e reconfirmei também python3 tests/test_common_drain_plan.py -> 'all green' no mesmo head."
      run: >-
        Duas worktrees descartáveis nesta prova, cada uma endereçada pelo
